<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Cartucho RYU_FLOW para SIGA-98</title>
  <desc id="desc">Hoja visual con frontal, trasera y contactos de un cartucho ficticio de la Portátil Color 98. Referencia de arte para el issue 440.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1720"/>
      <stop offset="1" stop-color="#172b34"/>
    </linearGradient>
    <linearGradient id="plastic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34383b"/>
      <stop offset="0.55" stop-color="#1f2326"/>
      <stop offset="1" stop-color="#111416"/>
    </linearGradient>
    <linearGradient id="label" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#062a3b"/>
      <stop offset="0.55" stop-color="#0a4660"/>
      <stop offset="1" stop-color="#0c1a29"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe28a"/>
      <stop offset="0.45" stop-color="#c9962e"/>
      <stop offset="1" stop-color="#765116"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="440" result="noise"/>
      <feBlend in="SourceGraphic" in2="noise" mode="soft-light"/>
    </filter>
    <clipPath id="frontLabelClip"><rect x="190" y="190" width="620" height="525" rx="18"/></clipPath>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <path d="M0 810 C260 730 470 900 760 824 S1260 730 1600 844 V1000 H0 Z" fill="#081016" opacity="0.75"/>
  <g opacity="0.2" stroke="#88d8e8" stroke-width="2">
    <path d="M0 110 H1600 M0 280 H1600 M0 450 H1600 M0 620 H1600 M0 790 H1600"/>
    <path d="M160 0 V1000 M420 0 V1000 M680 0 V1000 M940 0 V1000 M1200 0 V1000 M1460 0 V1000"/>
  </g>

  <text x="90" y="78" fill="#d8edf0" font-family="monospace" font-size="34" font-weight="700">SIGA-98 / PORTÁTIL COLOR 98</text>
  <text x="90" y="118" fill="#7fb4bf" font-family="monospace" font-size="19">REFERENCIA VISUAL · RYU_FLOW · ISSUE #440</text>

  <!-- Frontal -->
  <g filter="url(#shadow)">
    <path d="M130 150 H870 L900 185 V795 L862 835 H138 L100 795 V185 Z" fill="url(#plastic)" stroke="#5d6264" stroke-width="8"/>
    <path d="M130 150 H870 L900 185 H100 Z" fill="#454b4f" opacity="0.9"/>
    <rect x="190" y="190" width="620" height="525" rx="18" fill="url(#label)" stroke="#8ca6ad" stroke-width="5"/>
    <g clip-path="url(#frontLabelClip)">
      <circle cx="690" cy="300" r="84" fill="#d9edf2" opacity="0.86"/>
      <circle cx="690" cy="300" r="70" fill="#9cc2cc" opacity="0.24"/>
      <g fill="#07131c" opacity="0.72">
        <rect x="250" y="410" width="110" height="170"/>
        <rect x="370" y="345" width="92" height="235"/>
        <rect x="475" y="385" width="118" height="195"/>
        <rect x="610" y="430" width="70" height="150"/>
        <rect x="700" y="390" width="84" height="190"/>
      </g>
      <g stroke="#55c4e7" stroke-width="10" opacity="0.76" fill="none">
        <path d="M205 510 C300 430 360 555 455 475 S615 380 770 455"/>
        <path d="M228 545 C335 480 400 600 505 520 S650 435 792 500"/>
      </g>
      <!-- Ryū original, serpenteante y esquemático -->
      <path d="M236 354 C312 244 474 250 548 326 C618 398 545 482 475 455 C408 430 423 350 495 340 C570 330 666 365 739 421" fill="none" stroke="#d4edf2" stroke-width="34" stroke-linecap="round" opacity="0.96"/>
      <path d="M236 354 C312 244 474 250 548 326 C618 398 545 482 475 455 C408 430 423 350 495 340 C570 330 666 365 739 421" fill="none" stroke="#2a91b1" stroke-width="18" stroke-linecap="round" opacity="0.9"/>
      <path d="M719 403 L770 420 L733 446 L694 433 Z" fill="#d4edf2"/>
      <path d="M744 408 L786 387 L773 430" fill="none" stroke="#d4edf2" stroke-width="8" stroke-linecap="round"/>
      <circle cx="757" cy="415" r="5" fill="#f6b949"/>
      <path d="M280 316 l-30 -28 M302 300 l-4 -39 M332 294 l22 -35" stroke="#d4edf2" stroke-width="8" stroke-linecap="round"/>
      <g opacity="0.34" stroke="#c6eef7" stroke-width="3">
        <path d="M220 220 L775 665 M180 300 L700 715 M310 190 L815 595"/>
      </g>
    </g>
    <rect x="215" y="214" width="260" height="54" rx="8" fill="#071018" opacity="0.75"/>
    <text x="238" y="249" fill="#e8f4f5" font-family="monospace" font-size="28" font-weight="700">SIGA-98</text>
    <text x="225" y="638" fill="#f1f1e8" font-family="sans-serif" font-size="76" font-weight="800" letter-spacing="4">RYU_FLOW</text>
    <text x="228" y="679" fill="#9cdeec" font-family="monospace" font-size="24">EL FLUJO LO CONECTA TODO</text>
    <text x="744" y="690" fill="#d7e7e8" font-family="serif" font-size="50">流</text>
    <path d="M410 742 h180" stroke="#555b5e" stroke-width="4"/>
    <path d="M455 770 h90 l-45 34 Z" fill="#171a1c" stroke="#5b6062" stroke-width="4"/>
  </g>

  <!-- Trasera -->
  <g transform="translate(1010 170)" filter="url(#shadow)">
    <path d="M0 0 H430 L452 24 V470 L426 496 H18 L-8 470 V24 Z" fill="url(#plastic)" stroke="#5d6264" stroke-width="7"/>
    <circle cx="221" cy="55" r="12" fill="#101315" stroke="#5c6365" stroke-width="4"/>
    <path d="M168 78 h106" stroke="#4c5154" stroke-width="4"/>
    <text x="145" y="120" fill="#111" stroke="#545a5d" stroke-width="2" font-family="sans-serif" font-size="42" font-weight="800">SIGA</text>
    <rect x="70" y="154" width="310" height="196" rx="12" fill="#0b0f11" stroke="#4e5456" stroke-width="4"/>
    <text x="95" y="190" fill="#d9e7e8" font-family="monospace" font-size="21" font-weight="700">RYU_FLOW</text>
    <text x="95" y="222" fill="#a9b9ba" font-family="monospace" font-size="16">© 1998 SIGA · ESPACIOKOOP</text>
    <text x="95" y="250" fill="#a9b9ba" font-family="monospace" font-size="16">PORTÁTIL COLOR 98</text>
    <text x="95" y="278" fill="#a9b9ba" font-family="monospace" font-size="16">REFERENCIA DIEGÉTICA</text>
    <text x="95" y="306" fill="#a9b9ba" font-family="monospace" font-size="16">NO ES UNA ROM FUNCIONAL</text>
    <path d="M302 195 q22 -18 44 0 q-22 18 -44 0 M302 219 q22 -18 44 0 q-22 18 -44 0 M302 243 q22 -18 44 0 q-22 18 -44 0" fill="none" stroke="#71c9da" stroke-width="5"/>
    <g stroke="#4a4f51" stroke-width="5">
      <path d="M66 395 H378 M66 414 H378 M66 433 H378"/>
    </g>
  </g>

  <!-- Contactos -->
  <g transform="translate(1010 710)" filter="url(#shadow)">
    <path d="M0 0 H452 V118 L420 148 H32 L0 118 Z" fill="#15191b" stroke="#555c5f" stroke-width="7"/>
    <rect x="42" y="32" width="368" height="66" rx="8" fill="#07090a" stroke="#3c4143" stroke-width="4"/>
    <g fill="url(#gold)">
      <rect x="58" y="44" width="18" height="46"/><rect x="84" y="44" width="18" height="46"/><rect x="110" y="44" width="18" height="46"/><rect x="136" y="44" width="18" height="46"/><rect x="162" y="44" width="18" height="46"/><rect x="188" y="44" width="18" height="46"/><rect x="214" y="44" width="18" height="46"/><rect x="240" y="44" width="18" height="46"/><rect x="266" y="44" width="18" height="46"/><rect x="292" y="44" width="18" height="46"/><rect x="318" y="44" width="18" height="46"/><rect x="344" y="44" width="18" height="46"/><rect x="370" y="44" width="18" height="46"/>
    </g>
  </g>

  <g transform="translate(1010 620)">
    <text x="0" y="0" fill="#d4e9eb" font-family="monospace" font-size="24" font-weight="700">VISTAS DE REFERENCIA</text>
    <text x="0" y="34" fill="#7eb4bf" font-family="monospace" font-size="17">TRASERA · CONECTOR · MATERIAL ABS OSCURO</text>
  </g>

  <g transform="translate(95 900)">
    <rect x="0" y="0" width="1410" height="58" rx="12" fill="#0a1116" opacity="0.92"/>
    <text x="24" y="36" fill="#91bac2" font-family="monospace" font-size="18">DIRECCIÓN: agua · lluvia · flujo · arquitectura imposible · ryū original · estética portátil 1998</text>
  </g>
</svg>
