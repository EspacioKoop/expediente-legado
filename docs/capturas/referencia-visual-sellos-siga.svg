<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Referencia visual de Sellos SIGA</title>
  <desc id="desc">Hoja de sellos burocráticos físicos de 1998 para reconocimientos diegéticos del auditor.</desc>
  <rect width="1200" height="820" fill="#d9d2bf"/>
  <rect x="22" y="22" width="1156" height="776" fill="#e5deca" stroke="#6f695d" stroke-width="3"/>
  <text x="54" y="72" font-family="monospace" font-size="34" font-weight="700" fill="#22231f">S.I.G.A. · HOJA DE MARCAS DEL AUDITOR</text>
  <text x="54" y="104" font-family="monospace" font-size="16" fill="#555349">REFERENCIA DE PRESENTACIÓN · SELLOS FÍSICOS / TINTA / PAPEL · 1998</text>
  <line x1="54" y1="122" x2="1146" y2="122" stroke="#777164" stroke-width="2"/>
  <defs>
    <style>
      .box{fill:none;stroke-width:5}.red{stroke:#9a3c33;fill:none}.blue{stroke:#3f566c;fill:none}.black{stroke:#2b2c28;fill:none}.tred{fill:#9a3c33}.tblue{fill:#3f566c}.tblack{fill:#2b2c28}.label{font:700 18px monospace}.small{font:13px monospace}.thin{stroke-width:3}.icon{stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <g transform="translate(62 158) rotate(-2)"><rect class="box red" width="240" height="128" rx="8"/><text x="120" y="34" text-anchor="middle" class="small tred">S.I.G.A. / VALIDACIÓN</text><path class="icon red" d="M43 72l22 22 42-48"/><text x="132" y="78" text-anchor="middle" class="label tred">SIN INCIDENCIAS</text><text x="132" y="102" text-anchor="middle" class="small tred">JORNADA CERRADA</text></g>
  <g transform="translate(346 158) rotate(1)"><rect class="box blue" width="240" height="128" rx="8"/><text x="120" y="34" text-anchor="middle" class="small tblue">S.I.G.A. / CONDUCTA</text><path class="icon blue" d="M44 84c10-34 54-34 64 0M54 64l-9-18M97 64l9-18M66 82h20"/><text x="150" y="78" text-anchor="middle" class="label tblue">CUIDADO FELINO</text><text x="150" y="102" text-anchor="middle" class="small tblue">CONSTANCIA DOMÉSTICA</text></g>
  <g transform="translate(630 158) rotate(-1)"><rect class="box black" width="240" height="128" rx="8"/><text x="120" y="34" text-anchor="middle" class="small tblack">S.I.G.A. / TIEMPO</text><path class="icon black" d="M54 48v56M40 62h28M88 48v56M74 90h28"/><text x="160" y="78" text-anchor="middle" class="label tblack">SIN TRABAJILLOS</text><text x="160" y="102" text-anchor="middle" class="small tblack">OCIO NO PRODUCTIVO</text></g>
  <g transform="translate(914 158) rotate(2)"><rect class="box red" width="220" height="128" rx="64"/><text x="110" y="37" text-anchor="middle" class="small tred">S.I.G.A.</text><text x="110" y="72" text-anchor="middle" class="label tred">REINCORPORADO</text><text x="110" y="98" text-anchor="middle" class="small tred">NUEVA VIDA LABORAL</text></g>

  <g transform="translate(62 330) rotate(1)"><rect class="box black" width="240" height="128"/><text x="120" y="34" text-anchor="middle" class="small tblack">REGISTRO DE JORNADA</text><path class="icon black" d="M44 88h55V50H44zM56 62h31M56 74h25"/><text x="156" y="72" text-anchor="middle" class="label tblack">EXPEDIENTES</text><text x="156" y="98" text-anchor="middle" class="label tblack">SIN PRISA</text></g>
  <g transform="translate(346 330) rotate(-2)"><rect class="box red" width="240" height="128"/><text x="120" y="34" text-anchor="middle" class="small tred">CERTIFICACIÓN INTERNA</text><circle class="icon red" cx="66" cy="76" r="25"/><path class="icon red" d="M66 51v50M41 76h50"/><text x="160" y="74" text-anchor="middle" class="label tred">NOCHE</text><text x="160" y="98" text-anchor="middle" class="label tred">IMPRODUCTIVA</text></g>
  <g transform="translate(630 330) rotate(2)"><rect class="box blue" width="240" height="128"/><text x="120" y="34" text-anchor="middle" class="small tblue">INSPECCIÓN DOMÉSTICA</text><path class="icon blue" d="M45 94V64l28-20 28 20v30M58 94V76h30v18"/><text x="162" y="74" text-anchor="middle" class="label tblue">CASA</text><text x="162" y="98" text-anchor="middle" class="label tblue">RECORRIDA</text></g>
  <g transform="translate(914 330) rotate(-1)"><rect class="box black" width="220" height="128" rx="8"/><text x="110" y="34" text-anchor="middle" class="small tblack">AUDITORÍA PERSONAL</text><path class="icon black" d="M42 60h42v42H42zM51 81l9 9 17-20"/><text x="154" y="76" text-anchor="middle" class="label tblack">SIN BAJAS</text><text x="154" y="101" text-anchor="middle" class="small tblack">VIDA LABORAL</text></g>

  <g transform="translate(62 502) rotate(-1)"><rect class="box blue" width="240" height="128" rx="8"/><text x="120" y="34" text-anchor="middle" class="small tblue">ACTIVIDAD RESIDUAL</text><rect x="42" y="54" width="62" height="43" class="blue thin"/><path class="icon blue" d="M52 106h42M62 98v8M84 98v8"/><text x="164" y="73" text-anchor="middle" class="label tblue">CONSOLA</text><text x="164" y="98" text-anchor="middle" class="label tblue">UTILIZADA</text></g>
  <g transform="translate(346 502) rotate(2)"><rect class="box red" width="240" height="128" rx="8"/><text x="120" y="34" text-anchor="middle" class="small tred">ÁREA ONÍRICA</text><path class="icon red" d="M44 84c22-38 55-38 78 0-23 30-56 30-78 0zM83 65v38"/><text x="168" y="74" text-anchor="middle" class="label tred">ANOMALÍA</text><text x="168" y="99" text-anchor="middle" class="label tred">RECONOCIDA</text></g>
  <g transform="translate(630 502) rotate(-2)"><rect class="box black" width="240" height="128" rx="8"/><text x="120" y="34" text-anchor="middle" class="small tblack">CONTROL DE FIRMA</text><path class="icon black" d="M44 91c25-34 41 16 62-20s38 7 58-12"/><text x="170" y="78" text-anchor="middle" class="label tblack">SIN ACUSACIÓN</text><text x="170" y="101" text-anchor="middle" class="small tblack">PRECIPITADA</text></g>
  <g transform="translate(914 502) rotate(1)"><rect class="box blue" width="220" height="128" rx="8"/><text x="110" y="34" text-anchor="middle" class="small tblue">ARCHIVO PERSONAL</text><path class="icon blue" d="M40 54h50v52H40zM50 67h30M50 78h30M50 89h21"/><text x="157" y="73" text-anchor="middle" class="label tblue">VUELTA</text><text x="157" y="98" text-anchor="middle" class="label tblue">COMPLETA</text></g>

  <g transform="translate(62 682)"><text x="0" y="0" font-family="monospace" font-size="14" fill="#48473f">REGLA: el sello documenta una conducta ya ocurrida; no concede dinero, acciones, pistas ni ventaja.</text><text x="0" y="26" font-family="monospace" font-size="14" fill="#48473f">La forma visual puede reutilizar el catálogo técnico de #189/#312/#363; esta lámina no crea otra fuente de verdad.</text><text x="0" y="52" font-family="monospace" font-size="13" fill="#777164">REFERENCIA ARTÍSTICA · NO ASSET RUNTIME · Refs #95 #100 #114 #148 #189 #363</text></g>
</svg>