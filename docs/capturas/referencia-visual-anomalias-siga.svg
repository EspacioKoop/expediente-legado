<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Referencia visual de anomalías SIGA</title>
  <desc id="desc">Lámina de dirección artística con nueve deformaciones oníricas reconocibles de objetos y espacios burocráticos.</desc>
  <rect width="1200" height="820" fill="#111513"/>
  <rect x="24" y="24" width="1152" height="112" rx="4" fill="#d7d0bb" stroke="#827c69" stroke-width="3"/>
  <text x="48" y="66" font-family="monospace" font-size="34" font-weight="700" fill="#171915">SIGA-98 / CATÁLOGO DE TRANSFORMACIONES</text>
  <text x="48" y="96" font-family="monospace" font-size="16" fill="#37382f">ÁREA DE ESTUDIOS ONÍRICOS · OBSERVAR / REGISTRAR / NO INTERPRETAR</text>
  <g transform="translate(940 42) rotate(-5)"><rect width="190" height="58" fill="none" stroke="#98372f" stroke-width="5"/><text x="23" y="38" font-family="monospace" font-size="24" font-weight="700" fill="#98372f">USO INTERNO</text></g>

  <defs>
    <style>
      .card{fill:#1c211f;stroke:#7b7769;stroke-width:2}.n{fill:#d7d0bb}.h{font:700 16px monospace;fill:#ece6d5}.p{font:13px monospace;fill:#bfb9a8}.line{stroke:#c9c0a7;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}.accent{stroke:#9e3b32;fill:none;stroke-width:7}.paper{fill:#c9c1ab;stroke:#6e695b;stroke-width:2}.ink{fill:#282b27}.ghost{fill:#59605b;opacity:.45}
    </style>
  </defs>

  <!-- fila 1 -->
  <g transform="translate(24 156)"><rect class="card" width="368" height="196"/><rect class="n" x="12" y="12" width="34" height="28"/><text x="22" y="32" font-family="monospace" font-size="16" fill="#171915">01</text><text class="h" x="58" y="33">EXPEDIENTE → ARQUITECTURA</text>
    <path class="paper" d="M42 64h82v104H42z"/><path class="line" d="M57 82h52M57 97h46M57 112h55"/><path class="accent" d="M177 168V82l42-25 42 25v86M219 57v111M177 104h84M300 168V98l25-18 25 18v70"/>
    <text class="p" x="42" y="187">La página conserva su identidad, pero se vuelve lugar.</text></g>
  <g transform="translate(416 156)"><rect class="card" width="368" height="196"/><rect class="n" x="12" y="12" width="34" height="28"/><text x="22" y="32" font-family="monospace" font-size="16" fill="#171915">02</text><text class="h" x="58" y="33">SILLA 4-B → ESCALA IMPOSIBLE</text>
    <path class="line" d="M74 86h66v46H74zM84 132v38M130 132v38M78 82V64M136 82V64"/><path class="accent" d="M205 66h94v78h-94zM217 144v34M287 144v34M213 58V44M292 58V44"/><path class="line" d="M166 116h20M176 106l10 10-10 10"/>
    <text class="p" x="42" y="187">Mismo objeto; proporción y autoridad dejan de ser humanas.</text></g>
  <g transform="translate(808 156)"><rect class="card" width="368" height="196"/><rect class="n" x="12" y="12" width="34" height="28"/><text x="22" y="32" font-family="monospace" font-size="16" fill="#171915">03</text><text class="h" x="58" y="33">SELLO → DESMESURA</text>
    <path class="line" d="M64 96h70v28H64zM80 96V72h38v24M72 124v28h54v-28"/><path class="accent" d="M204 74h106v42H204zM226 74V46h62v28M214 116v52h86v-52"/><text x="225" y="143" font-family="monospace" font-size="17" font-weight="700" fill="#9e3b32">TRAMITADO</text>
    <text class="p" x="42" y="187">La marca administrativa invade la escena en vez del papel.</text></g>

  <!-- fila 2 -->
  <g transform="translate(24 376)"><rect class="card" width="368" height="196"/><rect class="n" x="12" y="12" width="34" height="28"/><text x="22" y="32" font-family="monospace" font-size="16" fill="#171915">04</text><text class="h" x="58" y="33">ARCHIVADORES → GEOMETRÍA</text>
    <g class="ghost"><rect x="44" y="58" width="56" height="112"/><rect x="106" y="70" width="56" height="100"/><rect x="168" y="52" width="56" height="118"/><rect x="230" y="74" width="56" height="96"/><rect x="292" y="60" width="34" height="110"/></g>
    <path class="line" d="M42 150L98 92l56 58 58-72 58 72 57-62"/><path class="accent" d="M42 116h284"/>
    <text class="p" x="42" y="187">Los muebles siguen siendo archivos; el pasillo deja de obedecer.</text></g>
  <g transform="translate(416 376)"><rect class="card" width="368" height="196"/><rect class="n" x="12" y="12" width="34" height="28"/><text x="22" y="32" font-family="monospace" font-size="16" fill="#171915">05</text><text class="h" x="58" y="33">FRASES → INVASIÓN</text>
    <text x="44" y="85" font-family="monospace" font-size="17" fill="#d9d2be" transform="rotate(-7 44 85)">EN TRÁMITE</text><text x="164" y="70" font-family="monospace" font-size="14" fill="#a8a292" transform="rotate(5 164 70)">PENDIENTE</text><text x="72" y="126" font-family="monospace" font-size="15" fill="#9e3b32" transform="rotate(4 72 126)">SUBSANAR</text><text x="205" y="116" font-family="monospace" font-size="15" fill="#d9d2be" transform="rotate(-8 205 116)">SIN NOVEDAD</text><text x="115" y="154" font-family="monospace" font-size="14" fill="#aaa494">A LA ESPERA</text>
    <text class="p" x="42" y="187">El lenguaje abandona el documento y ocupa el espacio físico.</text></g>
  <g transform="translate(808 376)"><rect class="card" width="368" height="196"/><rect class="n" x="12" y="12" width="34" height="28"/><text x="22" y="32" font-family="monospace" font-size="16" fill="#171915">06</text><text class="h" x="58" y="33">TAROT → GEOMETRÍA VIVA</text>
    <g transform="translate(48 60) rotate(-9)"><rect class="paper" width="68" height="104"/><circle cx="34" cy="41" r="16" fill="none" stroke="#292b27" stroke-width="3"/><path d="M18 78h32" stroke="#292b27" stroke-width="3"/></g><g transform="translate(142 54) rotate(5)"><rect class="paper" width="68" height="110"/><path d="M34 18l18 34H16z" fill="none" stroke="#9e3b32" stroke-width="4"/><circle cx="34" cy="49" r="6" class="ink"/></g><g transform="translate(240 62) rotate(12)"><rect class="paper" width="68" height="100"/><path d="M14 70l20-44 20 44z" fill="none" stroke="#292b27" stroke-width="3"/></g>
    <text class="p" x="42" y="187">El símbolo se reconoce, pero nunca recibe una traducción cerrada.</text></g>

  <!-- fila 3 -->
  <g transform="translate(24 596)"><rect class="card" width="368" height="196"/><rect class="n" x="12" y="12" width="34" height="28"/><text x="22" y="32" font-family="monospace" font-size="16" fill="#171915">07</text><text class="h" x="58" y="33">PUERTA → OTRO LUGAR</text>
    <rect x="66" y="58" width="88" height="112" fill="#292d2a" stroke="#c9c0a7" stroke-width="5"/><circle cx="136" cy="116" r="4" fill="#c9c0a7"/><path class="accent" d="M210 166V72h92v94M222 154l34-56 34 56"/><text class="p" x="42" y="187">La puerta sigue siendo la de la oficina; solo cambia lo que hay detrás.</text></g>
  <g transform="translate(416 596)"><rect class="card" width="368" height="196"/><rect class="n" x="12" y="12" width="34" height="28"/><text x="22" y="32" font-family="monospace" font-size="16" fill="#171915">08</text><text class="h" x="58" y="33">RELOJ → TIEMPO FRACTURADO</text>
    <circle cx="112" cy="112" r="52" fill="none" stroke="#c9c0a7" stroke-width="6"/><path class="line" d="M112 112V77M112 112l25 19"/><circle cx="112" cy="112" r="5" fill="#c9c0a7"/><g opacity=".55"><circle cx="202" cy="112" r="42" fill="none" stroke="#7b7769" stroke-width="5"/><circle cx="272" cy="112" r="32" fill="none" stroke="#585c56" stroke-width="4"/></g><text class="p" x="42" y="187">La repetición visual sugiere desajuste sin explicar sus causas.</text></g>
  <g transform="translate(808 596)"><rect class="card" width="368" height="196"/><rect class="n" x="12" y="12" width="34" height="28"/><text x="22" y="32" font-family="monospace" font-size="16" fill="#171915">09</text><text class="h" x="58" y="33">DOCUMENTOS → PRESENCIAS</text>
    <g opacity=".55"><rect class="paper" x="45" y="70" width="54" height="78" transform="rotate(-8 72 109)"/><rect class="paper" x="116" y="56" width="54" height="90" transform="rotate(5 143 101)"/><rect class="paper" x="190" y="70" width="54" height="78" transform="rotate(-4 217 109)"/><rect class="paper" x="264" y="58" width="54" height="88" transform="rotate(9 291 102)"/></g><path class="accent" d="M76 102c18-18 34-18 52 0-18 18-34 18-52 0zm144 6c18-18 34-18 52 0-18 18-34 18-52 0z"/>
    <text class="p" x="42" y="187">La información se materializa; observar no equivale a resolver.</text></g>

  <text x="28" y="814" font-family="monospace" font-size="13" fill="#777b73">REFERENCIA ARTÍSTICA · NO ASSET RUNTIME · Refs #79 #87 #149 #299 #400</text>
</svg>