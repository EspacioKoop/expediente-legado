services:
  mysql:
    image: mysql:8.0
    container_name: siga98-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    # Sin puertos publicados: MySQL solo es accesible desde la red interna
    # de docker (adminer y backend); para consultas manuales, docker exec.
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: siga98-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "1998:8080"

  adminer:
    image: adminer:latest
    container_name: siga98-adminer
    restart: unless-stopped
    depends_on:
      - mysql
    # Solo localhost: es una consola de la base de datos y Docker se salta el
    # cortafuegos del host en los puertos que publica.
    ports:
      - "127.0.0.1:1999:8080"

volumes:
  mysql_data:
