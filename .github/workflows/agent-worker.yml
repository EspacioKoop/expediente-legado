name: Agent worker reusable

on:
  workflow_call:
    inputs:
      issue:
        description: 'Issue a ejecutar'
        required: true
        type: number
      provider:
        description: 'Proveedor logico'
        required: true
        type: string
      worker:
        description: 'Slot fisico del pool'
        required: true
        type: string
      fallback_keys:
        description: 'Slots de fallback con clave, separados por espacios (tabla del pool)'
        required: false
        type: string
        default: ''
      retry_hint:
        description: 'Feedback acotado de un intento anterior del mismo worker'
        required: false
        type: string
        default: ''
      refill_max_parallel:
        description: 'Cap solicitado al dispatcher si este worker libera un slot'
        required: false
        type: string
        default: '6'
    secrets:
      QWEN_API_KEY:
        required: false
      OMNIROUTE_API_KEY:
        required: false
      TS_OAUTH_CLIENT_ID:
        required: false
      TS_OAUTH_SECRET:
        required: false
      TS_AUDIENCE:
        required: false
      # Los slots de fallback se leen con secrets[format(...)] (#1685). Con el
      # `secrets: inherit` del pool llegan todos; estas declaraciones son solo
      # las históricas y no limitan el número de slots.
      QWEN_FALLBACK_1_API_KEY:
        required: false
      QWEN_FALLBACK_2_API_KEY:
        required: false
      QWEN_FALLBACK_3_API_KEY:
        required: false
      QWEN_FALLBACK_4_API_KEY:
        required: false
      GEMINI_API_KEY:
        required: false
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue a ejecutar'
        required: true
        type: number
      provider:
        description: 'Proveedor logico'
        required: true
        type: choice
        options: [qwen, gemini]
      worker:
        description: 'Slot fisico'
        required: true
        type: choice
        options:
          - qwen-primary
          - gemini
          - qwen-fallback-1
          - qwen-fallback-2
          - qwen-fallback-3
          - qwen-fallback-4
      retry_hint:
        description: 'Feedback acotado de un intento anterior del mismo worker'
        required: false
        type: string
        default: ''
      refill_max_parallel:
        description: 'Cap del refill opt-in'
        required: false
        type: choice
        default: '6'
        options: ['1', '2', '3', '4', '5', '6']

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write
  id-token: write

concurrency:
  group: agent-pool-issue-${{ inputs.issue }}
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GEMINI_CLI_TRUST_WORKSPACE: 'true'
      HAS_TS_OAUTH: ${{ secrets.TS_OAUTH_CLIENT_ID != '' && secrets.TS_OAUTH_SECRET != '' }}
      HAS_TS_OIDC: ${{ secrets.TS_OAUTH_CLIENT_ID != '' && secrets.TS_AUDIENCE != '' }}
      HAS_OMNIROUTE: ${{ secrets.OMNIROUTE_API_KEY != '' && secrets.TS_OAUTH_CLIENT_ID != '' && (secrets.TS_OAUTH_SECRET != '' || secrets.TS_AUDIENCE != '') && vars.OMNIROUTE_BASE_URL != '' && vars.OMNIROUTE_MODEL != '' }}
    steps:
      - id: guard
        name: Validar issue y slot
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
          PROVIDER: ${{ inputs.provider }}
          WORKER: ${{ inputs.worker }}
          HAS_QWEN: ${{ secrets.QWEN_API_KEY != '' }}
          HAS_TS_OAUTH: ${{ secrets.TS_OAUTH_CLIENT_ID != '' && secrets.TS_OAUTH_SECRET != '' }}
          HAS_TS_OIDC: ${{ secrets.TS_OAUTH_CLIENT_ID != '' && secrets.TS_AUDIENCE != '' }}
          HAS_OMNIROUTE: ${{ secrets.OMNIROUTE_API_KEY != '' && secrets.TS_OAUTH_CLIENT_ID != '' && (secrets.TS_OAUTH_SECRET != '' || secrets.TS_AUDIENCE != '') && vars.OMNIROUTE_BASE_URL != '' && vars.OMNIROUTE_MODEL != '' }}
          HAS_GEMINI: ${{ secrets.GEMINI_API_KEY != '' }}
          VARS_JSON: ${{ toJSON(vars) }}
          POOL_FALLBACK_KEYS: ${{ inputs.fallback_keys }}
          CONTROL_URL: ${{ vars.SIGA98_FEEDBACK_FALLBACK_URL }}
        run: |
          set -euo pipefail
          [[ "$ISSUE" =~ ^[0-9]+$ ]] || exit 2
          issue_meta="$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE")"
          association="$(jq -r '.author_association // ""' <<<"$issue_meta")"
          author="$(jq -r '.user.login // ""' <<<"$issue_meta")"
          if [[ "$author" != "github-actions[bot]" && ! "$association" =~ ^(OWNER|MEMBER|COLLABORATOR)$ ]]; then
            echo "::warning::Issue #$ISSUE bloqueado: autor no confiable ($author/$association)."
            for label in agent:auto agent:pool agent:qwen agent:gemini agent:decompose; do
              gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "$label" >/dev/null 2>&1 || true
            done
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label agent:needs-human >/dev/null 2>&1 || true
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$WORKER:$PROVIDER" in
            qwen-primary:qwen) [[ "$HAS_QWEN" == true || "$HAS_OMNIROUTE" == true ]] || exit 3 ;;
            qwen-fallback-[1-9]*:qwen)
              # Aún sin checkout: URL desde las variables y clave según la tabla del
              # pool. qwen_config vuelve a comprobar la clave del propio slot.
              n="${WORKER#qwen-fallback-}"
              [[ "$n" =~ ^[1-9][0-9]*$ ]] || exit 2
              url="$(jq -r --arg k "QWEN_FALLBACK_${n}_BASE_URL" '.[$k] // ""' <<<"$VARS_JSON")"
              [[ -n "$url" ]] || exit 3
              [[ -z "$POOL_FALLBACK_KEYS" || " $POOL_FALLBACK_KEYS " == *" $n "* ]] || exit 3
              ;;
            gemini:gemini) [[ "$HAS_GEMINI" == true ]] || exit 3 ;;
            *) echo "Combinacion worker/provider invalida: $WORKER/$PROVIDER" >&2; exit 2 ;;
          esac

          labels="$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name]|join(" ")')"
          queue=false
          for label in agent:auto agent:pool agent:qwen agent:gemini; do
            [[ " $labels " == *" $label "* ]] && queue=true
          done
          [[ "$queue" == true ]] || { echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; }
          for blocked in agent:working agent:pr-open agent:needs-human; do
            [[ " $labels " == *" $blocked "* ]] && { echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; }
          done

          # Una PR ya abierta es autoridad suficiente para no gastar otro worker.
          # Acepta las tres formas usadas por el repo y exige frontera tras el
          # número para que #203 no coincida accidentalmente con #2035.
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json body \
            | jq -r --arg issue "$ISSUE" \
              '[.[] | select((.body // "") | test(
                "(^|\\n)[[:space:]]*(Refs|Closes|Fixes)[[:space:]]+#" + $issue + "([[:space:]]|[.,;:]|$)";
                "i"
              ))] | length')"
          if [[ "$existing" != 0 ]]; then
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" \
              --add-label agent:pr-open \
              --remove-label agent:auto \
              --remove-label agent:pool \
              --remove-label agent:qwen \
              --remove-label agent:gemini >/dev/null 2>&1 || true
            echo "::notice::Issue #$ISSUE ya tiene una PR abierta; se normaliza a agent:pr-open."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          branch="agent/${PROVIDER}-${ISSUE}-${GITHUB_RUN_ID}"
          control="github-fallback"
          lease_id=""

          # #1728: el lease Deno KV es el lock técnico primario. Durante la
          # migración se mantiene fail-open: solo un 409 (otro lease vivo)
          # impide arrancar; indisponibilidad de Deno conserva labels/CLAIM.
          if [[ -n "${CONTROL_URL:-}" ]]; then
            base="${CONTROL_URL%/}"
            base="${base%/api/report}"
            if oidc_json="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=siga98-agent-pool")" &&
              oidc_token="$(jq -er '.value' <<<"$oidc_json")"; then
              payload="$(jq -nc --argjson issue "$ISSUE" --arg provider "$PROVIDER" \
                --arg worker "$WORKER" --arg branch "$branch" \
                '{schema:1,issue:$issue,provider:$provider,worker:$worker,branch:$branch}')"
              if control_code="$(curl -sS --max-time 12 -o /tmp/agent-pool-acquire.json -w '%{http_code}' \
                -X POST "$base/api/agent-pool/acquire" \
                -H "Authorization: Bearer $oidc_token" \
                -H 'Content-Type: application/json' --data "$payload")"; then
                if [[ "$control_code" == 201 ]]; then
                  lease_id="$(jq -er '.lease.lease_id' /tmp/agent-pool-acquire.json)"
                  control="deno"
                elif [[ "$control_code" == 409 ]]; then
                  echo "::notice::Issue #$ISSUE ya tiene lease activo en Deno KV; este worker no arranca."
                  echo "run=false" >> "$GITHUB_OUTPUT"
                  echo "branch=$branch" >> "$GITHUB_OUTPUT"
                  echo "control=deno-conflict" >> "$GITHUB_OUTPUT"
                  echo "lease_id=" >> "$GITHUB_OUTPUT"
                  exit 0
                else
                  echo "::warning::Control-plane devolvió HTTP $control_code; se usa fallback GitHub."
                fi
              else
                echo "::warning::Control-plane Deno no accesible; se usa fallback GitHub."
              fi
            else
              echo "::warning::No se pudo obtener OIDC del control-plane; se usa fallback GitHub."
            fi
          fi

          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label agent:working >/dev/null
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "control=$control" >> "$GITHUB_OUTPUT"
          echo "lease_id=$lease_id" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          lfs: true
          persist-credentials: false

      - name: Renovar lease Deno · planning
        if: steps.guard.outputs.run == 'true' && steps.guard.outputs.control == 'deno'
        continue-on-error: true
        env:
          CONTROL_URL: ${{ vars.SIGA98_FEEDBACK_FALLBACK_URL }}
          ISSUE: ${{ inputs.issue }}
          LEASE_ID: ${{ steps.guard.outputs.lease_id }}
        run: |
          set -euo pipefail
          base="${CONTROL_URL%/}"
          base="${base%/api/report}"
          oidc_json="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=siga98-agent-pool")"
          oidc_token="$(jq -er '.value' <<<"$oidc_json")"
          payload="$(jq -nc --argjson issue "$ISSUE" --arg lease "$LEASE_ID" \
            '{schema:1,issue:$issue,lease_id:$lease,state:"planning"}')"
          curl -fsS -X POST "$base/api/agent-pool/transition" \
            -H "Authorization: Bearer $oidc_token" \
            -H 'Content-Type: application/json' --data "$payload" >/dev/null

      - name: Conectar qwen-primary a OmniRoute por Tailscale (OAuth)
        if: steps.guard.outputs.run == 'true' && inputs.worker == 'qwen-primary' && env.HAS_OMNIROUTE == 'true' && env.HAS_TS_OAUTH == 'true'
        continue-on-error: true
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-autopilot

      - name: Conectar qwen-primary a OmniRoute por Tailscale (OIDC)
        if: steps.guard.outputs.run == 'true' && inputs.worker == 'qwen-primary' && env.HAS_OMNIROUTE == 'true' && env.HAS_TS_OAUTH != 'true' && env.HAS_TS_OIDC == 'true'
        continue-on-error: true
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:github-autopilot

      - id: omniroute
        name: Comprobar OmniRoute para qwen-primary
        if: steps.guard.outputs.run == 'true' && inputs.worker == 'qwen-primary' && env.HAS_OMNIROUTE == 'true'
        continue-on-error: true
        env:
          OMNIROUTE_BASE_URL: ${{ vars.OMNIROUTE_BASE_URL }}
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
        run: |
          set -euo pipefail
          base="${OMNIROUTE_BASE_URL%/}"
          code="$(curl -sS --max-time 12 -o /tmp/omniroute-models.json -w '%{http_code}' \
            -H "Authorization: Bearer $OMNIROUTE_API_KEY" "$base/models" || true)"
          [[ "$code" == 200 ]]
          jq -e '.data | type == "array"' /tmp/omniroute-models.json >/dev/null
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - id: slot
        name: Identificar slot de fallback
        if: steps.guard.outputs.run == 'true' && inputs.provider == 'qwen'
        env:
          WORKER: ${{ inputs.worker }}
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          set -euo pipefail
          # qwen-fallback-N -> N y el nombre del secret que usa (propio o heredado
          # con QWEN_FALLBACK_N_KEY_FROM, #1685); la clave se toma con secrets[...].
          if [[ "$WORKER" =~ ^qwen-fallback-([1-9][0-9]*)$ ]]; then
            echo "n=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "secret=$(python3 scripts/agent_slots.py secreto --worker "$WORKER" || true)" >> "$GITHUB_OUTPUT"
          fi

      - id: qwen_config
        name: Resolver endpoint Qwen
        if: steps.guard.outputs.run == 'true' && inputs.provider == 'qwen'
        env:
          WORKER: ${{ inputs.worker }}
          OMNI_READY: ${{ steps.omniroute.outputs.ready }}
          OMNI_URL: ${{ vars.OMNIROUTE_BASE_URL }}
          OMNI_MODEL: ${{ vars.OMNIROUTE_MODEL }}
          HAS_PRIMARY_KEY: ${{ secrets.QWEN_API_KEY != '' }}
          PRIMARY_KEY_PREFIX: ${{ startsWith(secrets.QWEN_API_KEY, 'sk-sp-') && 'sk-sp-' || '' }}
          PRIMARY_URL: ${{ vars.QWEN_BASE_URL }}
          PRIMARY_MODEL: ${{ vars.QWEN_MODEL }}
          # Slots de fallback dinámicos (#1685): URL/modelo desde las variables y
          # clave propia comprobada sin exponerla al shell.
          VARS_JSON: ${{ toJSON(vars) }}
          POOL_FALLBACK_KEYS: ${{ inputs.fallback_keys }}
          SLOT: ${{ steps.slot.outputs.n }}
          SLOT_SECRET: ${{ steps.slot.outputs.secret }}
          SLOT_HAS_KEY: ${{ steps.slot.outputs.secret != '' && secrets[steps.slot.outputs.secret] != '' }}
        run: |
          set -euo pipefail
          model="${PRIMARY_MODEL:-qwen3-coder-plus}"
          credential=""
          slot=""
          key_secret=""
          fallback() {
            local resuelto
            resuelto="$(python3 scripts/agent_slots.py resolver --worker "$1" --modelo-por-defecto "$model")" || return 1
            credential=fallback
            slot="$(jq -r '.slot' <<<"$resuelto")"
            key_secret="$(jq -r '.secret' <<<"$resuelto")"
            url="$(jq -r '.url' <<<"$resuelto")"
            model="$(jq -r '.model' <<<"$resuelto")"
          }
          case "$WORKER" in
            qwen-primary)
              if [[ "$OMNI_READY" == true ]]; then
                credential=omniroute
                url="$OMNI_URL"
                model="$OMNI_MODEL"
              elif [[ "$HAS_PRIMARY_KEY" == true ]]; then
                credential=primary
                url="$PRIMARY_URL"
                if [[ -z "$url" ]]; then
                  if [[ "$PRIMARY_KEY_PREFIX" == sk-sp- ]]; then
                    url="https://coding-intl.dashscope.aliyuncs.com/v1"
                  else
                    url="https://dashscope-intl.aliyuncs.com/compatible-mode/v1"
                  fi
                fi
              else
                FALLBACK_KEYS="$POOL_FALLBACK_KEYS" fallback primera || exit 3
              fi
              ;;
            qwen-fallback-*)
              if [[ "$SLOT_HAS_KEY" != true ]]; then
                echo "::error::$WORKER no tiene clave (${SLOT_SECRET:-KEY_FROM inválido})" >&2
                exit 3
              fi
              FALLBACK_KEYS="$SLOT" fallback "$WORKER" || exit 3
              ;;
            *) exit 2 ;;
          esac
          [[ -n "$credential" && -n "$url" && -n "$model" ]] || exit 3
          echo "credential=$credential" >> "$GITHUB_OUTPUT"
          # Solo secretos de la lista cerrada de agent_slots.py (#1685).
          if [[ "$credential" == fallback && ! "$key_secret" =~ ^(QWEN_FALLBACK_[1-9][0-9]*_API_KEY|QWEN_API_KEY|GEMINI_API_KEY)$ ]]; then
            echo "::error::secret no permitido para $WORKER: $key_secret" >&2
            exit 3
          fi
          echo "slot=$slot" >> "$GITHUB_OUTPUT"
          echo "key_secret=$key_secret" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "model=$model" >> "$GITHUB_OUTPUT"

      - id: qwen_proxy
        name: Proxy de compatibilidad del proveedor
        if: steps.guard.outputs.run == 'true' && inputs.provider == 'qwen'
        env:
          URL: ${{ steps.qwen_config.outputs.url }}
        run: |
          set -euo pipefail
          # Mistral rechaza campos desconocidos y Groq topa max_tokens (#1928):
          # un proxy local adapta la petición; el resto va directo al endpoint.
          profile="$(python3 scripts/agent_llm_proxy.py detect "$URL")"
          echo "Perfil del proveedor: $profile"
          [[ "$profile" != passthrough ]] || exit 0
          nohup python3 scripts/agent_llm_proxy.py serve --upstream "$URL" --profile "$profile" --port 18080 \
            > /tmp/agent-llm-proxy.log 2>&1 &
          for _ in $(seq 1 50); do
            curl -fsS http://127.0.0.1:18080/__health >/dev/null 2>&1 && break
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:18080/__health >/dev/null
          echo "url=http://127.0.0.1:18080/v1" >> "$GITHUB_OUTPUT"

      - id: task
        name: Materializar contexto del issue
        if: steps.guard.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE" > /tmp/agent-issue.json
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments?per_page=100" \
            --jq '.[]' | jq -s '.' > /tmp/agent-comments.json
          python3 scripts/agent_issue_context.py \
            --issue /tmp/agent-issue.json \
            --comments /tmp/agent-comments.json \
            --output .agent-task.md \
            --max-comments 20
          # Los planificadores ignoraban .agent-task.md («no se ha presentado ninguna
          # tarea», #667): la tarea va también en el propio prompt, acotada.
          delim="TAREA_$(openssl rand -hex 8)"
          {
            echo "brief<<$delim"
            gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json number,title,body \
              --jq '"Issue #" + (.number|tostring) + ": " + .title + "\n\n" + ((.body//"")|.[0:6000])' \
              | tr -d '\r'
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      - id: delegated
        name: Cargar plan delegado del nivel 2
        if: steps.guard.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail
          printf '%s\n' '{"found":false}' > /tmp/delegado.json
          if gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE" > /tmp/delegado-issue.json &&
            gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments?per_page=100" \
              --jq '.[]' | jq -s '.' > /tmp/delegado-comments.json &&
            jq -s '.[0] + {comments: .[1]}' /tmp/delegado-issue.json /tmp/delegado-comments.json \
              > /tmp/delegado-entrada.json &&
            python3 scripts/agent_delegated_plan.py \
              --issue /tmp/delegado-entrada.json --output /tmp/delegado.json >/dev/null; then
            if [[ "$(jq -r '.found' /tmp/delegado.json)" == true ]]; then
              echo "found=true" >> "$GITHUB_OUTPUT"
              echo "Plan delegado listo; nivel 3 entra directamente en reserva/ejecución."
              exit 0
            fi
          fi
          echo "found=false" >> "$GITHUB_OUTPUT"

      - id: route_decompose
        name: Devolver al nivel 2 si falta plan
        if: steps.guard.outputs.run == 'true' && steps.delegated.outputs.found != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail
          for label in agent:auto agent:pool agent:qwen agent:gemini agent:working; do
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "$label" >/dev/null 2>&1 || true
          done
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" \
            --remove-label agent:needs-human --add-label agent:decompose >/dev/null
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body \
            "Agent pool: falta AGENT_PLAN delegado. Se devuelve a agent:decompose; el executor no consume turnos planificando." >/dev/null
          echo "routed=true" >> "$GITHUB_OUTPUT"

      - name: Sellar versión de Normas Platino
        if: steps.guard.outputs.run == 'true' && steps.delegated.outputs.found == 'true'
        run: |
          set -euo pipefail
          git ls-remote https://github.com/EspacioKoop/normas_platino.git HEAD | awk '{print $1}' > .agent-platino-sha
          test -s .agent-platino-sha

      - id: reserve
        name: Validar plan y reservar rutas
        if: steps.guard.outputs.run == 'true' && steps.delegated.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
          PROVIDER: ${{ inputs.provider }}
          BRANCH: ${{ steps.guard.outputs.branch }}
          MAX_FILES: ${{ vars.AGENT_POOL_MAX_FILES || '1' }}
        run: |
          set -euo pipefail
          status=0
          python3 scripts/agent_plan_parse.py \
            --source /tmp/delegado.json \
            --max-files "$MAX_FILES" \
            --output .agent-plan.json 2>/tmp/agent-plan-error.txt || status=$?
          if (( status != 0 )); then
            reason="$(tr '\n' ' ' < /tmp/agent-plan-error.txt)"
            target=agent:needs-human
            (( status == 5 )) && target=agent:decompose
            for label in agent:auto agent:pool agent:qwen agent:gemini agent:working; do
              gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "$label" >/dev/null 2>&1 || true
            done
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label "$target" >/dev/null
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body \
              "Agent pool: AGENT_PLAN delegado no ejecutable ($reason). Destino: $target." >/dev/null
            echo "reserved=false" >> "$GITHUB_OUTPUT"
            echo "reason=plan-delegado-invalido" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if grep -q '"files": \[\]' .agent-plan.json 2>/dev/null; then
            printf 'reserved=false\nreason=sin-corte-seguro\n' >> "$GITHUB_OUTPUT"
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label agent:needs-human --remove-label agent:working >/dev/null 2>&1 || true
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "Agent pool ($PROVIDER): no encontro un corte seguro y concreto; requiere revision humana." || true
            exit 0
          fi

          files="$(jq -r '.files|join(",")' .agent-plan.json)"
          goal="$(jq -r '.goal|gsub("[[:space:]]+";"-")' .agent-plan.json)"
          claim="CLAIM issue=#$ISSUE agent=Pool-$PROVIDER branch=$BRANCH files=$files goal=$goal lease=2h"
          cid="$(gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$(python3 scripts/gestionar_reservas_rollover.py --active)/comments" -f body="$claim" --jq .id)"
          python3 scripts/gestionar_reservas_rollover.py --comments-output /tmp/reservas.json
          # Capa única de lectura de #182 (#1662): misma semántica que el barrido
          # (lease, HEARTBEAT, PR_READY, RELEASE por rama) y sin parser propio aquí,
          # que daba por vivos CLAIM no canónicos que nunca se liberan.
          python3 scripts/reservas_registro.py conflictos \
            --comments /tmp/reservas.json --claim-id "$cid" --issue "$ISSUE" --branch "$BRANCH" \
            > /tmp/reserva.json
          if [[ "$(jq -r '.mine_found' /tmp/reserva.json)" != true ]]; then
            echo "CLAIM perdido" >&2
            exit 1
          fi
          if [[ "$(jq '.conflicts | length' /tmp/reserva.json)" -gt 0 ]]; then
            echo "reserved=false" >> "$GITHUB_OUTPUT"
            echo "reason=solape:$(jq -r '[.conflicts[].branch] | join(",")' /tmp/reserva.json)" >> "$GITHUB_OUTPUT"
          else
            echo "reserved=true" >> "$GITHUB_OUTPUT"
          fi

          if grep -q '^reserved=false$' "$GITHUB_OUTPUT"; then
            gh issue comment "$(python3 scripts/gestionar_reservas_rollover.py --active)" --repo "$GITHUB_REPOSITORY" --body "RELEASE issue=#$ISSUE branch=$BRANCH motivo=colision-agent-pool" >/dev/null || true
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" \
              --remove-label agent:working --remove-label agent:needs-human \
              >/dev/null 2>&1 || true
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body \
              "Agent pool: $(grep '^reason=' "$GITHUB_OUTPUT"|cut -d= -f2-). Se reencola automáticamente; la colisión de CLAIM no requiere intervención humana." || true
          fi

      - name: Renovar lease Deno · implementing
        if: steps.reserve.outputs.reserved == 'true' && steps.guard.outputs.control == 'deno'
        continue-on-error: true
        env:
          CONTROL_URL: ${{ vars.SIGA98_FEEDBACK_FALLBACK_URL }}
          ISSUE: ${{ inputs.issue }}
          LEASE_ID: ${{ steps.guard.outputs.lease_id }}
        run: |
          set -euo pipefail
          base="${CONTROL_URL%/}"
          base="${base%/api/report}"
          oidc_json="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=siga98-agent-pool")"
          oidc_token="$(jq -er '.value' <<<"$oidc_json")"
          payload="$(jq -nc --argjson issue "$ISSUE" --arg lease "$LEASE_ID" \
            '{schema:1,issue:$issue,lease_id:$lease,state:"implementing"}')"
          curl -fsS -X POST "$base/api/agent-pool/transition" \
            -H "Authorization: Bearer $oidc_token" \
            -H 'Content-Type: application/json' --data "$payload" >/dev/null

      - id: protocol
        name: Compilar TaskPacket y prompt del worker
        if: steps.reserve.outputs.reserved == 'true'
        env:
          PROVIDER: ${{ inputs.provider }}
          WORKER: ${{ inputs.worker }}
          MAX_FILES: ${{ vars.AGENT_POOL_MAX_FILES || '1' }}
          RETRY_HINT: ${{ inputs.retry_hint || '' }}
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse HEAD)"
          policy_sha="$(tr -d '\r\n' < .agent-platino-sha)"
          python3 scripts/agent_protocol.py task \
            --issue-json /tmp/agent-issue.json \
            --plan .agent-plan.json \
            --repo "$GITHUB_REPOSITORY" \
            --base-sha "$base_sha" \
            --policy-sha "$policy_sha" \
            --provider "$PROVIDER" \
            --worker "$WORKER" \
            --max-files "$MAX_FILES" \
            --output .agent-task-packet.json
          python3 scripts/agent_protocol.py prompt \
            --packet .agent-task-packet.json \
            --provider "$PROVIDER" \
            --output .agent-worker-prompt.md
          if [[ -n "${RETRY_HINT:-}" ]]; then
            {
              echo
              echo "## Feedback del intento anterior"
              printf '%s\n' "$RETRY_HINT" | head -c 1200
              echo
              echo "Corrige únicamente esta causa manteniendo el mismo objetivo y fichero."
            } >> .agent-worker-prompt.md
          fi
          [[ "$(jq -r '.base_sha' .agent-task-packet.json)" == "$base_sha" ]]
          echo "task_id=$(jq -r '.task_id' .agent-task-packet.json)" >> "$GITHUB_OUTPUT"

      - id: b2b_inbox
        name: Refrescar inbox B2B para implementacion
        if: steps.reserve.outputs.reserved == 'true' && steps.guard.outputs.control == 'deno'
        continue-on-error: true
        env:
          SIGA98_FEEDBACK_FALLBACK_URL: ${{ vars.SIGA98_FEEDBACK_FALLBACK_URL }}
          TASK_ID: ${{ steps.protocol.outputs.task_id }}
        run: |
          set -euo pipefail
          python3 scripts/agent_b2b_mailbox.py             --output /tmp/agent-b2b-inbox.json             inbox --recipient worker --task-id "$TASK_ID" --limit 20
          {
            echo "# Mensajes B2B dirigidos"
            echo
            jq -r '.messages[] |
              "- [\(.message_type)] \(.subject // "")\n  \(.body // "")\n  evidencia: \((.evidence // []) | join("; "))"'               /tmp/agent-b2b-inbox.json
          } > .agent-b2b-inbox.md

      - name: Crear rama
        if: steps.reserve.outputs.reserved == 'true'
        env:
          BRANCH: ${{ steps.guard.outputs.branch }}
        run: git checkout -b "$BRANCH"

      - id: implement_qwen
        name: Implementar con Qwen
        if: steps.reserve.outputs.reserved == 'true' && inputs.provider == 'qwen'
        # Un modelo lento no puede agotar los 60 min del job: falla con margen
        # para liberar la reserva (#1695: Nemotron Super superó 40 min).
        timeout-minutes: 35
        continue-on-error: true
        uses: QwenLM/qwen-code-action@05f81718976f3b7da657422e6e8e4d372b8621d7 # v1
        with:
          openai_api_key: ${{ steps.qwen_config.outputs.credential == 'omniroute' && secrets.OMNIROUTE_API_KEY || steps.qwen_config.outputs.credential == 'primary' && secrets.QWEN_API_KEY || secrets[steps.qwen_config.outputs.key_secret] }}
          openai_base_url: ${{ steps.qwen_proxy.outputs.url || steps.qwen_config.outputs.url }}
          openai_model: ${{ steps.qwen_config.outputs.model }}
          qwen_cli_version: ${{ vars.QWEN_CLI_VERSION || 'latest' }}
          settings: '{"model":{"maxSessionTurns":40},"experimental":{"emitToolUseSummaries":false},"tools":{"core":["read_file","write_file","edit","glob","grep_search","list_directory"]}}'
          prompt: 'Lee .agent-worker-prompt.md y haz exactamente lo que dice: contiene toda la tarea. No leas ningun otro fichero de contexto (.agent-task-packet.json, .agent-*, AGENTS.md, .agent-platino/); solo el fichero asignado. Termina con el bloque AGENT_RESULT.'

      - id: implement_gemini
        name: Implementar con Gemini
        if: steps.reserve.outputs.reserved == 'true' && inputs.provider == 'gemini'
        # Un modelo lento no puede agotar los 60 min del job: falla con margen
        # para liberar la reserva (#1695: Nemotron Super superó 40 min).
        timeout-minutes: 35
        continue-on-error: true
        uses: google-github-actions/run-gemini-cli@f77273f4c914e4bf38440cf36a0369cb64a37489 # v0.1.22
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: ${{ vars.GEMINI_MODEL }}
          gemini_cli_version: ${{ vars.GEMINI_CLI_VERSION || 'latest' }}
          settings: '{"model":{"maxSessionTurns":40},"tools":{"core":["read_file","write_file","replace","glob","grep_search","list_directory"]}}'
          prompt: 'Lee .agent-worker-prompt.md y haz exactamente lo que dice: contiene toda la tarea. No leas ningun otro fichero de contexto (.agent-task-packet.json, .agent-*, AGENTS.md, .agent-platino/); solo el fichero asignado. Termina con el bloque AGENT_RESULT.'

      - name: Confirmar inbox B2B consumido
        if: >-
          steps.reserve.outputs.reserved == 'true' &&
          steps.guard.outputs.control == 'deno' &&
          (steps.implement_qwen.outcome == 'success' || steps.implement_gemini.outcome == 'success')
        continue-on-error: true
        env:
          SIGA98_FEEDBACK_FALLBACK_URL: ${{ vars.SIGA98_FEEDBACK_FALLBACK_URL }}
          TASK_ID: ${{ steps.protocol.outputs.task_id }}
        run: |
          set -euo pipefail
          [[ -s /tmp/agent-b2b-inbox.json ]] || exit 0
          jq -r '.messages[].message_id' /tmp/agent-b2b-inbox.json | while IFS= read -r message_id; do
            [[ -n "$message_id" ]] || continue
            python3 scripts/agent_b2b_mailbox.py ack               --recipient worker --task-id "$TASK_ID" --message-id "$message_id" >/dev/null
          done

      - id: claim_guard
        name: Normalizar cambios al CLAIM
        if: steps.reserve.outputs.reserved == 'true'
        run: |
          set -euo pipefail
          python3 scripts/agent_claim_guard.py \
            --plan .agent-plan.json \
            --report /tmp/claim-guard.json \
            --restore
          outside="$(jq -c '.outside' /tmp/claim-guard.json)"
          count="$(jq '.outside | length' /tmp/claim-guard.json)"
          if [[ "$count" -gt 0 ]]; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
            echo "outside=$outside" >> "$GITHUB_OUTPUT"
          else
            echo "drift=false" >> "$GITHUB_OUTPUT"
            echo "outside=[]" >> "$GITHUB_OUTPUT"
          fi

      - id: result_contract
        name: Normalizar ResultPacket y medir handoff
        if: steps.reserve.outputs.reserved == 'true' && steps.claim_guard.outputs.drift != 'true'
        continue-on-error: true
        env:
          SUMMARY: ${{ steps.implement_qwen.outputs.summary || steps.implement_gemini.outputs.summary }}
        run: |
          set -euo pipefail
          printf '%s' "${SUMMARY:-}" > /tmp/agent-result-summary.txt
          jq -r '.changed_allowed[]' /tmp/claim-guard.json > /tmp/agent-result-changed.txt
          python3 scripts/agent_protocol.py result \
            --summary-file /tmp/agent-result-summary.txt \
            --packet .agent-task-packet.json \
            --changed-files /tmp/agent-result-changed.txt \
            --output /tmp/agent-result.json >/dev/null
          valid="$(jq -r '.result.valid' /tmp/agent-result.json)"
          status="$(jq -r '.result.status // "missing"' /tmp/agent-result.json)"
          loss="$(jq -r '.metrics.handoff_loss_proxy_pct' /tmp/agent-result.json)"
          coverage="$(jq -r '.metrics.contract_coverage_pct // 0' /tmp/agent-result.json)"
          echo "valid=$valid" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "handoff_loss=$loss" >> "$GITHUB_OUTPUT"
          echo "coverage=$coverage" >> "$GITHUB_OUTPUT"
          {
            echo "### Agent protocol v1"
            echo "- ResultPacket valido: $valid"
            echo "- Estado: $status"
            echo "- Handoff loss proxy: $loss%"
            echo "- Contract coverage: $coverage%"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Renovar lease Deno · validating
        if: steps.reserve.outputs.reserved == 'true' && steps.claim_guard.outputs.drift != 'true' && steps.guard.outputs.control == 'deno'
        continue-on-error: true
        env:
          CONTROL_URL: ${{ vars.SIGA98_FEEDBACK_FALLBACK_URL }}
          ISSUE: ${{ inputs.issue }}
          LEASE_ID: ${{ steps.guard.outputs.lease_id }}
        run: |
          set -euo pipefail
          base="${CONTROL_URL%/}"
          base="${base%/api/report}"
          oidc_json="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=siga98-agent-pool")"
          oidc_token="$(jq -er '.value' <<<"$oidc_json")"
          payload="$(jq -nc --argjson issue "$ISSUE" --arg lease "$LEASE_ID" \
            '{schema:1,issue:$issue,lease_id:$lease,state:"validating"}')"
          curl -fsS -X POST "$base/api/agent-pool/transition" \
            -H "Authorization: Bearer $oidc_token" \
            -H 'Content-Type: application/json' --data "$payload" >/dev/null

      - id: replan
        name: Replanificar pool tras desvio de CLAIM
        if: steps.reserve.outputs.reserved == 'true' && steps.claim_guard.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
          PROVIDER: ${{ inputs.provider }}
          WORKER: ${{ inputs.worker }}
          BRANCH: ${{ steps.guard.outputs.branch }}
          MAX_REPLANS: '2'
          SIGA98_FEEDBACK_FALLBACK_URL: ${{ vars.SIGA98_FEEDBACK_FALLBACK_URL }}
          TASK_ID: ${{ steps.protocol.outputs.task_id }}
          CONTROL: ${{ steps.guard.outputs.control }}
        run: |
          set -euo pipefail
          outside="$(jq -r '.outside | join(",")' /tmp/claim-guard.json)"
          previous="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments?per_page=100" --jq '.[]' |
              jq -s '[.[] | select(.user.login == "github-actions[bot]" and ((.body // "") | startswith("AGENT_POOL_REPLAN ")))] | length'
          )"
          attempt=$((previous + 1))

          if [[ "$CONTROL" == deno && -n "${TASK_ID:-}" ]]; then
            mapfile -t observed < <(jq -r '.outside[]' /tmp/claim-guard.json)
            for recipient in dispatcher worker; do
              args=(
                send
                --task-id "$TASK_ID"
                --type BLOCKER
                --recipient "$recipient"
                --idempotency-key "claim-drift-${GITHUB_RUN_ID}-$attempt-$recipient"
                --correlation-id "$TASK_ID"
                --subject "CLAIM incompleto en #$ISSUE"
                --body "El worker detectó rutas necesarias fuera del CLAIM; el siguiente plan debe reinspeccionarlas antes de reservar."
                --blocking
              )
              for path in "${observed[@]}"; do
                args+=(--evidence "$path")
              done
              python3 scripts/agent_b2b_mailbox.py "${args[@]}" >/dev/null || true
            done
          fi

          gh issue comment "$(python3 scripts/gestionar_reservas_rollover.py --active)" --repo "$GITHUB_REPOSITORY" \
            --body "RELEASE issue=#$ISSUE branch=$BRANCH motivo=agent-pool-replan-claim-incompleto" \
            >/dev/null || true
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" \
            --remove-label agent:working --remove-label agent:needs-human \
            >/dev/null 2>&1 || true

          if (( attempt <= MAX_REPLANS )); then
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body \
              "AGENT_POOL_REPLAN attempt=$attempt provider=$PROVIDER worker=$WORKER observed_paths=$outside

              La implementacion intento modificar rutas fuera del CLAIM. El worker ya restauro esos cambios y no publicara nada de este intento. El proximo plan debe reinspeccionar la integracion, incluir las rutas observadas solo si son realmente necesarias y volver a comprobar #182."
            gh workflow run agent-worker.yml --repo "$GITHUB_REPOSITORY" --ref main \
              -f issue="$ISSUE" -f provider="$PROVIDER" -f worker="$WORKER"
            echo "scheduled=true" >> "$GITHUB_OUTPUT"
          else
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" \
              --add-label agent:needs-human >/dev/null
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body \
              "AGENT_POOL_REPLAN attempt=$attempt provider=$PROVIDER worker=$WORKER observed_paths=$outside

              Se agoto el limite de $MAX_REPLANS replans automaticos del pool. Los cambios fuera del CLAIM fueron restaurados y no se publico ningun PR."
            echo "scheduled=false" >> "$GITHUB_OUTPUT"
          fi

          git reset --hard HEAD
          git clean -fd

      - id: validate_diff
        name: Validar diff y preflight
        if: steps.reserve.outputs.reserved == 'true' && steps.claim_guard.outputs.drift != 'true'
        env:
          IMPLEMENT_OUTCOME: ${{ inputs.provider == 'qwen' && steps.implement_qwen.outcome || steps.implement_gemini.outcome }}
        run: |
          set -euo pipefail
          # Copia para «Limpiar fallo»: detecta cuota/sobrecarga leyendo fichero,
          # no el summary por env (#1881), y *-artifacts se borra más abajo.
          mkdir -p /tmp/agent-output-implement
          cp qwen-artifacts/*.log gemini-artifacts/*.log /tmp/agent-output-implement/ 2>/dev/null || true
          # La implementación usa continue-on-error: si se cortó (timeout, error de
          # API) sus cambios están a medias y nunca deben llegar a una PR.
          if [[ "$IMPLEMENT_OUTCOME" != success ]]; then
            echo "retry_stage=implement" >> "$GITHUB_OUTPUT"
            echo "::error::implementación incompleta (outcome=$IMPLEMENT_OUTCOME); la política decidirá retry/rotación" >&2
            exit 1
          fi
          cp .agent-plan.json /tmp/plan.json
          cp .agent-task.md /tmp/agent-task.md
          rm -f .agent-task.md .agent-plan.json .agent-task-packet.json .agent-worker-prompt.md .agent-b2b-inbox.md .agent-context.md .agent-memory.json .agent-history.json .agent-platino-sha gha-creds-*.json
          rm -rf .agent-platino .agent-wiki .gemini .qwen gemini-artifacts qwen-artifacts
          # Cualquier otro auxiliar que cree el worker (.agent-result.json en #1894)
          # no es contenido del repo: los planes no pueden reservar rutas .agent-*.
          rm -rf ./.agent-*
          git add -A
          if git diff --cached --quiet; then
            echo "retry_stage=no-changes" >> "$GITHUB_OUTPUT"
            echo "::error::implementación terminó sin cambios; se detendrá sin penalizar el worker" >&2
            exit 2
          fi
          python3 - <<'PY'
          import json, subprocess
          allowed=set(json.load(open("/tmp/plan.json"))["files"])
          changed=subprocess.check_output(["git","diff","--cached","--name-only"],text=True).splitlines()
          bad=[path for path in changed if path not in allowed]
          if bad:
              raise SystemExit("fuera de CLAIM: "+",".join(bad))
          PY
          mapfile -t files < <(git diff --cached --name-only)
          gd_files=(); backend=false
          for file in "${files[@]}"; do
            [[ "$file" == *.gd && -f "$file" ]] && gd_files+=("$file")
            [[ "$file" == backend/* ]] && backend=true
          done
          if (( ${#gd_files[@]} )); then
            # gdtoolkit en venv propio (PEP 668). Autoformato como en local, antes
            # de que el preflight compruebe con --check.
            python3 -m venv /tmp/gdtoolkit
            /tmp/gdtoolkit/bin/pip install --quiet --disable-pip-version-check gdtoolkit==4.3.4
            export PATH="/tmp/gdtoolkit/bin:$PATH"
            gdformat "${gd_files[@]}"
            git add -- "${gd_files[@]}"
          fi
          # Preflight dirigido (#1636): solo lo que toca el diff. La suite completa
          # necesita Godot y es trabajo del CI canónico que se lanza sobre la PR.
          : > /tmp/agent-preflight-failure.log
          if ! python3 scripts/agent_preflight.py --changed "${files[@]}" \
            --report /tmp/agent-preflight.json 2>&1 | tee /tmp/agent-preflight-failure.log; then
            echo "retry_stage=preflight" >> "$GITHUB_OUTPUT"
            exit 3
          fi
          if [[ "$backend" == true ]]; then
            if ! (cd backend && mvn test && npm ci && npm test) \
              2>&1 | tee -a /tmp/agent-preflight-failure.log; then
              echo "retry_stage=preflight" >> "$GITHUB_OUTPUT"
              exit 3
            fi
          fi

          git diff --cached --no-ext-diff --unified=3 > /tmp/agent-review.diff
          python3 - <<'PY'
          import os, secrets
          from pathlib import Path
          task=Path("/tmp/agent-task.md").read_text(encoding="utf-8")[:12000]
          plan=Path("/tmp/plan.json").read_text(encoding="utf-8")[:4000]
          diff=Path("/tmp/agent-review.diff").read_text(encoding="utf-8")[:32000]
          # Código de lectura (#2038): solo existe en este fichero; si el reviewer
          # no lo devuelve, contestó sin leer el diff.
          nonce=secrets.token_hex(4)
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as out:
              out.write("review_nonce="+nonce+"\n")
          Path(".agent-review-input.md").write_text(
              "# Reviewer input\n\nCódigo de lectura (input_nonce): "+nonce+
              "\n\n## Issue\n"+task+
              "\n\n## Plan reservado\n"+plan+
              "\n\n## Diff staged\n```diff\n"+diff+"\n```\n",
              encoding="utf-8",
          )
          PY

      - id: b2b_review_handoff
        name: Transportar EVIDENCE/HANDOFF al reviewer
        if: >-
          steps.reserve.outputs.reserved == 'true' &&
          steps.claim_guard.outputs.drift != 'true' &&
          steps.guard.outputs.control == 'deno'
        continue-on-error: true
        env:
          SIGA98_FEEDBACK_FALLBACK_URL: ${{ vars.SIGA98_FEEDBACK_FALLBACK_URL }}
          TASK_ID: ${{ steps.protocol.outputs.task_id }}
          RESULT_VALID: ${{ steps.result_contract.outputs.valid || 'false' }}
          RESULT_STATUS: ${{ steps.result_contract.outputs.status || 'missing' }}
          HANDOFF_LOSS: ${{ steps.result_contract.outputs.handoff_loss || '100' }}
        run: |
          set -euo pipefail
          evidence_args=()
          if [[ -s /tmp/agent-result-changed.txt ]]; then
            while IFS= read -r path; do
              [[ -n "$path" ]] || continue
              evidence_args+=(--evidence "$path")
            done < <(head -n 8 /tmp/agent-result-changed.txt)
          fi

          python3 scripts/agent_b2b_mailbox.py send             --task-id "$TASK_ID"             --type EVIDENCE             --recipient reviewer             --idempotency-key "evidence-review-${GITHUB_RUN_ID}"             --correlation-id "$TASK_ID"             --subject "Evidencia de implementación"             --body "Preflight completado; ResultPacket valid=$RESULT_VALID status=$RESULT_STATUS handoff-loss=$HANDOFF_LOSS%."             "${evidence_args[@]}" >/dev/null

          python3 scripts/agent_b2b_mailbox.py send             --task-id "$TASK_ID"             --type HANDOFF             --recipient reviewer             --idempotency-key "handoff-review-${GITHUB_RUN_ID}"             --correlation-id "$TASK_ID"             --subject "Implementación lista para reviewer"             --body "Revisa el input acotado ya materializado; este handoff aporta evidencia compacta y no amplía el CLAIM." >/dev/null

          python3 scripts/agent_b2b_mailbox.py             --output /tmp/agent-b2b-reviewer-inbox.json             inbox --recipient reviewer --task-id "$TASK_ID" --limit 20
          {
            echo
            echo "## Handoff B2B dirigido"
            jq -r '.messages[] |
              "- [\(.message_type)] \(.subject // "")\n  \(.body // "")\n  evidencia: \((.evidence // []) | join("; "))"'               /tmp/agent-b2b-reviewer-inbox.json
          } >> .agent-review-input.md

      - id: review_qwen
        name: Reviewer acotado Qwen
        if: steps.reserve.outputs.reserved == 'true' && steps.claim_guard.outputs.drift != 'true' && inputs.provider == 'qwen'
        timeout-minutes: 3
        continue-on-error: true
        uses: QwenLM/qwen-code-action@05f81718976f3b7da657422e6e8e4d372b8621d7 # v1
        with:
          openai_api_key: ${{ steps.qwen_config.outputs.credential == 'omniroute' && secrets.OMNIROUTE_API_KEY || steps.qwen_config.outputs.credential == 'primary' && secrets.QWEN_API_KEY || secrets[steps.qwen_config.outputs.key_secret] }}
          openai_base_url: ${{ steps.qwen_proxy.outputs.url || steps.qwen_config.outputs.url }}
          openai_model: ${{ steps.qwen_config.outputs.model }}
          qwen_cli_version: ${{ vars.QWEN_CLI_VERSION || 'latest' }}
          settings: '{"model":{"maxSessionTurns":4},"experimental":{"emitToolUseSummaries":false},"tools":{"core":["read_file"]}}'
          prompt: 'Primero usa read_file para leer .agent-review-input.md: es obligatorio y es el unico archivo que puedes abrir. No uses shell, no edites nada y no propongas refactors generales. Revisa solo incumplimiento del issue/plan, bug claro del diff, test imprescindible ausente o violacion evidente de seguridad inferible del input. Maximo 5 hallazgos, una frase cada uno. En input_nonce copia el codigo de lectura que aparece al principio de ese archivo; sin el, la revision se descarta. Termina inmediatamente con AGENT_REVIEW_BEGIN seguido de JSON {"schema":1,"message_type":"REVIEW","input_nonce":"CODIGO","verdict":"approve","findings":[]} o {"schema":1,"message_type":"REVIEW","input_nonce":"CODIGO","verdict":"findings","findings":["..."]} y AGENT_REVIEW_END.'

      - id: review_gemini
        name: Reviewer acotado Gemini
        if: steps.reserve.outputs.reserved == 'true' && steps.claim_guard.outputs.drift != 'true' && inputs.provider == 'gemini'
        timeout-minutes: 3
        continue-on-error: true
        uses: google-github-actions/run-gemini-cli@f77273f4c914e4bf38440cf36a0369cb64a37489 # v0.1.22
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: ${{ vars.GEMINI_MODEL }}
          gemini_cli_version: ${{ vars.GEMINI_CLI_VERSION || 'latest' }}
          settings: '{"model":{"maxSessionTurns":4},"tools":{"core":["read_file"]}}'
          prompt: 'Primero usa read_file para leer .agent-review-input.md: es obligatorio y es el unico archivo que puedes abrir. No uses shell, no edites nada y no propongas refactors generales. Revisa solo incumplimiento del issue/plan, bug claro del diff, test imprescindible ausente o violacion evidente de seguridad inferible del input. Maximo 5 hallazgos, una frase cada uno. En input_nonce copia el codigo de lectura que aparece al principio de ese archivo; sin el, la revision se descarta. Termina inmediatamente con AGENT_REVIEW_BEGIN seguido de JSON {"schema":1,"message_type":"REVIEW","input_nonce":"CODIGO","verdict":"approve","findings":[]} o {"schema":1,"message_type":"REVIEW","input_nonce":"CODIGO","verdict":"findings","findings":["..."]} y AGENT_REVIEW_END.'

      - id: review_contract
        name: Normalizar reviewer no bloqueante
        if: steps.reserve.outputs.reserved == 'true' && steps.claim_guard.outputs.drift != 'true'
        env:
          SUMMARY: ${{ steps.review_qwen.outputs.summary || steps.review_gemini.outputs.summary }}
          REVIEW_NONCE: ${{ steps.validate_diff.outputs.review_nonce }}
        run: |
          set -euo pipefail
          printf '%s' "${SUMMARY:-}" > /tmp/agent-review-summary.txt
          python3 scripts/agent_review_contract.py \
            --summary-file /tmp/agent-review-summary.txt \
            --nonce "${REVIEW_NONCE:-}" \
            --output /tmp/agent-review.json >/dev/null
          echo "status=$(jq -r '.status' /tmp/agent-review.json)" >> "$GITHUB_OUTPUT"
          echo "verdict=$(jq -r '.verdict // "skipped"' /tmp/agent-review.json)" >> "$GITHUB_OUTPUT"
          rm -f .agent-review-input.md
          rm -rf .gemini .qwen gemini-artifacts qwen-artifacts

      - id: b2b_review_publish
        name: Publicar RESULT/REVIEW B2B y confirmar reviewer
        if: >-
          steps.reserve.outputs.reserved == 'true' &&
          steps.claim_guard.outputs.drift != 'true' &&
          steps.guard.outputs.control == 'deno'
        continue-on-error: true
        env:
          SIGA98_FEEDBACK_FALLBACK_URL: ${{ vars.SIGA98_FEEDBACK_FALLBACK_URL }}
          TASK_ID: ${{ steps.protocol.outputs.task_id }}
          REVIEW_STATUS: ${{ steps.review_contract.outputs.status || 'skipped' }}
          REVIEW_VERDICT: ${{ steps.review_contract.outputs.verdict || 'skipped' }}
          RESULT_STATUS: ${{ steps.result_contract.outputs.status || 'missing' }}
          HANDOFF_LOSS: ${{ steps.result_contract.outputs.handoff_loss || '100' }}
        run: |
          set -euo pipefail
          result_summary="$(jq -r '.result.summary // "ResultPacket no disponible"' /tmp/agent-result.json)"
          result_next="$(jq -r '.result.next_action // ""' /tmp/agent-result.json)"
          mapfile -t result_evidence < <(jq -r '.result.evidence[]?.detail // empty' /tmp/agent-result.json | head -n 8)
          result_args=()
          for item in "${result_evidence[@]}"; do
            [[ -n "$item" ]] && result_args+=(--evidence "$item")
          done

          python3 scripts/agent_b2b_mailbox.py send             --task-id "$TASK_ID"             --type RESULT             --recipient dispatcher             --idempotency-key "result-dispatch-${GITHUB_RUN_ID}"             --correlation-id "$TASK_ID"             --subject "ResultPacket $RESULT_STATUS"             --body "$result_summary"             "${result_args[@]}" >/dev/null

          mapfile -t findings < <(jq -r '.findings[]? // empty' /tmp/agent-review.json | head -n 5)
          review_args=()
          for item in "${findings[@]}"; do
            [[ -n "$item" ]] && review_args+=(--evidence "$item")
          done
          python3 scripts/agent_b2b_mailbox.py send             --task-id "$TASK_ID"             --type REVIEW             --recipient dispatcher             --idempotency-key "review-dispatch-${GITHUB_RUN_ID}"             --correlation-id "$TASK_ID"             --subject "Reviewer $REVIEW_STATUS/$REVIEW_VERDICT"             --body "Reviewer acotado completado; handoff-loss del implementer: $HANDOFF_LOSS%."             "${review_args[@]}" >/dev/null

          if [[ "$RESULT_STATUS" == blocked ]]; then
            mapfile -t unresolved < <(jq -r '.result.unresolved[]? // empty' /tmp/agent-result.json | head -n 8)
            blocker_args=()
            for item in "${unresolved[@]}"; do
              [[ -n "$item" ]] && blocker_args+=(--evidence "$item")
            done
            python3 scripts/agent_b2b_mailbox.py send               --task-id "$TASK_ID"               --type BLOCKER               --recipient dispatcher               --idempotency-key "result-blocked-${GITHUB_RUN_ID}"               --correlation-id "$TASK_ID"               --subject "Implementación bloqueada"               --body "${result_next:-El ResultPacket terminó bloqueado; revisar la evidencia dirigida.}"               --blocking               "${blocker_args[@]}" >/dev/null
          fi

          [[ -s /tmp/agent-b2b-reviewer-inbox.json ]] || exit 0
          jq -r '.messages[].message_id' /tmp/agent-b2b-reviewer-inbox.json | while IFS= read -r message_id; do
            [[ -n "$message_id" ]] || continue
            python3 scripts/agent_b2b_mailbox.py ack               --recipient reviewer --task-id "$TASK_ID" --message-id "$message_id" >/dev/null
          done

      - name: Guardar memoria de trabajo
        if: steps.reserve.outputs.reserved == 'true' && steps.claim_guard.outputs.drift != 'true'
        continue-on-error: true
        env:
          ISSUE: ${{ inputs.issue }}
          PROVIDER: ${{ inputs.provider }}
          MEMORY_URL: ${{ vars.SIGA98_FEEDBACK_FALLBACK_URL }}
          SUMMARY: ${{ steps.implement_qwen.outputs.summary || steps.implement_gemini.outputs.summary }}
        run: |
          set -euo pipefail
          [[ -z "${MEMORY_URL:-}" ]] && exit 0
          printf '%s' "$SUMMARY" > /tmp/agent-summary.txt
          python3 - <<'PY'
          import json, re
          raw=open("/tmp/agent-summary.txt",encoding="utf-8").read()
          match=re.search(r"AGENT_MEMORY_BEGIN\s*(?:```(?:json)?\s*)?(\{.*?\})(?:\s*```)?\s*AGENT_MEMORY_END",raw,re.S|re.I)
          if not match:
              raise SystemExit(0)
          data=json.loads(match.group(1))
          summary=str(data.get("summary","")).strip()
          tags=data.get("tags",[])
          if len(summary)<20 or not isinstance(tags,list):
              raise SystemExit(0)
          open("/tmp/agent-memory-note.json","w",encoding="utf-8").write(
              json.dumps({"summary":summary,"tags":tags},ensure_ascii=False)
          )
          PY
          [[ -s /tmp/agent-memory-note.json ]] || exit 0
          base="${MEMORY_URL%/}"
          base="${base%/api/report}"
          paths="$(jq -c '.files' /tmp/plan.json)"
          payload="$(jq -c --argjson issue "$ISSUE" --arg provider "$PROVIDER" --argjson paths "$paths" \
            '. + {schema:1,issue:$issue,provider:$provider,paths:$paths}' /tmp/agent-memory-note.json)"
          oidc_json="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=siga98-agent-memory")"
          oidc_token="$(jq -er '.value' <<<"$oidc_json")"
          curl -fsS -X POST "$base/api/agent-memory/remember" \
            -H "Authorization: Bearer $oidc_token" \
            -H 'Content-Type: application/json' \
            --data "$payload" >/dev/null

      - name: Renovar lease Deno · publishing
        if: steps.reserve.outputs.reserved == 'true' && steps.claim_guard.outputs.drift != 'true' && steps.guard.outputs.control == 'deno'
        continue-on-error: true
        env:
          CONTROL_URL: ${{ vars.SIGA98_FEEDBACK_FALLBACK_URL }}
          ISSUE: ${{ inputs.issue }}
          LEASE_ID: ${{ steps.guard.outputs.lease_id }}
        run: |
          set -euo pipefail
          base="${CONTROL_URL%/}"
          base="${base%/api/report}"
          oidc_json="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=siga98-agent-pool")"
          oidc_token="$(jq -er '.value' <<<"$oidc_json")"
          payload="$(jq -nc --argjson issue "$ISSUE" --arg lease "$LEASE_ID" \
            '{schema:1,issue:$issue,lease_id:$lease,state:"publishing"}')"
          curl -fsS -X POST "$base/api/agent-pool/transition" \
            -H "Authorization: Bearer $oidc_token" \
            -H 'Content-Type: application/json' --data "$payload" >/dev/null

      - name: Publicar PR draft y lanzar CI canonica
        if: steps.reserve.outputs.reserved == 'true' && steps.claim_guard.outputs.drift != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
          PROVIDER: ${{ inputs.provider }}
          WORKER: ${{ inputs.worker }}
          BRANCH: ${{ steps.guard.outputs.branch }}
          REVIEW_STATUS: ${{ steps.review_contract.outputs.status || 'skipped' }}
          REVIEW_VERDICT: ${{ steps.review_contract.outputs.verdict || 'skipped' }}
          RESULT_VALID: ${{ steps.result_contract.outputs.valid || 'false' }}
          RESULT_STATUS: ${{ steps.result_contract.outputs.status || 'missing' }}
          HANDOFF_LOSS: ${{ steps.result_contract.outputs.handoff_loss || '100' }}
        run: |
          set -euo pipefail
          git config user.name "agent-pool[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "agent: avanzar #$ISSUE con $WORKER"
          gh auth setup-git
          git push -u origin "$BRANCH"
          title="$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json title --jq .title)"
          if ! pr_salida="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --draft \
            --title "agent($PROVIDER): #$ISSUE $title" \
            --body "Refs #$ISSUE

          Implementacion autonoma mediante worker \`$WORKER\`. Plan reservado en #182; cambios limitados al CLAIM; preflight ejecutado. Reviewer acotado: \`$REVIEW_STATUS/$REVIEW_VERDICT\`. Protocolo v1: ResultPacket $RESULT_VALID/$RESULT_STATUS; handoff-loss proxy $HANDOFF_LOSS%. PR draft, sin auto-merge." 2>&1)"; then
            if grep -Eiq 'not permitted to create or approve pull requests|createPullRequest|Resource not accessible by integration' <<<"$pr_salida"; then
              gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" \
                --add-label agent:needs-human \
                --remove-label agent:working \
                --remove-label agent:auto \
                --remove-label agent:pool \
                --remove-label agent:qwen \
                --remove-label agent:gemini >/dev/null 2>&1 || true
              gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body \
                "Agent pool ($WORKER) completó implementación, preflight y reviewer y publicó la rama \`$BRANCH\`, pero GitHub Actions no tiene permiso para crear PRs. Habilita Settings → Actions → General → Workflow permissions → Allow GitHub Actions to create and approve pull requests o abre la PR manualmente desde esa rama. El worker no se penaliza." || true
              gh issue comment "$(python3 scripts/gestionar_reservas_rollover.py --active)" --repo "$GITHUB_REPOSITORY" \
                --body "RELEASE issue=#$ISSUE branch=$BRANCH motivo=agent-pool-pr-policy-block" \
                >/dev/null || true
              exit 0
            fi
            printf '%s\n' "$pr_salida" >&2
            exit 1
          fi
          url="$pr_salida"
          pr_number="$(gh pr view "$url" --repo "$GITHUB_REPOSITORY" --json number --jq .number 2>/dev/null || true)"
          if [[ -s /tmp/agent-review.json && "$(jq -r '.verdict // empty' /tmp/agent-review.json)" == findings ]]; then
            findings="$(jq -r '.findings[] | "- " + .' /tmp/agent-review.json)"
            gh pr comment "$url" --repo "$GITHUB_REPOSITORY" --body "Reviewer acotado (advisory; sin retries automaticos):

          $findings" >/dev/null || true
          fi
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" \
            --add-label agent:pr-open \
            --remove-label agent:working \
            --remove-label agent:auto \
            --remove-label agent:pool \
            --remove-label agent:qwen \
            --remove-label agent:gemini >/dev/null 2>&1 || true
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "Agent pool ($WORKER): $url"
          # Euriclea se dispara por PR para no depender de la capacidad limitada del
          # barrido periódico. Es best-effort: si Actions no acepta el dispatch,
          # el cron de agent-review.yml sigue siendo el fallback y el worker no falla.
          if [[ "$pr_number" =~ ^[0-9]+$ ]]; then
            if ! gh workflow run agent-review.yml --repo "$GITHUB_REPOSITORY" --ref main -f pr="$pr_number"; then
              echo "::warning::No se pudo lanzar Euriclea para PR #$pr_number; queda el barrido periódico."
            fi
          else
            echo "::warning::No se pudo resolver el número de PR para Euriclea; queda el barrido periódico."
          fi

          # Los PR creados con GITHUB_TOKEN pueden dejar el pull_request CI esperando
          # aprobacion; workflow_dispatch es la ruta no recursiva y ya usada por el autopilot.
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"

      - name: Log del proxy
        if: always() && steps.qwen_proxy.outputs.url != ''
        run: cat /tmp/agent-llm-proxy.log || true

      - name: Limpiar fallo o cancelacion
        if: (failure() || cancelled()) && inputs.issue != 0
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
          BRANCH: ${{ steps.guard.outputs.branch }}
          RESERVED: ${{ steps.reserve.outputs.reserved }}
          PROVIDER: ${{ inputs.provider }}
          WORKER: ${{ inputs.worker }}
          HAS_QWEN: ${{ secrets.QWEN_API_KEY != '' }}
          HAS_OMNIROUTE: ${{ secrets.OMNIROUTE_API_KEY != '' && secrets.TS_OAUTH_CLIENT_ID != '' && (secrets.TS_OAUTH_SECRET != '' || secrets.TS_AUDIENCE != '') && vars.OMNIROUTE_BASE_URL != '' && vars.OMNIROUTE_MODEL != '' }}
          VARS_JSON: ${{ toJSON(vars) }}
          POOL_FALLBACK_KEYS: ${{ inputs.fallback_keys }}
          HAS_GEMINI: ${{ secrets.GEMINI_API_KEY != '' }}
          IMPLEMENT_QWEN_OUTCOME: ${{ steps.implement_qwen.outcome }}
          IMPLEMENT_GEMINI_OUTCOME: ${{ steps.implement_gemini.outcome }}
          RETRY_STAGE: ${{ steps.validate_diff.outputs.retry_stage }}
          AGENT_PROVIDER_COOLDOWN_SECONDS: ${{ vars.AGENT_PROVIDER_COOLDOWN_SECONDS || '3600' }}
          CONTROL_URL: ${{ vars.SIGA98_FEEDBACK_FALLBACK_URL }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "${BRANCH:-none}" --json number --jq '.[0].number // empty' || true)"

          if [[ "$JOB_STATUS" == cancelled ]]; then
            if [[ -n "$pr" ]]; then
              gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" \
                --add-label agent:pr-open \
                --remove-label agent:working \
                --remove-label agent:needs-human \
                --remove-label agent:auto \
                --remove-label agent:pool \
                --remove-label agent:qwen \
                --remove-label agent:gemini \
                >/dev/null 2>&1 || true
              gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body \
                "Agent pool ($WORKER) fue cancelado, pero ya existe PR #$pr; se conserva la reserva y se normaliza el estado a agent:pr-open." || true
            else
              if [[ "${RESERVED:-}" == true && -n "${BRANCH:-}" ]]; then
                gh issue comment "$(python3 scripts/gestionar_reservas_rollover.py --active)" --repo "$GITHUB_REPOSITORY" \
                  --body "RELEASE issue=#$ISSUE branch=$BRANCH motivo=agent-pool-cancelado-sin-PR" \
                  >/dev/null || true
              fi
              gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" \
                --remove-label agent:working --remove-label agent:needs-human \
                >/dev/null 2>&1 || true
              gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body \
                "Agent pool ($WORKER) fue cancelado antes de publicar PR; se libera el CLAIM y la tarea vuelve a cola sin penalizar al worker." || true
            fi
            exit 0
          fi

          retry_stage=""
          if [[ "${RESERVED:-}" == true && -z "$pr" && -n "${RETRY_STAGE:-}" ]]; then
            retry_stage="$RETRY_STAGE"
          fi

          if [[ -n "$retry_stage" ]]; then
            output_dir=/tmp/agent-output-implement

            policy_args=(--stage "$retry_stage" --job-status "$JOB_STATUS")
            [[ "$retry_stage" == no-changes ]] && policy_args+=(--no-changes)
            shopt -s nullglob
            failure_files=(
              "$output_dir"/stderr.log
              /tmp/agent-preflight-failure.log
              qwen-artifacts/stderr.log
              gemini-artifacts/stderr.log
              /tmp/gemini-client-error-*.json
              "${RUNNER_TEMP:-/tmp}"/gemini-client-error-*.json
            )
            shopt -u nullglob
            for failure_file in "${failure_files[@]}"; do
              [[ -f "$failure_file" ]] && policy_args+=(--text-file "$failure_file")
            done

            decision="$(python3 scripts/agent_failure_policy.py "${policy_args[@]}")"
            category="$(jq -r '.category' <<<"$decision")"
            action="$(jq -r '.action' <<<"$decision")"
            echo "Failure policy: stage=$retry_stage category=$category action=$action"

            release_reason="agent-pool-${category}-release"
            if [[ "${RESERVED:-}" == true && -n "${BRANCH:-}" ]]; then
              gh issue comment "$(python3 scripts/gestionar_reservas_rollover.py --active)" --repo "$GITHUB_REPOSITORY" \
                --body "RELEASE issue=#$ISSUE branch=$BRANCH motivo=$release_reason" \
                >/dev/null || true
            fi
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" \
              --remove-label agent:working --remove-label agent:needs-human \
              >/dev/null 2>&1 || true

            case "$action" in
              stop_noop)
                gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" \
                  --add-label agent:needs-human >/dev/null 2>&1 || true
                gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body \
                  "Agent pool: $WORKER terminó sin diff para la tarea mono-fichero. No se penaliza ni rota el worker; se pausa el issue para comprobar si ya estaba resuelto o si el corte necesita redefinirse." || true
                exit 0
                ;;
              same_worker_fix|split_or_same_worker)
                gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json comments \
                  > /tmp/agent-same-worker-comments.json
                previous="$(
                  CATEGORY="$category" WORKER_ID="$WORKER" python3 - <<'PY'
          import json, os
          prefix=f"AGENT_POOL_SAME_WORKER_RETRY category={os.environ['CATEGORY']} worker={os.environ['WORKER_ID']} "
          data=json.load(open("/tmp/agent-same-worker-comments.json",encoding="utf-8"))
          count=0
          for comment in data.get("comments",[]):
              body=comment.get("body","") if isinstance(comment,dict) else ""
              count += sum(1 for line in body.splitlines() if line.strip().startswith(prefix))
          print(count)
          PY
                )"
                if (( previous >= 1 )); then
                  gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" \
                    --add-label agent:needs-human >/dev/null 2>&1 || true
                  gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body \
                    "Agent pool: $category se repitió con $WORKER. Se detiene sin penalizar el slot; requiere ajustar el corte o revisar el fallo antes de otro intento." || true
                  exit 0
                fi

                retry_hint="Causa: $category durante $retry_stage."
                if [[ -s /tmp/agent-preflight-failure.log ]]; then
                  detail="$(
                    grep -Ei 'FAIL|ERROR|Assertion|Traceback|Parse Error|SCRIPT ERROR|would reformat|gdlint' \
                      /tmp/agent-preflight-failure.log | tail -n 8 | tr '\n' ' ' | head -c 800 || true
                  )"
                  [[ -n "$detail" ]] && retry_hint="$retry_hint Error observado: $detail"
                elif [[ "$category" == timeout ]]; then
                  retry_hint="$retry_hint El intento anterior agotó tiempo/turnos: evita exploración y aplica el cambio mínimo en el fichero asignado."
                fi

                gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body \
                  "AGENT_POOL_SAME_WORKER_RETRY category=$category worker=$WORKER stage=$retry_stage run=$GITHUB_RUN_ID" \
                  >/dev/null || true
                gh workflow run agent-worker.yml --repo "$GITHUB_REPOSITORY" --ref main \
                  -f issue="$ISSUE" -f provider="$PROVIDER" -f worker="$WORKER" \
                  -f retry_hint="$retry_hint"
                exit 0
                ;;
              rotate_provider)
                if [[ "$category" == quota_or_overload ]]; then
                  cooldown="${AGENT_PROVIDER_COOLDOWN_SECONDS:-3600}"
                  [[ "$cooldown" =~ ^[0-9]+$ ]] || cooldown=3600
                  (( cooldown < 300 )) && cooldown=300
                  (( cooldown > 21600 )) && cooldown=21600

                  health_reported=false
                  if [[ -n "${CONTROL_URL:-}" ]]; then
                    base="${CONTROL_URL%/}"
                    base="${base%/api/report}"
                    if oidc_json="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                      "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=siga98-agent-pool")" &&
                      oidc_token="$(jq -er '.value' <<<"$oidc_json")"; then
                      payload="$(jq -nc --arg worker "$WORKER" --arg provider "$PROVIDER" \
                        --argjson cooldown "$cooldown" \
                        '{schema:1,worker:$worker,provider:$provider,status:"unhealthy",reason:"quota",cooldown_seconds:$cooldown}')"
                      if curl -fsS -X POST "$base/api/agent-pool/worker-health/report" \
                        -H "Authorization: Bearer $oidc_token" \
                        -H 'Content-Type: application/json' --data "$payload" >/dev/null; then
                        health_reported=true
                      fi
                    fi
                  fi
                  if [[ "$health_reported" != true ]]; then
                    until_epoch=$(( $(date +%s) + cooldown ))
                    gh issue comment "$(python3 scripts/gestionar_reservas_rollover.py --active)" --repo "$GITHUB_REPOSITORY" \
                      --body "AGENT_POOL_SLOT_UNHEALTHY worker=$WORKER provider=$PROVIDER reason=quota until=$until_epoch run=$GITHUB_RUN_ID" \
                      >/dev/null || true
                  fi
                fi

                marker="AGENT_POOL_WORKER_FAILURE worker=$WORKER provider=$PROVIDER stage=$retry_stage category=$category run=$GITHUB_RUN_ID"
                gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "$marker" >/dev/null || true

                labels="$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name]|join(" ")')"
                available=()
                qwen_allowed=true
                gemini_allowed=true
                [[ " $labels " == *" agent:qwen "* ]] && gemini_allowed=false
                [[ " $labels " == *" agent:gemini "* ]] && qwen_allowed=false
                if [[ "$qwen_allowed" == true ]]; then
                  [[ "$HAS_QWEN" == true || "$HAS_OMNIROUTE" == true ]] && available+=(qwen-primary)
                  if [[ -f scripts/agent_slots.py ]]; then
                    while IFS= read -r fallback_worker; do
                      [[ -n "$fallback_worker" ]] && available+=("$fallback_worker")
                    done < <(FALLBACK_KEYS="$POOL_FALLBACK_KEYS" python3 scripts/agent_slots.py listar | jq -r '.[].worker' || true)
                  fi
                fi
                if [[ "$gemini_allowed" == true && "$HAS_GEMINI" == true ]]; then
                  available+=(gemini)
                fi

                gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json comments > /tmp/agent-retry-comments.json
                available_csv="$(IFS=,; echo "${available[*]}")"
                exhausted="$(
                  AVAILABLE="$available_csv" python3 - <<'PY'
          import json, os, re
          available={item for item in os.environ.get("AVAILABLE","").split(",") if item}
          failed=set()
          pattern=re.compile(r"^AGENT_POOL_WORKER_FAILURE\s+worker=([A-Za-z0-9._-]+)\b")
          data=json.load(open("/tmp/agent-retry-comments.json",encoding="utf-8"))
          for comment in data.get("comments",[]):
              body=comment.get("body","") if isinstance(comment,dict) else ""
              for line in body.splitlines():
                  line=line.strip()
                  if line.startswith("AGENT_POOL_RETRY_RESET"):
                      failed.clear()
                      continue
                  match=pattern.match(line)
                  if match:
                      failed.add(match.group(1))
          print("true" if available and available.issubset(failed) else "false")
          PY
                )"
                if [[ "$exhausted" == true ]]; then
                  gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" \
                    --add-label agent:needs-human >/dev/null 2>&1 || true
                  gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body \
                    "Agent pool agotó los workers compatibles tras $category. Último fallo: $WORKER. Requiere revisión humana o AGENT_POOL_RETRY_RESET." || true
                else
                  detalle=""
                  [[ "$category" == quota_or_overload ]] && detalle=" El slot queda en cooldown de cuota."
                  gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body \
                    "Agent pool reencolado tras $category en $WORKER; solo esta clase de fallo rota worker/proveedor.$detalle" || true
                fi
                exit 0
                ;;
              human_review|*)
                gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" \
                  --add-label agent:needs-human >/dev/null 2>&1 || true
                gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body \
                  "Agent pool no clasifica con seguridad el fallo de $retry_stage ($category); se detiene sin penalizar otro worker." || true
                exit 0
                ;;
            esac
          fi

          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" \
            --add-label agent:needs-human --remove-label agent:working \
            >/dev/null 2>&1 || true
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body \
            "Agent pool ($WORKER) se detuvo después de reservar/implementar: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true
          if [[ "${RESERVED:-}" == true && -z "$pr" ]]; then
            gh issue comment "$(python3 scripts/gestionar_reservas_rollover.py --active)" --repo "$GITHUB_REPOSITORY" \
              --body "RELEASE issue=#$ISSUE branch=$BRANCH motivo=agent-pool-fallo-antes-de-PR" \
              >/dev/null || true
          fi


      - id: release_lease
        name: Liberar lease Deno KV
        if: always() && steps.guard.outputs.control == 'deno' && steps.guard.outputs.lease_id != ''
        continue-on-error: true
        env:
          CONTROL_URL: ${{ vars.SIGA98_FEEDBACK_FALLBACK_URL }}
          ISSUE: ${{ inputs.issue }}
          LEASE_ID: ${{ steps.guard.outputs.lease_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          base="${CONTROL_URL%/}"
          base="${base%/api/report}"
          oidc_json="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=siga98-agent-pool")"
          oidc_token="$(jq -er '.value' <<<"$oidc_json")"
          payload="$(jq -nc --argjson issue "$ISSUE" --arg lease "$LEASE_ID" --arg reason "$JOB_STATUS" \
            '{schema:1,issue:$issue,lease_id:$lease,reason:$reason}')"
          response="$(curl -fsS -X POST "$base/api/agent-pool/release" \
            -H "Authorization: Bearer $oidc_token" \
            -H 'Content-Type: application/json' --data "$payload")"
          released="$(jq -r '.released == true' <<<"$response")"
          echo "released=$released" >> "$GITHUB_OUTPUT"

      - name: Refill opt-in tras liberar slot
        if: always() && steps.release_lease.outputs.released == 'true' && vars.AGENT_POOL_REFILL_ENABLED == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_MAX: ${{ inputs.refill_max_parallel || '6' }}
        run: |
          set -euo pipefail
          case "$REQUESTED_MAX" in
            1|2|3|4|5|6) ;;
            *) REQUESTED_MAX=6 ;;
          esac
          for label in auto pool qwen gemini; do
            gh issue list --repo "$GITHUB_REPOSITORY" --state open \
              --label "agent:$label" --limit 100 \
              --json number,labels > "/tmp/refill-$label.json"
          done
          jq -s '
            add
            | unique_by(.number)
            | map(select(
                ([.labels[].name] | index("agent:working")) == null and
                ([.labels[].name] | index("agent:pr-open")) == null and
                ([.labels[].name] | index("agent:needs-human")) == null
              ))
          ' /tmp/refill-auto.json /tmp/refill-pool.json \
            /tmp/refill-qwen.json /tmp/refill-gemini.json > /tmp/refill-pending.json
          pending="$(jq 'length' /tmp/refill-pending.json)"
          if (( pending == 0 )); then
            echo "Refill: sin backlog elegible."
            exit 0
          fi
          echo "Refill: slot liberado con $pending issues pendientes; nueva preparación cap=$REQUESTED_MAX."
          gh workflow run agent-pool.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f max_parallel="$REQUESTED_MAX"
