name: Benchmark CC0

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/benchmark-cc0.yml'
      - '.godot-version'
      - 'godot/assets/**'
      - 'godot/arte/**'
      - 'godot/guion/**'
      - 'godot/pruebas/benchmark_cc0.gd'
      - 'scripts/test_benchmark_cc0.py'
      - 'docs/benchmark-cc0.md'
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      GALLIUM_DRIVER: llvmpipe
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Godot declarado por el proyecto
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat .godot-version)"
          archivo="Godot_v${version}_linux.x86_64.zip"
          base="https://github.com/godotengine/godot-builds/releases/download/${version}"
          curl --fail --location --retry 3 "$base/$archivo" -o "$RUNNER_TEMP/$archivo"
          curl --fail --location --retry 3 "$base/SHA512-SUMS.txt" -o "$RUNNER_TEMP/SHA512-SUMS.txt"
          cd "$RUNNER_TEMP"
          grep -F " $archivo" SHA512-SUMS.txt | sha512sum --check --strict
          unzip -q "$archivo"
          mkdir -p godot-bin
          mv "Godot_v${version}_linux.x86_64" godot-bin/godot4
          chmod +x godot-bin/godot4
          echo "$RUNNER_TEMP/godot-bin" >> "$GITHUB_PATH"

      - name: Importar proyecto
        run: godot4 --headless --editor --path godot --quit

      - name: Ejecutar baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmark-cc0
          xvfb-run -a godot4 --path godot --rendering-method gl_compatibility \
            --script res://pruebas/benchmark_cc0.gd -- \
            --mode=baseline --output="$GITHUB_WORKSPACE/benchmark-cc0"

      - name: Ejecutar vertical CC0 combinada
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a godot4 --path godot --rendering-method gl_compatibility \
            --script res://pruebas/benchmark_cc0.gd -- \
            --mode=full --output="$GITHUB_WORKSPACE/benchmark-cc0"

      - name: Comparar resultados
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_benchmark_cc0.py --report benchmark-cc0 | tee /tmp/benchmark-cc0.md
          cat /tmp/benchmark-cc0.md >> "$GITHUB_STEP_SUMMARY"

      - name: Adjuntar benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-cc0-${{ github.sha }}
          path: |
            benchmark-cc0/*.json
            benchmark-cc0/*.png
            benchmark-cc0/*.md
          if-no-files-found: warn
          retention-days: 14
