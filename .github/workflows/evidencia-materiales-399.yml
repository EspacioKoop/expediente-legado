name: Evidencia materiales 399

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/evidencia-materiales-399.yml'
      - '.godot-version'
      - 'godot/arte/psx*.gdshader'
      - 'godot/guion/calle_identidad.gd'
      - 'godot/guion/calle_materiales.gd'
      - 'godot/guion/espacio_3d.gd'
      - 'godot/guion/espacios_catalogo.gd'
      - 'godot/guion/textura_procedural.gd'
      - 'godot/guion/sueno*.gd'
      - 'godot/guion/casa_utileria.gd'
      - 'godot/guion/oficina_utileria.gd'
      - 'godot/escenas/dia.tscn'
      - 'godot/pruebas/capturar_materiales_399.gd'
      - 'scripts/test_evidencia_materiales_399.py'
      - 'docs/evidencias/materiales-399/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evidencia:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      GALLIUM_DRIVER: llvmpipe
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Godot declarado por el proyecto
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat .godot-version)"
          archivo="Godot_v${version}_linux.x86_64.zip"
          base="https://github.com/godotengine/godot-builds/releases/download/${version}"
          curl --fail --location --retry 3 "$base/$archivo" -o "$RUNNER_TEMP/$archivo"
          curl --fail --location --retry 3 "$base/SHA512-SUMS.txt" -o "$RUNNER_TEMP/SHA512-SUMS.txt"
          cd "$RUNNER_TEMP"
          grep -F " $archivo" SHA512-SUMS.txt | sha512sum --check --strict
          unzip -q "$archivo"
          mkdir -p godot-bin
          mv "Godot_v${version}_linux.x86_64" godot-bin/godot4
          chmod +x godot-bin/godot4
          echo "$RUNNER_TEMP/godot-bin" >> "$GITHUB_PATH"

      - name: Importar proyecto
        run: godot4 --headless --editor --path godot --quit

      - name: Validar contrato de evidencia
        run: python3 -m unittest -v scripts/test_evidencia_materiales_399.py

      - name: Renderizar oficina calle casa y sueño sin HUD
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidencia-materiales-399
          xvfb-run -a godot4 --path godot --rendering-method gl_compatibility \
            --script res://pruebas/capturar_materiales_399.gd -- \
            "$GITHUB_WORKSPACE/evidencia-materiales-399"
          for captura in oficina calle casa sueno; do
            test -s "evidencia-materiales-399/${captura}.png"
          done
          test -s evidencia-materiales-399/comparativa.png
          test -s evidencia-materiales-399/manifest.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          raiz = Path("evidencia-materiales-399")
          manifest = json.loads((raiz / "manifest.json").read_text())
          casos = {caso["id"]: caso for caso in manifest["casos"]}
          hashes = [caso["sha256"] for caso in manifest["casos"]]
          if len(hashes) != 4 or len(set(hashes)) != 4:
              raise SystemExit("las cuatro capturas deben existir y ser distintas")
          if manifest.get("comparativa") != "comparativa.png":
              raise SystemExit("el manifiesto debe declarar la comparativa")
          if not manifest.get("sha256_comparativa"):
              raise SystemExit("la comparativa debe registrar sha256")
          sueno = casos["sueno"]
          if not sueno["preservar_detalle_textura"] or sueno["materiales_detalle"] <= 0:
              raise SystemExit("el sueño debe renderizar materiales PSX con detalle opt-in")
          if sueno["materiales_deformados"] <= 0:
              raise SystemExit("el sueño debe renderizar materiales realmente deformados")
          for normal in ("oficina", "calle", "casa"):
              if casos[normal]["preservar_detalle_textura"] or casos[normal]["materiales_detalle"] != 0:
                  raise SystemExit(f"{normal} no debe activar el detalle onírico")

          lineas = [
              "# Evidencia visual de materiales · #399",
              "",
              "La comparativa 2×2 usa este orden: **oficina · calle / casa · sueño**.",
              "",
              "![Comparativa 2×2](comparativa.png)",
              "",
              "| Fase | Suelo | Muro | PSX | Texturados | Deformados | Detalle | Captura |",
              "| --- | --- | --- | ---: | ---: | ---: | ---: | --- |",
          ]
          for id_caso in ("oficina", "calle", "casa", "sueno"):
              caso = casos[id_caso]
              lineas.append(
                  f"| {id_caso} | {caso['textura_suelo']} | {caso['textura_muro']} | "
                  f"{caso['materiales_psx']} | {caso['materiales_texturados']} | "
                  f"{caso['materiales_deformados']} | {caso['materiales_detalle']} | "
                  f"[{caso['captura']}]({caso['captura']}) |"
              )
          lineas.extend(
              [
                  "",
                  "Este resumen organiza la evidencia; no sustituye la revisión humana de legibilidad.",
                  "",
              ]
          )
          (raiz / "resumen.md").write_text("\n".join(lineas), encoding="utf-8")
          print("4/4 capturas distintas; comparativa y resumen generados; sampler onírico aislado y activo")
          PY
          test -s evidencia-materiales-399/resumen.md

      - name: Adjuntar evidencia visual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-materiales-399-${{ github.sha }}
          path: evidencia-materiales-399/
          if-no-files-found: error
          retention-days: 14
