name: Evidencia densidad 282

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/evidencia-densidad-282.yml'
      - '.godot-version'
      - 'godot/project.godot'
      - 'godot/arte/**'
      - 'godot/assets/modelos/**'
      - 'godot/guion/casa*.gd'
      - 'godot/guion/calle*.gd'
      - 'godot/guion/oficina*.gd'
      - 'godot/guion/sueno*.gd'
      - 'godot/guion/dia_*app.gd'
      - 'godot/guion/densidad_3d.gd'
      - 'godot/guion/espacio_3d.gd'
      - 'godot/guion/espacios_catalogo.gd'
      - 'godot/guion/modelos.gd'
      - 'godot/escenas/dia.tscn'
      - 'godot/pruebas/capturar_densidad_282.gd'
      - 'scripts/test_evidencia_densidad_282.py'
      - 'docs/evidencias/densidad-282/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evidencia:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Godot declarado por el proyecto
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat .godot-version)"
          archivo="Godot_v${version}_linux.x86_64.zip"
          base="https://github.com/godotengine/godot-builds/releases/download/${version}"
          curl --fail --location --retry 3 "$base/$archivo" -o "$RUNNER_TEMP/$archivo"
          curl --fail --location --retry 3 "$base/SHA512-SUMS.txt" -o "$RUNNER_TEMP/SHA512-SUMS.txt"
          cd "$RUNNER_TEMP"
          grep -F " $archivo" SHA512-SUMS.txt | sha512sum --check --strict
          unzip -q "$archivo"
          mkdir -p godot-bin
          mv "Godot_v${version}_linux.x86_64" godot-bin/godot4
          chmod +x godot-bin/godot4
          echo "$RUNNER_TEMP/godot-bin" >> "$GITHUB_PATH"

      - name: Importar proyecto
        run: godot4 --headless --editor --path godot --quit

      - name: Validar contrato de evidencia
        run: python3 -m unittest -v scripts/test_evidencia_densidad_282.py

      - name: Renderizar densidad multivista sin HUD
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidencia-densidad-282
          xvfb-run -a godot4 --path godot \
            --script res://pruebas/capturar_densidad_282.gd -- \
            "$GITHUB_WORKSPACE/evidencia-densidad-282"
          for fase in oficina calle casa sueno; do
            for vista in frente izquierda derecha; do
              test -s "evidencia-densidad-282/${fase}_${vista}.png"
            done
          done
          test -s evidencia-densidad-282/manifest.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("evidencia-densidad-282/manifest.json").read_text())
          casos = {caso["id"]: caso for caso in manifest["casos"]}
          if set(casos) != {"oficina", "calle", "casa", "sueno"}:
              raise SystemExit("faltan fases del gate #282")
          if manifest.get("vistas_por_fase") != 3:
              raise SystemExit("el gate #282 debe publicar tres vistas por fase")
          for nombre, caso in casos.items():
              vistas = {vista["id"]: vista for vista in caso.get("vistas", [])}
              if set(vistas) != {"frente", "izquierda", "derecha"}:
                  raise SystemExit(f"{nombre}: faltan vistas frontal/laterales")
              hashes = [vista["sha256"] for vista in vistas.values()]
              if len(set(hashes)) != 3:
                  raise SystemExit(f"{nombre}: las tres vistas deben ser distintas")
              if caso["mallas_total"] <= 0:
                  raise SystemExit(f"{nombre}: no se detectaron mallas 3D")
              if caso["bultos_total"] != caso["bultos_modelados"] + caso["bultos_proxy"]:
                  raise SystemExit(f"{nombre}: auditoría declarativa incoherente")
              if not 0.0 <= caso["ratio_bultos_modelados"] <= 1.0:
                  raise SystemExit(f"{nombre}: ratio de modelado fuera de rango")
          print("4/4 fases y 12/12 vistas capturadas; manifiesto de densidad coherente")
          PY

      - name: Adjuntar evidencia visual y métricas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-densidad-282-${{ github.sha }}
          path: evidencia-densidad-282/
          if-no-files-found: error
          retention-days: 14
