name: Agent autopilot

on:
  push:
    branches: [main]
    paths: ['.github/workflows/agent-autopilot.yml']
  issues:
    types: [labeled]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue (vacío = siguiente agent:auto)'
        required: false
        type: string
      provider:
        description: 'Proveedor'
        required: true
        default: auto
        type: choice
        options: [auto, qwen, gemini]

permissions:
  contents: read

concurrency:
  group: agent-autopilot
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Crear labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create agent:auto --color 5319E7 --description "Cola automática" --force
          gh label create agent:qwen --color 1D76DB --description "Ejecutar con Qwen" --force
          gh label create agent:gemini --color A2EEEF --description "Ejecutar con Gemini" --force
          gh label create agent:working --color F9D0C4 --description "Agente trabajando" --force
          gh label create agent:pr-open --color 0E8A16 --description "PR autónomo abierto" --force
          gh label create agent:needs-human --color D93F0B --description "Necesita intervención humana" --force

  agent:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    env:
      HAS_QWEN: ${{ secrets.QWEN_API_KEY != '' }}
      HAS_GEMINI: ${{ secrets.GEMINI_API_KEY != '' }}
    steps:
      - id: select
        name: Elegir trabajo
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          LABEL: ${{ github.event.label.name }}
          EVENT_ISSUE: ${{ github.event.issue.number }}
          INPUT_ISSUE: ${{ inputs.issue }}
          INPUT_PROVIDER: ${{ inputs.provider }}
        run: |
          set -euo pipefail
          issue=""
          provider="${INPUT_PROVIDER:-auto}"
          if [[ "$EVENT" == issues ]]; then
            case "$LABEL" in
              agent:auto) provider=auto ;;
              agent:qwen) provider=qwen ;;
              agent:gemini) provider=gemini ;;
              *) echo "run=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
            esac
            issue="$EVENT_ISSUE"
          elif [[ "$EVENT" == workflow_dispatch ]]; then
            issue="$INPUT_ISSUE"
          else
            issue="$(gh issue list --state open --label agent:auto --limit 100 --json number,labels \
              --jq '[.[]|select(([.labels[].name]|index("agent:working")|not) and ([.labels[].name]|index("agent:pr-open")|not) and ([.labels[].name]|index("agent:needs-human")|not))][0].number // empty')"
          fi
          [[ -z "$issue" ]] && { echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; }
          [[ "$issue" =~ ^[0-9]+$ ]] || exit 2

          labels="$(gh issue view "$issue" --json labels --jq '[.labels[].name]|join(" ")')"
          if [[ "$provider" == auto ]]; then
            if [[ " $labels " == *" agent:qwen "* ]]; then provider=qwen
            elif [[ " $labels " == *" agent:gemini "* ]]; then provider=gemini
            elif [[ "$HAS_QWEN" == true ]]; then provider=qwen
            elif [[ "$HAS_GEMINI" == true ]]; then provider=gemini
            else
              gh issue edit "$issue" --add-label agent:needs-human >/dev/null
              gh issue comment "$issue" --body 'Faltan `QWEN_API_KEY` y `GEMINI_API_KEY` en Actions Secrets.'
              echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          [[ "$provider" == qwen && "$HAS_QWEN" != true ]] && { gh issue edit "$issue" --add-label agent:needs-human >/dev/null; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; }
          [[ "$provider" == gemini && "$HAS_GEMINI" != true ]] && { gh issue edit "$issue" --add-label agent:needs-human >/dev/null; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; }

          existing="$(gh pr list --state open --limit 100 --json body | jq -r --arg n "Refs #$issue" '[.[]|select((.body//"")|contains($n))]|length')"
          [[ "$existing" != 0 ]] && { echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; }

          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "issue=$issue" >> "$GITHUB_OUTPUT"
          echo "provider=$provider" >> "$GITHUB_OUTPUT"
          echo "branch=agent/${provider}-${issue}-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.select.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - id: qwen
        name: Configurar Qwen
        if: steps.select.outputs.run == 'true' && steps.select.outputs.provider == 'qwen'
        env:
          KEY: ${{ secrets.QWEN_API_KEY }}
        run: |
          if [[ "$KEY" == sk-sp-* ]]; then
            echo "url=https://coding-intl.dashscope.aliyuncs.com/v1" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://dashscope-intl.aliyuncs.com/compatible-mode/v1" >> "$GITHUB_OUTPUT"
          fi
          echo "model=qwen3-coder-plus" >> "$GITHUB_OUTPUT"

      - name: Contexto
        if: steps.select.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.select.outputs.issue }}
        run: |
          gh issue view "$ISSUE" --json title,body,comments \
            --jq '"# Issue\n\n## " + .title + "\n\n" + (.body//"") + "\n\n## Comentarios recientes\n" + ((.comments[-20:]//[])|map("- "+.author.login+": "+.body)|join("\n\n"))' \
            > .agent-task.md

      - id: plan_qwen
        name: Plan Qwen
        if: steps.select.outputs.run == 'true' && steps.select.outputs.provider == 'qwen'
        uses: QwenLM/qwen-code-action@v1
        with:
          openai_api_key: ${{ secrets.QWEN_API_KEY }}
          openai_base_url: ${{ vars.QWEN_BASE_URL || steps.qwen.outputs.url }}
          openai_model: ${{ vars.QWEN_MODEL || steps.qwen.outputs.model }}
          settings: '{"model":{"maxSessionTurns":20},"tools":{"core":["read_file","glob","grep_search","list_directory"]}}'
          prompt: 'Lee AGENTS.md, QWEN.md y .agent-task.md. Inspecciona sin editar. Termina con AGENT_PLAN_BEGIN seguido de JSON {"files":["ruta"],"goal":"objetivo"} y AGENT_PLAN_END. Máximo 12 archivos concretos; usa files=[] si no hay corte seguro.'

      - id: plan_gemini
        name: Plan Gemini
        if: steps.select.outputs.run == 'true' && steps.select.outputs.provider == 'gemini'
        uses: google-github-actions/run-gemini-cli@v0
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: ${{ vars.GEMINI_MODEL }}
          settings: '{"model":{"maxSessionTurns":20},"tools":{"core":["read_file","glob","grep_search","list_directory"]}}'
          prompt: 'Lee AGENTS.md, GEMINI.md y .agent-task.md. Inspecciona sin editar. Termina con AGENT_PLAN_BEGIN seguido de JSON {"files":["ruta"],"goal":"objetivo"} y AGENT_PLAN_END. Máximo 12 archivos concretos; usa files=[] si no hay corte seguro.'

      - id: reserve
        name: Validar plan y reservar
        if: steps.select.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.select.outputs.issue }}
          PROVIDER: ${{ steps.select.outputs.provider }}
          BRANCH: ${{ steps.select.outputs.branch }}
          SUMMARY: ${{ steps.plan_qwen.outputs.summary || steps.plan_gemini.outputs.summary }}
        run: |
          set -euo pipefail
          printf '%s' "$SUMMARY" > /tmp/summary.txt
          python3 - <<'PY'
          import json, os, re
          raw=open("/tmp/summary.txt",encoding="utf-8").read()
          m=re.search(r"AGENT_PLAN_BEGIN\s*(\{.*?\})\s*AGENT_PLAN_END",raw,re.S)
          if not m: raise SystemExit("plan no parseable")
          p=json.loads(m.group(1)); files=p.get("files",[])
          if not isinstance(files,list) or len(files)>12: raise SystemExit("plan inválido")
          clean=[]
          for x in files:
              if not isinstance(x,str): raise SystemExit("ruta inválida")
              x=x.strip().replace("\\","/")
              if not x or x.startswith("/") or ".." in x.split("/") or any(c in x for c in "*?[]"): raise SystemExit("ruta inválida")
              if x.startswith(".github/") or x in {"AGENTS.md","QWEN.md","GEMINI.md","docs/agents-autonomos.md"}: raise SystemExit("ruta protegida")
              clean.append(x)
          p={"files":list(dict.fromkeys(clean)),"goal":str(p.get("goal",""))[:180]}
          open(".agent-plan.json","w",encoding="utf-8").write(json.dumps(p,ensure_ascii=False))
          if not p["files"]:
              open(os.environ["GITHUB_OUTPUT"],"a").write("reserved=false\nreason=sin-corte-seguro\n")
          PY
          grep -q '"files": \[\]' .agent-plan.json 2>/dev/null && exit 0 || true

          files="$(jq -r '.files|join(",")' .agent-plan.json)"
          goal="$(jq -r '.goal|gsub("[[:space:]]+";"-")' .agent-plan.json)"
          claim="CLAIM issue=#$ISSUE agent=Autopilot-$PROVIDER branch=$BRANCH files=$files goal=$goal lease=48h"
          cid="$(gh api -X POST "repos/$GITHUB_REPOSITORY/issues/182/comments" -f body="$claim" --jq .id)"
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/182/comments?per_page=100" \
            --jq '.[]|[.id,(.body|@base64)]|@tsv' > /tmp/reservas.tsv
          CLAIM_ID="$cid" BRANCH="$BRANCH" python3 - <<'PY'
          import base64,os,re
          me=int(os.environ["CLAIM_ID"]); branch=os.environ["BRANCH"]; active={}; mine=None
          cr=re.compile(r"^CLAIM\s+issue=#(\d+).*?\bbranch=([^\s]+).*?\bfiles=([^\s]+)",re.M)
          rr=re.compile(r"^RELEASE\s+issue=#(\d+)(?:.*?\bbranch=([^\s]+))?",re.M)
          def ov(a,b): a=a.rstrip("/"); b=b.rstrip("/"); return a