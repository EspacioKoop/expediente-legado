name: Agent autopilot

on:
  push:
    branches: [main]
    paths: ['.github/workflows/agent-autopilot.yml']
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue a ejecutar manualmente'
        required: true
        type: string
      provider:
        description: 'Proveedor'
        required: true
        default: auto
        type: choice
        options: [auto, qwen, gemini]

permissions:
  contents: read

concurrency:
  group: agent-autopilot
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Crear labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create agent:auto --repo "$GITHUB_REPOSITORY" --color 5319E7 --description "Cola automática" --force
          gh label create agent:qwen --repo "$GITHUB_REPOSITORY" --color 1D76DB --description "Ejecutar con Qwen" --force
          gh label create agent:gemini --repo "$GITHUB_REPOSITORY" --color A2EEEF --description "Ejecutar con Gemini" --force
          gh label create agent:working --repo "$GITHUB_REPOSITORY" --color F9D0C4 --description "Agente trabajando" --force
          gh label create agent:pr-open --repo "$GITHUB_REPOSITORY" --color 0E8A16 --description "PR autónomo abierto" --force
          gh label create agent:needs-human --repo "$GITHUB_REPOSITORY" --color D93F0B --description "Necesita intervención humana" --force

  agent:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
      id-token: write
    env:
      HAS_TS_OAUTH: ${{ secrets.TS_OAUTH_CLIENT_ID != '' && secrets.TS_OAUTH_SECRET != '' }}
      HAS_TS_OIDC: ${{ secrets.TS_OAUTH_CLIENT_ID != '' && secrets.TS_AUDIENCE != '' }}
      HAS_OMNIROUTE: ${{ secrets.OMNIROUTE_API_KEY != '' && secrets.TS_OAUTH_CLIENT_ID != '' && (secrets.TS_OAUTH_SECRET != '' || secrets.TS_AUDIENCE != '') && vars.OMNIROUTE_BASE_URL != '' && vars.OMNIROUTE_MODEL != '' }}
      HAS_QWEN: ${{ secrets.QWEN_API_KEY != '' }}
      HAS_QWEN_FALLBACK_1: ${{ secrets.QWEN_FALLBACK_1_API_KEY != '' }}
      HAS_QWEN_FALLBACK_2: ${{ secrets.QWEN_FALLBACK_2_API_KEY != '' }}
      HAS_QWEN_FALLBACK_3: ${{ secrets.QWEN_FALLBACK_3_API_KEY != '' }}
      HAS_QWEN_FALLBACK_4: ${{ secrets.QWEN_FALLBACK_4_API_KEY != '' }}
      HAS_QWEN_ANY: ${{ (secrets.OMNIROUTE_API_KEY != '' && secrets.TS_OAUTH_CLIENT_ID != '' && (secrets.TS_OAUTH_SECRET != '' || secrets.TS_AUDIENCE != '') && vars.OMNIROUTE_BASE_URL != '' && vars.OMNIROUTE_MODEL != '') || secrets.QWEN_API_KEY != '' || secrets.QWEN_FALLBACK_1_API_KEY != '' || secrets.QWEN_FALLBACK_2_API_KEY != '' || secrets.QWEN_FALLBACK_3_API_KEY != '' || secrets.QWEN_FALLBACK_4_API_KEY != '' }}
      HAS_GEMINI: ${{ secrets.GEMINI_API_KEY != '' }}
      GEMINI_CLI_TRUST_WORKSPACE: 'true'
    steps:
      - id: select
        name: Elegir trabajo
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_ISSUE: ${{ inputs.issue }}
          INPUT_PROVIDER: ${{ inputs.provider }}
        run: |
          set -euo pipefail
          issue="$INPUT_ISSUE"
          provider="${INPUT_PROVIDER:-auto}"
          [[ "$issue" =~ ^[0-9]+$ ]] || exit 2

          labels="$(gh issue view "$issue" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name]|join(" ")')"
          if [[ "$provider" == auto ]]; then
            if [[ " $labels " == *" agent:qwen "* ]]; then provider=qwen
            elif [[ " $labels " == *" agent:gemini "* ]]; then provider=gemini
            fi
          fi

          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json body | jq -r --arg n "Refs #$issue" '[.[]|select(((.body//"")|split("\n")|index($n)) != null)]|length')"
          [[ "$existing" != 0 ]] && { echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; }

          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "issue=$issue" >> "$GITHUB_OUTPUT"
          echo "requested_provider=$provider" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.select.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - id: route
        name: Elegir proveedor con Kev
        if: steps.select.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.select.outputs.issue }}
          REQUESTED_PROVIDER: ${{ steps.select.outputs.requested_provider }}
          KEV_BASE_URL: ${{ vars.KEV_BASE_URL }}
          KEV_MODEL: ${{ vars.KEV_MODEL || 'kev-latest' }}
          KEV_ROUTER_MIN_CONFIDENCE: ${{ vars.KEV_ROUTER_MIN_CONFIDENCE || '0.45' }}
          KEV_API_KEY: ${{ secrets.KEV_API_KEY }}
        run: |
          set -euo pipefail
          gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json title,body,labels \
            --jq '{title:.title,body:(.body//""),labels:[.labels[].name]}' \
            > /tmp/kev-state.json

          args=(--state-file /tmp/kev-state.json --requested-provider "$REQUESTED_PROVIDER")
          [[ "$HAS_QWEN_ANY" == true ]] && args+=(--has-qwen)
          [[ "$HAS_GEMINI" == true ]] && args+=(--has-gemini)

          result="$(python3 scripts/kev_router.py "${args[@]}")"
          provider="$(jq -r '.provider // empty' <<<"$result")"
          source="$(jq -r '.source // "unknown"' <<<"$result")"
          if [[ -z "$provider" ]]; then
            requested="$(jq -r '.requested_provider // empty' <<<"$result")"
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label agent:needs-human >/dev/null
            if [[ -n "$requested" ]]; then
              message="El proveedor solicitado ($requested) no esta disponible con la configuracion actual."
            else
              message="No hay ningun backend de agente configurado: OmniRoute privado, Qwen directo/fallbacks o Gemini."
            fi
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "$message"
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "source=$source" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "provider=$provider" >> "$GITHUB_OUTPUT"
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "branch=agent/${provider}-${ISSUE}-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "Kev router: provider=$provider source=$source"

      - name: Conectar a OmniRoute por Tailscale (OAuth)
        if: steps.route.outputs.run == 'true' && steps.route.outputs.provider == 'qwen' && env.HAS_OMNIROUTE == 'true' && env.HAS_TS_OAUTH == 'true'
        continue-on-error: true
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-autopilot

      - name: Conectar a OmniRoute por Tailscale (OIDC fallback)
        if: steps.route.outputs.run == 'true' && steps.route.outputs.provider == 'qwen' && env.HAS_OMNIROUTE == 'true' && env.HAS_TS_OAUTH != 'true' && env.HAS_TS_OIDC == 'true'
        continue-on-error: true
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:github-autopilot

      - id: omniroute
        name: Comprobar OmniRoute privado
        if: steps.route.outputs.run == 'true' && steps.route.outputs.provider == 'qwen' && env.HAS_OMNIROUTE == 'true'
        continue-on-error: true
        env:
          OMNIROUTE_BASE_URL: ${{ vars.OMNIROUTE_BASE_URL }}
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
        run: |
          set -euo pipefail
          base="${OMNIROUTE_BASE_URL%/}"
          code="$(curl -sS --max-time 12 -o /tmp/omniroute-models.json -w '%{http_code}' \
            -H "Authorization: Bearer $OMNIROUTE_API_KEY" "$base/models" || true)"
          [[ "$code" == 200 ]]
          jq -e '.data | type == "array"' /tmp/omniroute-models.json >/dev/null
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - id: qwen
        name: Configurar Qwen
        if: steps.route.outputs.run == 'true' && steps.route.outputs.provider == 'qwen'
        env:
          KEY: ${{ secrets.QWEN_API_KEY }}
        run: |
          if [[ "$KEY" == sk-sp-* ]]; then
            echo "url=https://coding-intl.dashscope.aliyuncs.com/v1" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://dashscope-intl.aliyuncs.com/compatible-mode/v1" >> "$GITHUB_OUTPUT"
          fi
          echo "model=qwen3-coder-plus" >> "$GITHUB_OUTPUT"

      - name: Contexto
        if: steps.route.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.select.outputs.issue }}
        run: |
          gh issue view "$ISSUE" --json title,body,comments \
            --jq '"# Issue\n\n## " + .title + "\n\n" + (.body//"") + "\n\n## Comentarios recientes\n" + ((.comments[-20:]//[])|map("- "+.author.login+": "+.body)|join("\n\n"))' \
            > .agent-task.md

      - name: Cargar memoria histórica de CI
        if: steps.route.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s\n' '{"ok":true,"source":"ci-brain-sqlite","memories":[]}' > .agent-history.json
          if python3 scripts/ci_brain.py restore --sqlite /tmp/ci-brain.sqlite3 >/tmp/ci-brain-restore.json; then
            python3 scripts/ci_brain.py context \
              --sqlite /tmp/ci-brain.sqlite3 \
              --query-file .agent-task.md \
              --output .agent-history.json \
              >/dev/null
          fi

      - name: Cargar Normas Platino, wiki y memoria
        if: steps.route.outputs.run == 'true'
        env:
          ISSUE: ${{ steps.select.outputs.issue }}
          PROVIDER: ${{ steps.route.outputs.provider }}
          MEMORY_URL: ${{ vars.SIGA98_FEEDBACK_FALLBACK_URL }}
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/EspacioKoop/normas_platino.git .agent-platino
          git -C .agent-platino rev-parse HEAD > .agent-platino-sha
          rm -rf .agent-platino/.git

          if git clone --depth 1 https://github.com/EspacioKoop/expediente-legado.wiki.git .agent-wiki; then
            rm -rf .agent-wiki/.git
          else
            mkdir -p .agent-wiki
            printf '%s\n' '# Wiki no disponible en esta ejecución' > .agent-wiki/README.md
          fi

          python3 scripts/agent_context_pack.py \
            --wiki-dir .agent-wiki \
            --issue-file .agent-task.md \
            --max-pages 8 \
            --max-bytes 24000 \
            --output .agent-context.md

          printf '%s\n' '{"ok":true,"memories":[]}' > .agent-memory.json
          if [[ -n "${MEMORY_URL:-}" ]]; then
            base="${MEMORY_URL%/}"
            base="${base%/api/report}"
            if oidc_json="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=siga98-agent-memory")" &&
              oidc_token="$(jq -er '.value' <<<"$oidc_json")"; then
              payload="$(jq -nc --argjson issue "$ISSUE" --arg provider "$PROVIDER" \
                '{schema:1,issue:$issue,provider:$provider}')"
              if curl -fsS -X POST "$base/api/agent-memory/search" \
                -H "Authorization: Bearer $oidc_token" \
                -H 'Content-Type: application/json' \
                --data "$payload" -o /tmp/agent-memory.json; then
                mv /tmp/agent-memory.json .agent-memory.json
              fi
            fi
          fi

      - id: plan_omniroute
        name: Plan mediante OmniRoute
        if: steps.route.outputs.run == 'true' && steps.route.outputs.provider == 'qwen' && steps.omniroute.outputs.ready == 'true'
        continue-on-error: true
        uses: QwenLM/qwen-code-action@v1
        with:
          openai_api_key: ${{ secrets.OMNIROUTE_API_KEY }}
          openai_base_url: ${{ vars.OMNIROUTE_BASE_URL }}
          openai_model: ${{ vars.OMNIROUTE_MODEL }}
          qwen_cli_version: ${{ vars.QWEN_CLI_VERSION || 'latest' }}
          settings: '{"model":{"maxSessionTurns":20},"experimental":{"emitToolUseSummaries":false},"tools":{"core":["read_file","glob","grep_search","list_directory"]}}'
          prompt: 'Lee AGENTS.md, QWEN.md, .agent-task.md, .agent-context.md, .agent-memory.json, .agent-history.json y obligatoriamente las Normas Platino actuales en .agent-platino/README.md, .agent-platino/docs/FUENTE_DE_VERDAD.md, .agent-platino/docs/COOPERACION_AUTONOMA.md, .agent-platino/docs/PLANIFICACION_Y_ENTREGAS.md y .agent-platino/docs/PRO_CONSUMIDOR.md. Usa .agent-context.md como contexto wiki seleccionado; consulta .agent-wiki solo si falta contexto imprescindible. Jerarquía: repo/issue/#181/#182 y Normas Platino > wiki > memoria temporal Deno KV > memoria histórica CI. Inspecciona sin editar. Antes de cerrar el plan, revisa los puntos reales de integración y sus tests: files debe incluir TODAS las rutas que una implementación correcta podría necesitar. Si los comentarios recientes contienen AUTOPILOT_REPLAN, revisa explícitamente sus observed_paths y añádelas solo si son necesarias. Termina con AGENT_PLAN_BEGIN seguido de JSON {"files":["ruta"],"goal":"objetivo"} y AGENT_PLAN_END. Máximo 12 archivos concretos; usa files=[] si no hay corte seguro.'

      - id: plan_qwen
        name: Plan Qwen (primario)
        if: steps.route.outputs.run == 'true' && steps.route.outputs.provider == 'qwen' && env.HAS_QWEN == 'true' && steps.plan_omniroute.outcome != 'success'
        continue-on-error: true
        uses: QwenLM/qwen-code-action@v1
        with:
          openai_api_key: ${{ secrets.QWEN_API_KEY }}
          openai_base_url: ${{ vars.QWEN_BASE_URL || steps.qwen.outputs.url }}
          openai_model: ${{ vars.QWEN_MODEL || steps.qwen.outputs.model }}
          qwen_cli_version: ${{ vars.QWEN_CLI_VERSION || 'latest' }}
          settings: '{"model":{"maxSessionTurns":20},"experimental":{"emitToolUseSummaries":false},"tools":{"core":["read_file","glob","grep_search","list_directory"]}}'
          prompt: 'Lee AGENTS.md, QWEN.md, .agent-task.md, .agent-context.md, .agent-memory.json, .agent-history.json y obligatoriamente las Normas Platino actuales en .agent-platino/README.md, .agent-platino/docs/FUENTE_DE_VERDAD.md, .agent-platino/docs/COOPERACION_AUTONOMA.md, .agent-platino/docs/PLANIFICACION_Y_ENTREGAS.md y .agent-platino/docs/PRO_CONSUMIDOR.md. Usa .agent-context.md como contexto wiki seleccionado; consulta .agent-wiki solo si falta contexto imprescindible. Jerarquía: repo/issue/#181/#182 y Normas Platino > wiki > memoria temporal Deno KV > memoria histórica CI. Inspecciona sin editar. Antes de cerrar el plan, revisa los puntos reales de integración y sus tests: files debe incluir TODAS las rutas que una implementación correcta podría necesitar. Si los comentarios recientes contienen AUTOPILOT_REPLAN, revisa explícitamente sus observed_paths y añádelas solo si son necesarias. Termina con AGENT_PLAN_BEGIN seguido de JSON {"files":["ruta"],"goal":"objetivo"} y AGENT_PLAN_END. Máximo 12 archivos concretos; usa files=[] si no hay corte seguro.'

      - id: plan_qwen_fallback_1
        name: Plan Qwen (fallback 1)
        if: steps.route.outputs.run == 'true' && steps.route.outputs.provider == 'qwen' && env.HAS_QWEN_FALLBACK_1 == 'true' && steps.plan_omniroute.outcome != 'success' && steps.plan_qwen.outcome != 'success'
        continue-on-error: true
        uses: QwenLM/qwen-code-action@v1
        with:
          openai_api_key: ${{ secrets.QWEN_FALLBACK_1_API_KEY }}
          openai_base_url: ${{ vars.QWEN_FALLBACK_1_BASE_URL }}
          openai_model: ${{ vars.QWEN_FALLBACK_1_MODEL || vars.QWEN_MODEL || steps.qwen.outputs.model }}
          qwen_cli_version: ${{ vars.QWEN_CLI_VERSION || 'latest' }}
          settings: '{"model":{"maxSessionTurns":20},"experimental":{"emitToolUseSummaries":false},"tools":{"core":["read_file","glob","grep_search","list_directory"]}}'
          prompt: 'Lee AGENTS.md, QWEN.md, .agent-task.md, .agent-context.md, .agent-memory.json, .agent-history.json y obligatoriamente las Normas Platino actuales en .agent-platino/README.md, .agent-platino/docs/FUENTE_DE_VERDAD.md, .agent-platino/docs/COOPERACION_AUTONOMA.md, .agent-platino/docs/PLANIFICACION_Y_ENTREGAS.md y .agent-platino/docs/PRO_CONSUMIDOR.md. Usa .agent-context.md como contexto wiki seleccionado; consulta .agent-wiki solo si falta contexto imprescindible. Jerarquía: repo/issue/#181/#182 y Normas Platino > wiki > memoria temporal Deno KV > memoria histórica CI. Inspecciona sin editar. Antes de cerrar el plan, revisa los puntos reales de integración y sus tests: files debe incluir TODAS las rutas que una implementación correcta podría necesitar. Si los comentarios recientes contienen AUTOPILOT_REPLAN, revisa explícitamente sus observed_paths y añádelas solo si son necesarias. Termina con AGENT_PLAN_BEGIN seguido de JSON {"files":["ruta"],"goal":"objetivo"} y AGENT_PLAN_END. Máximo 12 archivos concretos; usa files=[] si no hay corte seguro.'

      - id: plan_qwen_fallback_2
        name: Plan Qwen (fallback 2)
        if: steps.route.outputs.run == 'true' && steps.route.outputs.provider == 'qwen' && env.HAS_QWEN_FALLBACK_2 == 'true' && steps.plan_omniroute.outcome != 'success' && steps.plan_qwen.outcome != 'success' && steps.plan_qwen_fallback_1.outcome != 'success'
        continue-on-error: true
        uses: QwenLM/qwen-code-action@v1
        with:
          openai_api_key: ${{ secrets.QWEN_FALLBACK_2_API_KEY }}
          openai_base_url: ${{ vars.QWEN_FALLBACK_2_BASE_URL }}
          openai_model: ${{ vars.QWEN_FALLBACK_2_MODEL || vars.QWEN_MODEL || steps.qwen.outputs.model }}
          qwen_cli_version: ${{ vars.QWEN_CLI_VERSION || 'latest' }}
          settings: '{"model":{"maxSessionTurns":20},"experimental":{"emitToolUseSummaries":false},"tools":{"core":["read_file","glob","grep_search","list_directory"]}}'
          prompt: 'Lee AGENTS.md, QWEN.md, .agent-task.md, .agent-context.md, .agent-memory.json, .agent-history.json y obligatoriamente las Normas Platino actuales en .agent-platino/README.md, .agent-platino/docs/FUENTE_DE_VERDAD.md, .agent-platino/docs/COOPERACION_AUTONOMA.md, .agent-platino/docs/PLANIFICACION_Y_ENTREGAS.md y .agent-platino/docs/PRO_CONSUMIDOR.md. Usa .agent-context.md como contexto wiki seleccionado; consulta .agent-wiki solo si falta contexto imprescindible. Jerarquía: repo/issue/#181/#182 y Normas Platino > wiki > memoria temporal Deno KV > memoria histórica CI. Inspecciona sin editar. Antes de cerrar el plan, revisa los puntos reales de integración y sus tests: files debe incluir TODAS las rutas que una implementación correcta podría necesitar. Si los comentarios recientes contienen AUTOPILOT_REPLAN, revisa explícitamente sus observed_paths y añádelas solo si son necesarias. Termina con AGENT_PLAN_BEGIN seguido de JSON {"files":["ruta"],"goal":"objetivo"} y AGENT_PLAN_END. Máximo 12 archivos concretos; usa files=[] si no hay corte seguro.'

      - id: plan_qwen_fallback_3
        name: Plan Qwen (fallback 3)
        if: steps.route.outputs.run == 'true' && steps.route.outputs.provider == 'qwen' && env.HAS_QWEN_FALLBACK_3 == 'true' && steps.plan_omniroute.outcome != 'success' && steps.plan_qwen.outcome != 'success' && steps.plan_qwen_fallback_1.outcome != 'success' && steps.plan_qwen_fallback_2.outcome != 'success'
        continue-on-error: true
        uses: QwenLM/qwen-code-action@v1
        with:
          openai_api_key: ${{ secrets.QWEN_FALLBACK_3_API_KEY }}
          openai_base_url: ${{ vars.QWEN_FALLBACK_3_BASE_URL }}
          openai_model: ${{ vars.QWEN_FALLBACK_3_MODEL || vars.QWEN_MODEL || steps.qwen.outputs.model }}
          qwen_cli_version: ${{ vars.QWEN_CLI_VERSION || 'latest' }}
          settings: '{"model":{"maxSessionTurns":20},"experimental":{"emitToolUseSummaries":false},"tools":{"core":["read_file","glob","grep_search","list_directory"]}}'
          prompt: 'Lee AGENTS.md, QWEN.md, .agent-task.md, .agent-context.md, .agent-memory.json, .agent-history.json y obligatoriamente las Normas Platino actuales en .agent-platino/README.md, .agent-platino/docs/FUENTE_DE_VERDAD.md, .agent-platino/docs/COOPERACION_AUTONOMA.md, .agent-platino/docs/PLANIFICACION_Y_ENTREGAS.md y .agent-platino/docs/PRO_CONSUMIDOR.md. Usa .agent-context.md como contexto wiki seleccionado; consulta .agent-wiki solo si falta contexto imprescindible. Jerarquía: repo/issue/#181/#182 y Normas Platino > wiki > memoria temporal Deno KV > memoria histórica CI. Inspecciona sin editar. Antes de cerrar el plan, revisa los puntos reales de integración y sus tests: files debe incluir TODAS las rutas que una implementación correcta podría necesitar. Si los comentarios recientes contienen AUTOPILOT_REPLAN, revisa explícitamente sus observed_paths y añádelas solo si son necesarias. Termina con AGENT_PLAN_BEGIN seguido de JSON {"files":["ruta"],"goal":"objetivo"} y AGENT_PLAN_END. Máximo 12 archivos concretos; usa files=[] si no hay corte seguro.'

      - id: plan_qwen_fallback_4
        name: Plan Qwen (fallback 4)
        if: steps.route.outputs.run == 'true' && steps.route.outputs.provider == 'qwen' && env.HAS_QWEN_FALLBACK_4 == 'true' && steps.plan_omniroute.outcome != 'success' && steps.plan_qwen.outcome != 'success' && steps.plan_qwen_fallback_1.outcome != 'success' && steps.plan_qwen_fallback_2.outcome != 'success' && steps.plan_qwen_fallback_3.outcome != 'success'
        continue-on-error: true
        uses: QwenLM/qwen-code-action@v1
        with:
          openai_api_key: ${{ secrets.QWEN_FALLBACK_4_API_KEY }}
          openai_base_url: ${{ vars.QWEN_FALLBACK_4_BASE_URL }}
          openai_model: ${{ vars.QWEN_FALLBACK_4_MODEL || vars.QWEN_MODEL || steps.qwen.outputs.model }}
          qwen_cli_version: ${{ vars.QWEN_CLI_VERSION || 'latest' }}
          settings: '{"model":{"maxSessionTurns":20},"experimental":{"emitToolUseSummaries":false},"tools":{"core":["read_file","glob","grep_search","list_directory"]}}'
          prompt: 'Lee AGENTS.md, QWEN.md, .agent-task.md, .agent-context.md, .agent-memory.json, .agent-history.json y obligatoriamente las Normas Platino actuales en .agent-platino/README.md, .agent-platino/docs/FUENTE_DE_VERDAD.md, .agent-platino/docs/COOPERACION_AUTONOMA.md, .agent-platino/docs/PLANIFICACION_Y_ENTREGAS.md y .agent-platino/docs/PRO_CONSUMIDOR.md. Usa .agent-context.md como contexto wiki seleccionado; consulta .agent-wiki solo si falta contexto imprescindible. Jerarquía: repo/issue/#181/#182 y Normas Platino > wiki > memoria temporal Deno KV > memoria histórica CI. Inspecciona sin editar. Antes de cerrar el plan, revisa los puntos reales de integración y sus tests: files debe incluir TODAS las rutas que una implementación correcta podría necesitar. Si los comentarios recientes contienen AUTOPILOT_REPLAN, revisa explícitamente sus observed_paths y añádelas solo si son necesarias. Termina con AGENT_PLAN_BEGIN seguido de JSON {"files":["ruta"],"goal":"objetivo"} y AGENT_PLAN_END. Máximo 12 archivos concretos; usa files=[] si no hay corte seguro.'

      - id: plan_gemini
        name: Plan Gemini
        if: steps.route.outputs.run == 'true' && steps.route.outputs.provider == 'gemini'
        uses: google-github-actions/run-gemini-cli@v0
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: ${{ vars.GEMINI_MODEL }}
          gemini_cli_version: ${{ vars.GEMINI_CLI_VERSION || 'latest' }}
          settings: '{"model":{"maxSessionTurns":20},"tools":{"core":["read_file","glob","grep_search","list_directory"]}}'
          prompt: 'Lee AGENTS.md, GEMINI.md, .agent-task.md, .agent-context.md, .agent-memory.json, .agent-history.json y obligatoriamente las Normas Platino actuales en .agent-platino/README.md, .agent-platino/docs/FUENTE_DE_VERDAD.md, .agent-platino/docs/COOPERACION_AUTONOMA.md, .agent-platino/docs/PLANIFICACION_Y_ENTREGAS.md y .agent-platino/docs/PRO_CONSUMIDOR.md. Usa .agent-context.md como contexto wiki seleccionado; consulta .agent-wiki solo si falta contexto imprescindible. Jerarquía: repo/issue/#181/#182 y Normas Platino > wiki > memoria temporal Deno KV > memoria histórica CI. Inspecciona sin editar. Antes de cerrar el plan, revisa los puntos reales de integración y sus tests: files debe incluir TODAS las rutas que una implementación correcta podría necesitar. Si los comentarios recientes contienen AUTOPILOT_REPLAN, revisa explícitamente sus observed_paths y añádelas solo si son necesarias. Termina con AGENT_PLAN_BEGIN seguido de JSON {"files":["ruta"],"goal":"objetivo"} y AGENT_PLAN_END. Máximo 12 archivos concretos; usa files=[] si no hay corte seguro.'

      - id: reserve
        name: Validar plan y reservar
        if: steps.route.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.select.outputs.issue }}
          PROVIDER: ${{ steps.route.outputs.provider }}
          BRANCH: ${{ steps.route.outputs.branch }}
          SUMMARY: ${{ steps.plan_omniroute.outputs.summary || steps.plan_qwen.outputs.summary || steps.plan_qwen_fallback_1.outputs.summary || steps.plan_qwen_fallback_2.outputs.summary || steps.plan_qwen_fallback_3.outputs.summary || steps.plan_qwen_fallback_4.outputs.summary || steps.plan_gemini.outputs.summary }}
        run: |
          set -euo pipefail
          printf '%s' "$SUMMARY" > /tmp/summary.txt
          python3 - <<'PY'
          import json, os, re
          raw=open("/tmp/summary.txt",encoding="utf-8").read()
          m=re.search(r"AGENT_PLAN_BEGIN(.*?)AGENT_PLAN_END",raw,re.S)
          if not m: raise SystemExit("plan no parseable")
          payload=m.group(1).strip()
          fenced=re.fullmatch(r"```(?:json)?\s*(.*?)\s*```",payload,re.S|re.I)
          if fenced:
              payload=fenced.group(1).strip()
          try:
              p=json.loads(payload)
          except json.JSONDecodeError as exc:
              raise SystemExit("plan no parseable") from exc
          files=p.get("files",[])
          if not isinstance(files,list) or len(files)>12: raise SystemExit("plan inválido")
          clean=[]
          for x in files:
              if not isinstance(x,str): raise SystemExit("ruta inválida")
              x=x.strip().replace("\\","/")
              if not x or x.startswith("/") or ".." in x.split("/") or any(c in x for c in "*?[]"): raise SystemExit("ruta inválida")
              if x.startswith(".github/") or x.startswith(".agent-") or x in {"AGENTS.md","QWEN.md","GEMINI.md","docs/agents-autonomos.md"}: raise SystemExit("ruta protegida")
              clean.append(x)
          p={"files":list(dict.fromkeys(clean)),"goal":str(p.get("goal",""))[:180]}
          open(".agent-plan.json","w",encoding="utf-8").write(json.dumps(p,ensure_ascii=False))
          if not p["files"]:
              open(os.environ["GITHUB_OUTPUT"],"a").write("reserved=false\nreason=sin-corte-seguro\n")
          PY
          if grep -q '"files": \[\]' .agent-plan.json 2>/dev/null; then
            gh issue edit "$ISSUE" --add-label agent:needs-human >/dev/null 2>&1 || true
            gh issue comment "$ISSUE" --body "Agent autopilot: no encontró un corte seguro y concreto; requiere revisión humana." || true
            exit 0
          fi

          files="$(jq -r '.files|join(",")' .agent-plan.json)"
          goal="$(jq -r '.goal|gsub("[[:space:]]+";"-")' .agent-plan.json)"
          claim="CLAIM issue=#$ISSUE agent=Autopilot-$PROVIDER branch=$BRANCH files=$files goal=$goal lease=2h"
          cid="$(gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$(python3 scripts/gestionar_reservas_rollover.py --active)/comments" -f body="$claim" --jq .id)"
          python3 scripts/gestionar_reservas_rollover.py --comments-output /tmp/reservas.json
          # Capa única de lectura de #182 (#1662), la misma que usa el worker.
          python3 scripts/reservas_registro.py conflictos \
            --comments /tmp/reservas.json --claim-id "$cid" --issue "$ISSUE" --branch "$BRANCH" \
            > /tmp/reserva.json
          if [[ "$(jq -r '.mine_found' /tmp/reserva.json)" != true ]]; then
            echo "CLAIM perdido" >&2
            exit 1
          fi
          if [[ "$(jq '.conflicts | length' /tmp/reserva.json)" -gt 0 ]]; then
            echo "reserved=false" >> "$GITHUB_OUTPUT"
            echo "reason=solape:$(jq -r '[.conflicts[].branch] | join(",")' /tmp/reserva.json)" >> "$GITHUB_OUTPUT"
          else
            echo "reserved=true" >> "$GITHUB_OUTPUT"
          fi

          if grep -q '^reserved=false$' "$GITHUB_OUTPUT"; then
            gh issue comment "$(python3 scripts/gestionar_reservas_rollover.py --active)" --body "RELEASE issue=#$ISSUE branch=$BRANCH motivo=colision-autopilot" >/dev/null || true
            gh issue edit "$ISSUE" --add-label agent:needs-human >/dev/null || true
            gh issue comment "$ISSUE" --body "Agent autopilot detenido: $(grep '^reason=' "$GITHUB_OUTPUT"|cut -d= -f2-)" || true
          fi

      - name: Afinar contexto y memoria por rutas reservadas
        if: steps.reserve.outputs.reserved == 'true'
        env:
          ISSUE: ${{ steps.select.outputs.issue }}
          PROVIDER: ${{ steps.route.outputs.provider }}
          MEMORY_URL: ${{ vars.SIGA98_FEEDBACK_FALLBACK_URL }}
        run: |
          set -euo pipefail
          mapfile -t files < <(jq -r '.files[]' .agent-plan.json)
          args=()
          for file in "${files[@]}"; do args+=(--path "$file"); done
          python3 scripts/agent_context_pack.py \
            --wiki-dir .agent-wiki \
            --issue-file .agent-task.md \
            "${args[@]}" \
            --max-pages 8 \
            --max-bytes 24000 \
            --output .agent-context.md

          [[ -z "${MEMORY_URL:-}" ]] && exit 0
          base="${MEMORY_URL%/}"
          base="${base%/api/report}"
          paths="$(jq -c '.files' .agent-plan.json)"
          if oidc_json="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=siga98-agent-memory")" &&
            oidc_token="$(jq -er '.value' <<<"$oidc_json")"; then
            payload="$(jq -nc --argjson issue "$ISSUE" --arg provider "$PROVIDER" --argjson paths "$paths" \
              '{schema:1,issue:$issue,provider:$provider,paths:$paths}')"
            if curl -fsS -X POST "$base/api/agent-memory/search" \
              -H "Authorization: Bearer $oidc_token" \
              -H 'Content-Type: application/json' \
              --data "$payload" -o /tmp/agent-memory.json; then
              mv /tmp/agent-memory.json .agent-memory.json
            fi
          fi

