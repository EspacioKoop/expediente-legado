            --plan .agent-plan.json \
            --report /tmp/claim-guard.json \
            --restore
          outside="$(jq -c '.outside' /tmp/claim-guard.json)"
          count="$(jq '.outside | length' /tmp/claim-guard.json)"
          if [[ "$count" -gt 0 ]]; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
            echo "outside=$outside" >> "$GITHUB_OUTPUT"
          else
            echo "drift=false" >> "$GITHUB_OUTPUT"
            echo "outside=[]" >> "$GITHUB_OUTPUT"
          fi

      - id: replan
        name: Replanificar tras desvío de CLAIM
        if: steps.reserve.outputs.reserved == 'true' && steps.claim_guard.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.select.outputs.issue }}
          PROVIDER: ${{ steps.route.outputs.provider }}
          BRANCH: ${{ steps.route.outputs.branch }}
          MAX_REPLANS: '2'
        run: |
          set -euo pipefail
          outside="$(jq -r '.outside | join(",")' /tmp/claim-guard.json)"
          previous="$(
            gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json comments |
              jq '[.comments[].body | select(startswith("AUTOPILOT_REPLAN "))] | length'
          )"
          attempt=$((previous + 1))

          gh issue comment "$(python3 scripts/gestionar_reservas_rollover.py --active)" --repo "$GITHUB_REPOSITORY" \
            --body "RELEASE issue=#$ISSUE branch=$BRANCH motivo=autopilot-replan-claim-incompleto" \
            >/dev/null || true
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" \
            --remove-label agent:working --remove-label agent:needs-human \
            >/dev/null 2>&1 || true

          if (( attempt <= MAX_REPLANS )); then
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body \
              "AUTOPILOT_REPLAN attempt=$attempt provider=$PROVIDER observed_paths=$outside

              La implementación intentó modificar rutas fuera del CLAIM. El runner ya restauró esos cambios y no se publicará nada de este intento. El próximo plan debe reinspeccionar la integración, incluir las rutas observadas solo si son realmente necesarias y volver a pasar la comprobación de solapes de #182."
            gh workflow run agent-autopilot.yml --repo "$GITHUB_REPOSITORY" --ref main \
              -f issue="$ISSUE" -f provider="$PROVIDER"
            echo "scheduled=true" >> "$GITHUB_OUTPUT"
          else
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" \
              --add-label agent:needs-human >/dev/null
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body \
              "AUTOPILOT_REPLAN attempt=$attempt provider=$PROVIDER observed_paths=$outside

              Se agotó el límite de $MAX_REPLANS replans automáticos para esta revisión de main. Los cambios fuera del CLAIM fueron restaurados y no se publicó ningún PR."
            echo "scheduled=false" >> "$GITHUB_OUTPUT"
          fi

          # El job actual no publicará nada: deja el checkout exactamente en HEAD.
          git reset --hard HEAD
          git clean -fd

      - name: Validar diff y preflight
        if: steps.reserve.outputs.reserved == 'true' && steps.claim_guard.outputs.drift != 'true'
        run: |
          set -euo pipefail
          cp .agent-plan.json /tmp/plan.json
          rm -f .agent-task.md .agent-plan.json .agent-context.md .agent-memory.json .agent-history.json .agent-platino-sha gha-creds-*.json
          rm -rf .agent-platino .agent-wiki .gemini .qwen gemini-artifacts qwen-artifacts
          git add -A
          git diff --cached --quiet && { echo "sin cambios"; exit 2; }
          python3 - <<'PY'
          import json,subprocess
          allowed=set(json.load(open("/tmp/plan.json"))["files"])
          changed=subprocess.check_output(["git","diff","--cached","--name-only"],text=True).splitlines()
          bad=[x for x in changed if x not in allowed]
          if bad: raise SystemExit("fuera de CLAIM: "+",".join(bad))
          PY
          mapfile -t files < <(git diff --cached --name-only)
          gd=false; py=false; backend=false
          for f in "${files[@]}"; do
            [[ "$f" == *.gd ]] && gd=true
            [[ "$f" == scripts/*.py ]] && py=true
            [[ "$f" == backend/* ]] && backend=true
          done
          if [[ "$gd" == true ]]; then bash scripts/check_gdscript.sh
          elif [[ "$py" == true ]]; then python3 -m unittest discover -s scripts -p 'test_*.py'; fi
          if [[ "$backend" == true ]]; then (cd backend && mvn test && npm ci && npm test); fi

      - name: Guardar memoria de trabajo
        if: steps.reserve.outputs.reserved == 'true' && steps.claim_guard.outputs.drift != 'true'
        continue-on-error: true
        env:
          ISSUE: ${{ steps.select.outputs.issue }}
          PROVIDER: ${{ steps.route.outputs.provider }}
          MEMORY_URL: ${{ vars.SIGA98_FEEDBACK_FALLBACK_URL }}
          SUMMARY: ${{ steps.implement_omniroute.outputs.summary || steps.implement_qwen.outputs.summary || steps.implement_qwen_fallback_1.outputs.summary || steps.implement_qwen_fallback_2.outputs.summary || steps.implement_qwen_fallback_3.outputs.summary || steps.implement_qwen_fallback_4.outputs.summary || steps.implement_gemini.outputs.summary }}
        run: |
          set -euo pipefail
          [[ -z "${MEMORY_URL:-}" ]] && exit 0
          printf '%s' "$SUMMARY" > /tmp/agent-summary.txt
          python3 - <<'PY'
          import json,re
          raw=open("/tmp/agent-summary.txt",encoding="utf-8").read()
          match=re.search(r"AGENT_MEMORY_BEGIN\s*(\{.*?\})\s*AGENT_MEMORY_END",raw,re.S)
          if not match:
              raise SystemExit(0)
          data=json.loads(match.group(1))
          summary=str(data.get("summary","")).strip()
          tags=data.get("tags",[])
          if len(summary)<20 or not isinstance(tags,list):
              raise SystemExit(0)
          open("/tmp/agent-memory-note.json","w",encoding="utf-8").write(
              json.dumps({"summary":summary,"tags":tags},ensure_ascii=False)
          )
          PY
          [[ -s /tmp/agent-memory-note.json ]] || exit 0
          base="${MEMORY_URL%/}"
          base="${base%/api/report}"
          paths="$(jq -c '.files' /tmp/plan.json)"
          payload="$(jq -c --argjson issue "$ISSUE" --arg provider "$PROVIDER" --argjson paths "$paths" \
            '. + {schema:1,issue:$issue,provider:$provider,paths:$paths}' /tmp/agent-memory-note.json)"
          oidc_json="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=siga98-agent-memory")"
          oidc_token="$(jq -er '.value' <<<"$oidc_json")"
          curl -fsS -X POST "$base/api/agent-memory/remember" \
            -H "Authorization: Bearer $oidc_token" \
            -H 'Content-Type: application/json' \
            --data "$payload" >/dev/null

      - id: publish
        name: Publicar PR draft
        if: steps.reserve.outputs.reserved == 'true' && steps.claim_guard.outputs.drift != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.select.outputs.issue }}
          PROVIDER: ${{ steps.route.outputs.provider }}
          BRANCH: ${{ steps.route.outputs.branch }}
        run: |
          set -euo pipefail
          git config user.name "agent-autopilot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "agent: avanzar #$ISSUE con $PROVIDER"
          gh auth setup-git
          git push -u origin "$BRANCH"
          title="$(gh issue view "$ISSUE" --json title --jq .title)"
          url="$(gh pr create --base main --head "$BRANCH" --draft \
            --title "agent($PROVIDER): #$ISSUE $title" \
            --body "Refs #$ISSUE

          Implementación autónoma. Plan reservado en #182; cambios limitados al CLAIM; preflight ejecutado. PR draft, sin auto-merge.")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          gh issue edit "$ISSUE" --add-label agent:pr-open --remove-label agent:working --remove-label agent:auto --remove-label agent:qwen --remove-label agent:gemini >/dev/null 2>&1 || true
          gh issue comment "$ISSUE" --body "Agent autopilot ($PROVIDER): $url"
          gh workflow run ci.yml --ref "$BRANCH"

      - name: Marcar fallo
        if: failure() && steps.select.outputs.issue != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.select.outputs.issue }}
          BRANCH: ${{ steps.route.outputs.branch }}
          RESERVED: ${{ steps.reserve.outputs.reserved }}
        run: |
          gh issue edit "$ISSUE" --add-label agent:needs-human --remove-label agent:working >/dev/null 2>&1 || true
          gh issue comment "$ISSUE" --body "Agent autopilot se detuvo: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true
          pr="$(gh pr list --state open --head "${BRANCH:-none}" --json number --jq '.[0].number // empty' || true)"
          if [[ "$RESERVED" == true && -z "$pr" ]]; then
            gh issue comment "$(python3 scripts/gestionar_reservas_rollover.py --active)" --body "RELEASE issue=#$ISSUE branch=$BRANCH motivo=autopilot-fallo-antes-de-PR" >/dev/null || true
          fi
