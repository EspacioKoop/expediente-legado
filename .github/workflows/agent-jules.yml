name: Agent Jules

# Jules (Google) es un worker de nivel 3 externo: se activa al poner la label
# `jules` a un issue y abre su propia PR (#1917). No publica reservas, así que
# este puente las publica por él con las mismas reglas del pool: plan delegado
# de confianza, un solo fichero y rutas no protegidas.

on:
  issues:
    types: [labeled, unlabeled, closed]
  pull_request:
    types: [opened, reopened, synchronize, closed]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: agent-jules-${{ github.event.issue.number || github.event.pull_request.number || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  reserva:
    if: >-
      github.event_name == 'issues' &&
      (
        (github.event.action == 'closed' && contains(github.event.issue.labels.*.name, 'jules')) ||
        (github.event.action != 'closed' && github.event.label.name == 'jules')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Publicar CLAIM o RELEASE de Jules
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          ACTION: ${{ github.event.action }}
          MAX_FILES: ${{ vars.AGENT_POOL_MAX_FILES || '1' }}
        run: |
          set -euo pipefail
          branch="jules/issue-$ISSUE"
          registro="$(python3 scripts/gestionar_reservas_rollover.py --active)"

          if [[ "$ACTION" != labeled ]]; then
            # Sin PR de Jules que cerrar, el RELEASE va por issue y rama sintética.
            # Si nunca hubo CLAIM, un RELEASE de más es inocuo.
            gh issue comment "$registro" --repo "$GITHUB_REPOSITORY" \
              --body "RELEASE issue=#$ISSUE branch=$branch motivo=jules-$ACTION" >/dev/null
            exit 0
          fi

          # Mismas herramientas que el pool: plan delegado de un autor de
          # confianza y validación de rutas con el límite de ficheros vigente.
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE" > /tmp/issue.json
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments?per_page=100" \
            --jq '.[]' | jq -s '.' > /tmp/comments.json
          jq -s '.[0] + {comments: .[1]}' /tmp/issue.json /tmp/comments.json > /tmp/entrada.json
          python3 scripts/agent_delegated_plan.py --issue /tmp/entrada.json --output /tmp/delegado.json >/dev/null

          status=0
          python3 scripts/agent_plan_parse.py \
            --source /tmp/delegado.json \
            --max-files "$MAX_FILES" \
            --output /tmp/plan.json || status=$?
          if (( status != 0 )) || [[ "$(jq -r '.found' /tmp/delegado.json)" != true ]] ||
            [[ "$(jq '.files | length' /tmp/plan.json)" -eq 0 ]]; then
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label agent:needs-human >/dev/null 2>&1 || true
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body \
              "Jules: este issue no tiene un \`AGENT_PLAN\` delegado válido de $MAX_FILES fichero(s), así que no se publica reserva. Jules puede empezar igualmente al ver la label: revisa su PR con cuidado o quita la label y añade el plan." || true
            exit 0
          fi

          files="$(jq -r '.files | join(",")' /tmp/plan.json)"
          goal="$(jq -r '.goal | gsub("[[:space:]]+"; "-")' /tmp/plan.json)"
          gh issue comment "$registro" --repo "$GITHUB_REPOSITORY" --body \
            "CLAIM issue=#$ISSUE agent=Jules branch=$branch files=$files goal=$goal lease=48h" >/dev/null
          echo "CLAIM de Jules publicado en #$registro: $files"


  # Las ramas reales de Jules no siguen jules/issue-N: terminan en el task id
  # de Jules y la PR contiene un marcador estable + "Fixes #N". Este job solo
  # espeja ese ciclo en #1713; no concede autorización, no fusiona y no escribe
  # contenido del repositorio.
  pr_real:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.body, 'PR created automatically by Jules for task [')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Espejar PR real de Jules en el registro
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ github.event.action }}
          PR: ${{ github.event.pull_request.number }}
          BODY: ${{ github.event.pull_request.body }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGED: ${{ github.event.pull_request.merged }}
        run: |
          set -euo pipefail

          # Las cuatro PR reales observadas terminan en el id numerico de la
          # tarea Jules. El marcador del cuerpo debe contener el mismo id.
          if [[ ! "$HEAD_BRANCH" =~ -([0-9]{12,})$ ]]; then
            echo "PR ignorada: la rama no termina en task id de Jules."
            exit 0
          fi
          task_id="${BASH_REMATCH[1]}"
          marcador="PR created automatically by Jules for task [$task_id]"
          if [[ "$BODY" != *"$marcador"* ]]; then
            echo "PR ignorada: marcador Jules/task id no coincide."
            exit 0
          fi

          # El issue se obtiene de un token numerico controlado, nunca se
          # evalua texto libre del cuerpo.
          fixes_re='Fixes[[:space:]]+#([0-9]+)'
          if [[ "$BODY" =~ $fixes_re ]]; then
            issue="${BASH_REMATCH[1]}"
          else
            echo "PR ignorada: no declara Fixes #N."
            exit 0
          fi

          # Segunda prueba de pertenencia: el issue delegado sigue marcado como
          # Jules. Un texto de PR copiado a mano no basta para tocar el registro.
          if ! gh api "repos/$GITHUB_REPOSITORY/issues/$issue" --jq '.labels[].name' |
            grep -Fxq jules; then
            echo "PR ignorada: #$issue no esta en la cola Jules."
            exit 0
          fi

          registro="$(python3 scripts/gestionar_reservas_rollover.py --active)"
          claim_branch="jules/issue-$issue"

          if [[ "$ACTION" == closed ]]; then
            motivo="jules-pr-cerrada"
            [[ "$MERGED" == true ]] && motivo="jules-pr-mergeada"
            gh issue comment "$registro" --repo "$GITHUB_REPOSITORY" --body \
              "RELEASE issue=#$issue pr=#$PR branch=$claim_branch motivo=$motivo actual_branch=$HEAD_BRANCH" >/dev/null
            exit 0
          fi

          gh issue comment "$registro" --repo "$GITHUB_REPOSITORY" --body \
            "PR_DRAFT issue=#$issue pr=#$PR sha=$HEAD_SHA branch=$HEAD_BRANCH pruebas=CI-canonica-por-pull_request alcance=jules-task-$task_id limites=sin-auto-merge" >/dev/null
          echo "PR Jules #$PR enlazada con issue #$issue ($HEAD_BRANCH)."


  # CI es la señal canónica de que el head fue validado. Este job no confía en
  # el workflow_run por sí solo: vuelve a autenticar la PR Jules, comprueba que
  # el SHA sigue siendo el mismo y que los checks core presentes ya terminaron.
  # PR_READY sigue siendo informativo; nunca habilita ni ejecuta merge.
  pr_ready:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Publicar PR_READY de Jules tras CI verde
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          CI_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" > /tmp/pr.json
          body="$(jq -r '.body // ""' /tmp/pr.json)"
          head_branch="$(jq -r '.head.ref' /tmp/pr.json)"
          head_sha="$(jq -r '.head.sha' /tmp/pr.json)"
          head_repo="$(jq -r '.head.repo.full_name // ""' /tmp/pr.json)"

          if [[ "$head_repo" != "$GITHUB_REPOSITORY" ]] || [[ "$head_sha" != "$CI_HEAD_SHA" ]]; then
            echo "PR ignorada: repo o SHA ya no coincide con el run de CI."
            exit 0
          fi

          if [[ ! "$head_branch" =~ -([0-9]{12,})$ ]]; then
            echo "PR ignorada: la rama no termina en task id de Jules."
            exit 0
          fi
          task_id="${BASH_REMATCH[1]}"
          marcador="PR created automatically by Jules for task [$task_id]"
          if [[ "$body" != *"$marcador"* ]]; then
            echo "PR ignorada: marcador Jules/task id no coincide."
            exit 0
          fi

          fixes_re='Fixes[[:space:]]+#([0-9]+)'
          if [[ "$body" =~ $fixes_re ]]; then
            issue="${BASH_REMATCH[1]}"
          else
            echo "PR ignorada: no declara Fixes #N."
            exit 0
          fi

          if ! gh api "repos/$GITHUB_REPOSITORY/issues/$issue" --jq '.labels[].name' |
            grep -Fxq jules; then
            echo "PR ignorada: #$issue ya no esta en la cola Jules."
            exit 0
          fi

          # Defensa contra drift del worker: reconstruir el plan delegado y
          # compararlo con el diff publicado, sin ampliar la reserva a posteriori.
          gh api "repos/$GITHUB_REPOSITORY/issues/$issue" > /tmp/issue.json
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$issue/comments?per_page=100" --jq '.[]' |
            jq -s '.' > /tmp/comments.json
          jq -s '.[0] + {comments: .[1]}' /tmp/issue.json /tmp/comments.json > /tmp/entrada.json
          python3 scripts/agent_delegated_plan.py --issue /tmp/entrada.json --output /tmp/delegado.json >/dev/null

          status=0
          python3 scripts/agent_plan_parse.py --source /tmp/delegado.json --max-files "$MAX_FILES" --output /tmp/plan.json || status=$?
          if (( status != 0 )) || [[ "$(jq -r '.found' /tmp/delegado.json)" != true ]]; then
            echo "PR no lista: no se pudo reconstruir un AGENT_PLAN delegado valido."
            exit 0
          fi

          jq -r '.files[]' /tmp/plan.json | sort -u > /tmp/plan_files
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files?per_page=100" --jq '.[].filename' |
            sort -u > /tmp/pr_files
          if ! diff -u /tmp/plan_files /tmp/pr_files; then
            gh issue edit "$issue" --repo "$GITHUB_REPOSITORY" --add-label agent:needs-human >/dev/null 2>&1 || true
            echo "PR no lista: archivos reales fuera o ausentes del AGENT_PLAN."
            exit 0
          fi

          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$head_sha&event=pull_request&per_page=100"             > /tmp/runs.json

          # CI debe estar verde. Los otros checks core se exigen si existen para
          # este head; un workflow opcional ausente no bloquea una tarea Jules.
          if ! jq -e '
            [.workflow_runs[] | select(.name == "CI")] |
            length > 0 and all(.[]; .status == "completed" and .conclusion == "success")
          ' /tmp/runs.json >/dev/null; then
            echo "PR no lista: CI canónico no está completamente verde."
            exit 0
          fi

          if ! jq -e '
            [
              .workflow_runs[]
              | select(
                  .name == "Secretos"
                  or .name == "GBC fixtures"
                  or .name == "Auto-label by area"
                )
            ]
            | all(.[];
                .status == "completed"
                and (
                  .conclusion == "success"
                  or .conclusion == "skipped"
                  or .conclusion == "neutral"
                )
              )
          ' /tmp/runs.json >/dev/null; then
            echo "PR no lista: hay un check core presente pendiente o fallido."
            exit 0
          fi

          registro="$(python3 scripts/gestionar_reservas_rollover.py --active)"
          marca="PR_READY issue=#$issue pr=#$PR sha=$head_sha"
          if gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$registro/comments?per_page=100"             --jq '.[].body' | grep -Fq "$marca"; then
            echo "PR_READY ya publicado para #$PR@$head_sha."
            exit 0
          fi

          gh issue comment "$registro" --repo "$GITHUB_REPOSITORY" --body             "$marca pruebas=CI-canonica+checks-core-verdes alcance=jules-task-$task_id limites=sin-auto-merge" >/dev/null
          echo "PR_READY de Jules #$PR publicado en #$registro."
