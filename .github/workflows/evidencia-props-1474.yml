name: Evidencia props puestos 1474

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/evidencia-props-1474.yml'
      - '.github/actions/upload-artifact/**'
      - '.godot-version'
      - 'godot/project.godot'
      - 'godot/guion/oficina_utileria.gd'
      - 'godot/guion/dia_app.gd'
      - 'godot/guion/espacio_3d.gd'
      - 'godot/guion/companeros.gd'
      - 'godot/escenas/dia.tscn'
      - 'godot/pruebas/capturar_props_puestos_1474.gd'
      - 'scripts/test_evidencia_props_1474.py'
      - 'docs/evidencias/props-1474/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evidencia:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Instalar Godot declarado por el proyecto
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat .godot-version)"
          archivo="Godot_v${version}_linux.x86_64.zip"
          base="https://github.com/godotengine/godot-builds/releases/download/${version}"
          curl --fail --location --retry 3 "$base/$archivo" -o "$RUNNER_TEMP/$archivo"
          curl --fail --location --retry 3 "$base/SHA512-SUMS.txt" -o "$RUNNER_TEMP/SHA512-SUMS.txt"
          cd "$RUNNER_TEMP"
          grep -F " $archivo" SHA512-SUMS.txt | sha512sum --check --strict
          unzip -q "$archivo"
          mkdir -p godot-bin
          mv "Godot_v${version}_linux.x86_64" godot-bin/godot4
          chmod +x godot-bin/godot4
          echo "$RUNNER_TEMP/godot-bin" >> "$GITHUB_PATH"

      - name: Importar proyecto
        run: godot4 --headless --editor --path godot --quit

      - name: Validar contrato de evidencia
        run: python3 -m unittest -v scripts/test_evidencia_props_1474.py

      - name: Renderizar tres puestos sin NPC
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidencia-props-1474
          xvfb-run -a godot4 --path godot \
            --script res://pruebas/capturar_props_puestos_1474.gd -- \
            "$GITHUB_WORKSPACE/evidencia-props-1474"

          for puesto in 1 2 3; do
            test -s "evidencia-props-1474/puesto-${puesto}.png"
          done
          test -s evidencia-props-1474/manifest.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("evidencia-props-1474/manifest.json").read_text())
          if manifest.get("issue") != 1474 or manifest.get("fase") != "archivo":
              raise SystemExit("manifiesto fuera del gate #1474")
          if not manifest.get("renderer"):
              raise SystemExit("el manifiesto debe registrar el renderer efectivo")
          if manifest.get("locale") != "es" or manifest.get("hud") is not False:
              raise SystemExit("la evidencia debe usar locale es y HUD oculto")
          if manifest.get("camara") != "jugable":
              raise SystemExit("la evidencia debe usar la cámara jugable")
          if manifest.get("companeros_visibles") != 0:
              raise SystemExit("las capturas deben demostrar los puestos sin NPC")
          if manifest.get("companeros_retirados", 0) <= 0:
              raise SystemExit("el pase no retiró ningún compañero del montaje real")
          if manifest.get("veredicto_automatico") is not False:
              raise SystemExit("el workflow no puede autoaprobar escala/oclusión")

          puestos = manifest.get("puestos", [])
          if len(puestos) != 3:
              raise SystemExit("se esperaban exactamente tres puestos")
          perfiles = [p.get("perfil_props", "") for p in puestos]
          if any(not p for p in perfiles) or len(set(perfiles)) != 3:
              raise SystemExit("los tres puestos no conservan perfiles distintos")
          if any(p["perfil_props"] != p["perfil_antes_retirar_npc"] for p in puestos):
              raise SystemExit("retirar el NPC alteró el perfil ya asignado al puesto")
          firmas = [tuple(p.get("hijos", [])) for p in puestos]
          if len(set(firmas)) != 3:
              raise SystemExit("los tres puestos tienen la misma firma de composición")
          if any(len(p.get("sha256", "")) != 64 for p in puestos):
              raise SystemExit("hash de captura inválido")

          print(
              "3/3 puestos sin NPC, perfiles y firmas distintas; "
              f"renderer efectivo={manifest['renderer']}; listos para revisión humana"
          )
          PY

      - name: Adjuntar evidencia visual de #1474
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: evidencia-props-1474-${{ github.sha }}
          path: evidencia-props-1474/
          if-no-files-found: error
          retention-days: 14
