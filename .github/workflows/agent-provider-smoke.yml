name: Agent provider smoke

on:
  workflow_dispatch:
    inputs:
      slot:
        description: 'Número de slot de fallback a validar (QWEN_FALLBACK_N_*)'
        required: true
        default: 1
        type: number
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-provider-smoke.yml'

permissions:
  contents: read
  id-token: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SLOT_N: ${{ github.event_name == 'push' && 1 || inputs.slot }}
      SLOT: ${{ format('qwen-fallback-{0}', github.event_name == 'push' && 1 || inputs.slot) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: slot
        name: Secret del slot
        env:
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          set -euo pipefail
          # Propio o heredado con QWEN_FALLBACK_N_KEY_FROM (#1685); nunca la clave.
          echo "secret=$(python3 scripts/agent_slots.py secreto --worker "$SLOT" || true)" >> "$GITHUB_OUTPUT"

      - id: config
        name: Resolver backend
        env:
          # Slots dinámicos (#1685): URL/modelo desde las variables; la clave se
          # comprueba sin exponerla al shell.
          VARS_JSON: ${{ toJSON(vars) }}
          SLOT_HAS_KEY: ${{ steps.slot.outputs.secret != '' && secrets[steps.slot.outputs.secret] != '' }}
        run: |
          set -euo pipefail
          [[ "$SLOT" =~ ^qwen-fallback-([1-9][0-9]*)$ ]] || { echo "Slot no permitido: $SLOT" >&2; exit 2; }
          [[ "$SLOT_HAS_KEY" == true ]] || { echo "Falta la clave del slot $SLOT_N (propia o KEY_FROM)" >&2; exit 3; }
          resuelto="$(FALLBACK_KEYS="$SLOT_N" python3 scripts/agent_slots.py resolver --worker "$SLOT")"
          model="$(jq -r '.model' <<<"$resuelto")"
          [[ -n "$model" ]] || { echo "Falta MODEL para $SLOT" >&2; exit 3; }
          echo "url=$(jq -r '.url' <<<"$resuelto")" >> "$GITHUB_OUTPUT"
          echo "model=$model" >> "$GITHUB_OUTPUT"
          echo "Validando $SLOT con modelo $model"

      - id: smoke
        name: Smoke del slot
        uses: QwenLM/qwen-code-action@05f81718976f3b7da657422e6e8e4d372b8621d7 # v1
        with:
          openai_api_key: ${{ secrets[steps.slot.outputs.secret] }}
          openai_base_url: ${{ steps.config.outputs.url }}
          openai_model: ${{ steps.config.outputs.model }}
          qwen_cli_version: ${{ vars.QWEN_CLI_VERSION || 'latest' }}
          settings: '{"model":{"maxSessionTurns":6},"experimental":{"emitToolUseSummaries":false},"tools":{"core":["read_file"]}}'
          prompt: 'Usa obligatoriamente read_file para leer AGENTS.md. No edites nada y no intentes ejecutar comandos. Después responde con una última línea exactamente: AGENT_PROVIDER_SMOKE_OK file=AGENTS.md'

      - name: Verificar marcador
        env:
          SUMMARY: ${{ steps.smoke.outputs.summary }}
        run: |
          set -euo pipefail
          grep -Fq 'AGENT_PROVIDER_SMOKE_OK file=AGENTS.md' <<<"$SUMMARY"
          echo "Smoke de $SLOT validado."


      - name: Cerrar circuit breaker del slot
        continue-on-error: true
        env:
          CONTROL_URL: ${{ vars.SIGA98_FEEDBACK_FALLBACK_URL }}
        run: |
          set -euo pipefail
          [[ -n "${CONTROL_URL:-}" ]] || exit 0
          base="${CONTROL_URL%/}"
          base="${base%/api/report}"
          oidc_json="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=siga98-agent-pool")"
          oidc_token="$(jq -er '.value' <<<"$oidc_json")"
          payload="$(jq -nc --arg worker "$SLOT" \
            '{schema:1,worker:$worker,provider:"qwen",status:"healthy",reason:"provider-smoke"}')"
          curl -fsS -X POST "$base/api/agent-pool/worker-health/report" \
            -H "Authorization: Bearer $oidc_token" \
            -H 'Content-Type: application/json' --data "$payload" >/dev/null
          echo "Circuit breaker de $SLOT cerrado en Deno KV."
