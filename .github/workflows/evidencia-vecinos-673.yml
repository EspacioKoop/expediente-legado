name: Evidencia vecinos 673

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/evidencia-vecinos-673.yml'
      - '.godot-version'
      - 'godot/guion/vecinos_edificio*.gd'
      - 'godot/guion/dia_vecinos_edificio_app.gd'
      - 'godot/escenas/dia.tscn'
      - 'godot/pruebas/capturar_vecinos_673.gd'
      - 'scripts/test_evidencia_vecinos_673.py'
      - 'docs/evidencias/vecinos-673/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evidencia:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      GALLIUM_DRIVER: llvmpipe
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Godot declarado por el proyecto
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat .godot-version)"
          archivo="Godot_v${version}_linux.x86_64.zip"
          base="https://github.com/godotengine/godot-builds/releases/download/${version}"
          curl --fail --location --retry 3 "$base/$archivo" -o "$RUNNER_TEMP/$archivo"
          curl --fail --location --retry 3 "$base/SHA512-SUMS.txt" -o "$RUNNER_TEMP/SHA512-SUMS.txt"
          cd "$RUNNER_TEMP"
          grep -F " $archivo" SHA512-SUMS.txt | sha512sum --check --strict
          unzip -q "$archivo"
          mkdir -p godot-bin
          mv "Godot_v${version}_linux.x86_64" godot-bin/godot4
          chmod +x godot-bin/godot4
          echo "$RUNNER_TEMP/godot-bin" >> "$GITHUB_PATH"

      - name: Importar proyecto
        run: godot4 --headless --editor --path godot --quit

      - name: Validar contrato de evidencia
        run: python3 -m unittest -v scripts/test_evidencia_vecinos_673.py

      - name: Renderizar portal y vecinos sin HUD
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidencia-vecinos-673
          xvfb-run -a godot4 --path godot --rendering-method gl_compatibility \
            --script res://pruebas/capturar_vecinos_673.gd -- \
            "$GITHUB_WORKSPACE/evidencia-vecinos-673"
          for captura in manuela repartidor; do
            test -s "evidencia-vecinos-673/${captura}.png"
          done
          test -s evidencia-vecinos-673/manifest.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("evidencia-vecinos-673/manifest.json").read_text())
          if manifest["issue"] != 673:
              raise SystemExit("manifiesto fuera del gate #673")
          if manifest["locale"] != "es" or manifest["hud"] is not False:
              raise SystemExit("la evidencia debe usar locale es y HUD oculto")
          if manifest["camara"] != "jugable" or manifest["veredicto_automatico"] is not False:
              raise SystemExit("la evidencia debe usar cámara jugable sin autoaprobar")
          casos = {caso["id"]: caso for caso in manifest["casos"]}
          if set(casos) != {"manuela", "repartidor"}:
              raise SystemExit("faltan los dos encuadres del portal")
          if casos["manuela"]["dia"] != 7 or casos["repartidor"]["dia"] != 8:
              raise SystemExit("las jornadas de evidencia dejaron de ser reproducibles")
          if "manuela_3b" not in casos["manuela"]["presencias_ids"]:
              raise SystemExit("Manuela no está presente en su encuadre")
          if "repartidor_confundido" not in casos["repartidor"]["presencias_ids"]:
              raise SystemExit("el repartidor no está presente en su encuadre")
          hashes = [caso["sha256"] for caso in manifest["casos"]]
          if len(hashes) != 2 or len(set(hashes)) != 2:
              raise SystemExit("los dos estados deben producir capturas distintas")
          for caso in casos.values():
              for nombre, objetivo in caso["objetivos"].items():
                  if objetivo["en_frustum"] is not True:
                      raise SystemExit(f"{nombre} quedó fuera del frustum en {caso['id']}")
                  if float(objetivo["distancia_camara"]) <= 0.0:
                      raise SystemExit(f"distancia inválida para {nombre}")
          print("2/2 jornadas capturadas; evidencia lista para revisión humana")
          PY

      - name: Adjuntar evidencia visual de #673
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-vecinos-673-${{ github.sha }}
          path: evidencia-vecinos-673/
          if-no-files-found: error
          retention-days: 14
