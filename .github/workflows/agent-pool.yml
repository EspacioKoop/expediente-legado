name: Agent pool dispatcher

on:
  issues:
    types: [labeled]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      max_parallel:
        description: 'Máximo de workers de esta tanda (1-6)'
        required: true
        default: '6'
        type: choice
        options: ['1', '2', '3', '4', '5', '6']
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-pool.yml'
      - '.github/workflows/agent-worker.yml'

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write
  id-token: write

concurrency:
  group: agent-pool-dispatch-${{ github.event_name == 'issues' && github.event.issue.number || 'queue' }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name != 'issues' || github.event.label.name == 'agent:auto' || github.event.label.name == 'agent:pool' || github.event.label.name == 'agent:qwen' || github.event.label.name == 'agent:gemini'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      count: ${{ steps.select.outputs.count }}
      fallback_keys: ${{ steps.select.outputs.fallback_keys }}
      requested_max: ${{ steps.select.outputs.requested_max }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Crear etiquetas de cola
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create agent:auto --repo "$GITHUB_REPOSITORY" --color 5319E7 \
            --description "Cola automatica de agentes" --force
          gh label create agent:pool --repo "$GITHUB_REPOSITORY" --color 7057FF \
            --description "Alias compatible de la cola paralela" --force
          gh label create agent:qwen --repo "$GITHUB_REPOSITORY" --color 1D76DB \
            --description "Cola de agentes forzada a Qwen" --force
          gh label create agent:gemini --repo "$GITHUB_REPOSITORY" --color A2EEEF \
            --description "Cola de agentes forzada a Gemini" --force
          gh label create agent:working --repo "$GITHUB_REPOSITORY" --color F9D0C4 \
            --description "Agente trabajando" --force
          gh label create agent:pr-open --repo "$GITHUB_REPOSITORY" --color 0E8A16 \
            --description "PR autonomo abierto" --force
          gh label create agent:needs-human --repo "$GITHUB_REPOSITORY" --color D93F0B \
            --description "Necesita intervencion humana" --force

      - id: select
        name: Construir tanda
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_MAX: ${{ inputs.max_parallel || '6' }}
          ACTIONS_BUDGET: ${{ vars.AGENT_POOL_ACTIONS_BUDGET || '12' }}
          HAS_QWEN: ${{ secrets.QWEN_API_KEY != '' }}
          HAS_OMNIROUTE: ${{ secrets.OMNIROUTE_API_KEY != '' && secrets.TS_OAUTH_CLIENT_ID != '' && (secrets.TS_OAUTH_SECRET != '' || secrets.TS_AUDIENCE != '') && vars.OMNIROUTE_BASE_URL != '' && vars.OMNIROUTE_MODEL != '' }}
          HAS_GEMINI: ${{ secrets.GEMINI_API_KEY != '' }}
          KEV_BASE_URL: ${{ vars.KEV_BASE_URL }}
          KEV_MODEL: ${{ vars.KEV_MODEL || 'kev-latest' }}
          KEV_ROUTER_MIN_CONFIDENCE: ${{ vars.KEV_ROUTER_MIN_CONFIDENCE || '0.45' }}
          KEV_API_KEY: ${{ secrets.KEV_API_KEY }}
          CONTROL_URL: ${{ vars.SIGA98_FEEDBACK_FALLBACK_URL }}
          # Slots de fallback (#1685): URL y modelo se descubren desde las variables
          # con scripts/agent_slots.py. Los secretos no se pueden enumerar, así que
          # esta tabla es el único sitio con números de slot: añade una línea por
          # slot nuevo (y sube MAX_FALLBACKS en el script si pasas de 12).
          VARS_JSON: ${{ toJSON(vars) }}
          FALLBACK_KEYS: >-
            ${{ secrets.QWEN_FALLBACK_1_API_KEY != '' && '1' || '' }}
            ${{ secrets.QWEN_FALLBACK_2_API_KEY != '' && '2' || '' }}
            ${{ secrets.QWEN_FALLBACK_3_API_KEY != '' && '3' || '' }}
            ${{ secrets.QWEN_FALLBACK_4_API_KEY != '' && '4' || '' }}
            ${{ secrets.QWEN_FALLBACK_5_API_KEY != '' && '5' || '' }}
            ${{ secrets.QWEN_FALLBACK_6_API_KEY != '' && '6' || '' }}
            ${{ secrets.QWEN_FALLBACK_7_API_KEY != '' && '7' || '' }}
            ${{ secrets.QWEN_FALLBACK_8_API_KEY != '' && '8' || '' }}
            ${{ secrets.QWEN_FALLBACK_9_API_KEY != '' && '9' || '' }}
            ${{ secrets.QWEN_FALLBACK_10_API_KEY != '' && '10' || '' }}
            ${{ secrets.QWEN_FALLBACK_11_API_KEY != '' && '11' || '' }}
            ${{ secrets.QWEN_FALLBACK_12_API_KEY != '' && '12' || '' }}
        run: |
          set -euo pipefail
          for label in auto pool qwen gemini; do
            gh issue list --repo "$GITHUB_REPOSITORY" --state open \
              --label "agent:$label" --limit 100 \
              --json number,title,body,labels,createdAt,updatedAt \
              > "/tmp/issues-$label.json"
          done
          jq -s 'add | unique_by(.number)' \
            /tmp/issues-auto.json /tmp/issues-pool.json \
            /tmp/issues-qwen.json /tmp/issues-gemini.json \
            > /tmp/issues.json

          # Control-plane Deno KV (#1728): un lease activo gana sobre labels
          # rezagadas. Si Deno no responde, la selección conserva el mecanismo
          # histórico para que la migración sea fail-open.
          if [[ -n "${CONTROL_URL:-}" && "$(jq 'length' /tmp/issues.json)" -gt 0 ]]; then
            base="${CONTROL_URL%/}"
            base="${base%/api/report}"
            if oidc_json="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=siga98-agent-pool")" &&
              oidc_token="$(jq -er '.value' <<<"$oidc_json")"; then
              issue_ids="$(jq -c '[.[].number]' /tmp/issues.json)"
              payload="$(jq -nc --argjson issues "$issue_ids" '{schema:1,issues:$issues}')"
              if curl -fsS -X POST "$base/api/agent-pool/status" \
                -H "Authorization: Bearer $oidc_token" \
                -H 'Content-Type: application/json' \
                --data "$payload" -o /tmp/agent-pool-status.json; then
                leased="$(jq -c '[.leases[]?.issue]' /tmp/agent-pool-status.json)"
                tmp="$(mktemp)"
                jq --argjson leased "$leased" \
                  'map(select(.number as $n | ($leased | index($n) | not)))' \
                  /tmp/issues.json > "$tmp"
                mv "$tmp" /tmp/issues.json
                echo "Control-plane: $(jq 'length' <<<"$leased") leases activos excluidos."
              else
                echo "::warning::Control-plane Deno no disponible al filtrar la cola; se usa fallback GitHub."
              fi
            else
              echo "::warning::No se pudo obtener OIDC para el control-plane; se usa fallback GitHub."
            fi
          fi

          # Inventario único de workers (#1685): qwen-primary, gemini y cada slot
          # de fallback, con su tier, salen de las variables del repo. Añadir un
          # modelo o proveedor es configuración, no YAML.
          base_keys=""
          [[ "$HAS_QWEN" == true ]] && base_keys+=" qwen"
          [[ "$HAS_GEMINI" == true ]] && base_keys+=" gemini"
          export BASE_KEYS="$base_keys" OMNIROUTE="$HAS_OMNIROUTE"
          workers="$(python3 scripts/agent_slots.py workers)"
          echo "fallback_keys=$(python3 scripts/agent_slots.py usables)" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$workers" > /tmp/workers-configured.json

          # #1728: Deno KV es la fuente primaria del circuit breaker por
          # worker. Si el endpoint no está desplegado o falla, se conserva el
          # parser histórico de #1713 como fallback durante la migración.
          health_from_deno=false
          if [[ -n "${CONTROL_URL:-}" ]]; then
            base="${CONTROL_URL%/}"
            base="${base%/api/report}"
            if oidc_json="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=siga98-agent-pool")" &&
              oidc_token="$(jq -er '.value' <<<"$oidc_json")"; then
              worker_ids="$(jq -c '[.[].worker]' /tmp/workers-configured.json)"
              payload="$(jq -nc --argjson workers "$worker_ids" '{schema:1,workers:$workers}')"
              if curl -fsS -X POST "$base/api/agent-pool/worker-health/status" \
                -H "Authorization: Bearer $oidc_token" \
                -H 'Content-Type: application/json' \
                --data "$payload" -o /tmp/worker-health-kv.json; then
                unhealthy="$(jq -c '[.unhealthy[]?.worker]' /tmp/worker-health-kv.json)"
                jq --argjson unhealthy "$unhealthy" \
                  'map(. + {healthy: (.worker as $w | ($unhealthy | index($w) | not))})' \
                  /tmp/workers-configured.json > /tmp/workers.json
                health_from_deno=true
                if [[ "$(jq 'length' <<<"$unhealthy")" -gt 0 ]]; then
                  echo "Slots en cooldown (Deno KV): $(jq -r 'join(",")' <<<"$unhealthy")"
                fi
              fi
            fi
          fi

          if [[ "$health_from_deno" != true ]]; then
            echo "::warning::Health KV no disponible; usando cooldowns históricos de #1713."
            python3 scripts/gestionar_reservas_rollover.py --comments-output /tmp/registro-reservas.json
            jq '[.[-200:][] | {body:.body}]' /tmp/registro-reservas.json > /tmp/provider-health.json
            NOW_EPOCH="$(date +%s)" python3 - <<'PY'
          import json, os, re

          now=int(os.environ["NOW_EPOCH"])
          workers=json.load(open("/tmp/workers-configured.json",encoding="utf-8"))
          comments=json.load(open("/tmp/provider-health.json",encoding="utf-8"))
          unhealthy={}
          marker=re.compile(
              r"^AGENT_POOL_SLOT_UNHEALTHY\s+worker=([A-Za-z0-9._-]+)\s+"
              r"provider=(qwen|gemini)\s+reason=([A-Za-z0-9._-]+)\s+until=(\d+)\b"
          )
          reset=re.compile(r"^AGENT_POOL_SLOT_HEALTHY\s+worker=([A-Za-z0-9._-]+)\b")
          for comment in comments:
              body=comment.get("body","") if isinstance(comment,dict) else ""
              for raw in body.splitlines():
                  line=raw.strip()
                  clear=reset.match(line)
                  if clear:
                      unhealthy.pop(clear.group(1),None)
                      continue
                  match=marker.match(line)
                  if not match:
                      continue
                  worker, provider, reason, until=match.groups()
                  until=int(until)
                  if until > now:
                      anterior=unhealthy.get(worker)
                      if anterior is None or until > int(anterior["until"]):
                          unhealthy[worker]={"provider":provider,"reason":reason,"until":until}

          for worker in workers:
              worker["healthy"]=worker.get("worker") not in unhealthy
          json.dump(workers,open("/tmp/workers.json","w",encoding="utf-8"))
          if unhealthy:
              print("Slots en cooldown (#1713 fallback):", ",".join(sorted(unhealthy)))
          PY
          fi

          # #2237: el lease por slot de #2230 es la fuente de ocupación. Se
          # consulta después del health para separar "ocupado" de "en cooldown".
          # Si Deno/OIDC falla, no se marca ningún slot: acquire mantiene la
          # última defensa atómica y este corte sigue siendo fail-open.
          occupancy_from_deno=false
          if [[ -n "${CONTROL_URL:-}" ]]; then
            base="${CONTROL_URL%/}"
            base="${base%/api/report}"
            if oidc_json="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=siga98-agent-pool")" &&
              oidc_token="$(jq -er '.value' <<<"$oidc_json")"; then
              worker_ids="$(jq -c '[.[].worker]' /tmp/workers.json)"
              payload="$(jq -nc --argjson workers "$worker_ids" '{schema:1,workers:$workers}')"
              if curl -fsS -X POST "$base/api/agent-pool/worker-status" \
                -H "Authorization: Bearer $oidc_token" \
                -H 'Content-Type: application/json' \
                --data "$payload" -o /tmp/worker-occupancy-kv.json; then
                occupied="$(jq -c '[.leases[]?.worker | select(type == "string")] | unique' /tmp/worker-occupancy-kv.json)"
                tmp="$(mktemp)"
                jq --argjson occupied "$occupied" \
                  'map(. + {occupied: (.worker as $w | ($occupied | index($w)) != null)})' \
                  /tmp/workers.json > "$tmp"
                mv "$tmp" /tmp/workers.json
                occupancy_from_deno=true
                if [[ "$(jq 'length' <<<"$occupied")" -gt 0 ]]; then
                  echo "Slots ocupados (Deno KV): $(jq -r 'join(",")' <<<"$occupied")"
                fi
              fi
            fi
          fi
          if [[ "$occupancy_from_deno" != true ]]; then
            echo "::warning::Ocupación KV no disponible; acquire conserva la exclusión atómica."
          fi

          # #1621: ranking histórico sin estado adicional. Un dispatcher puede
          # completar sin lanzar workers; esos runs vacíos no deben expulsar
          # muestras útiles de la ventana. Los disparos por "issues" son muy
          # frecuentes y casi siempre se saltan, así que el historial se limita
          # a workflow_dispatch completados. Se inspeccionan hasta 100 y se
          # conservan como máximo los 8 más recientes con matrix jobs.
          # Si la API falla o no hay muestras útiles, el score sigue siendo 50.
          printf '[]\n' > /tmp/worker-jobs.json
          history_worker_runs=0
          if mapfile -t history_runs < <(
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/agent-pool.yml/runs?event=workflow_dispatch&status=completed&per_page=100" \
              --jq '.workflow_runs[].id' 2>/dev/null
          ); then
            for history_run in "${history_runs[@]}"; do
              [[ -n "$history_run" ]] || continue
              if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$history_run/jobs?per_page=100" \
                --jq '[.jobs[] | {name:.name,conclusion:.conclusion,steps:[.steps[]? | {name:.name,conclusion:.conclusion}]}]' \
                > /tmp/worker-jobs-one.json 2>/dev/null; then
                worker_jobs="$(jq '[.[] | select(((.name // "") | startswith("run (")) and ((.name // "") | endswith(" / worker")))] | length' /tmp/worker-jobs-one.json)"
                if (( worker_jobs == 0 )); then
                  continue
                fi
                tmp="$(mktemp)"
                jq -s '.[0] + .[1]' /tmp/worker-jobs.json /tmp/worker-jobs-one.json > "$tmp"
                mv "$tmp" /tmp/worker-jobs.json
                history_worker_runs=$((history_worker_runs + 1))
                if (( history_worker_runs >= 8 )); then
                  break
                fi
              fi
            done
          fi
          printf '{}\n' > /tmp/worker-scores.json
          python3 scripts/agent_worker_score.py \
            --jobs /tmp/worker-jobs.json \
            --output /tmp/worker-scores.json >/dev/null || true

          # #1871: telemetría compacta de los PRs v1. No se guardan prompts ni
          # memorias; solo handoff/reviewer, ventana temporal y checks CI del PR.
          # Los fallos de cuota/guard sin PR quedan fuera y siguen en worker-health.
          printf '{}\n' > /tmp/handoff-metrics.json
          if gh pr list --repo "$GITHUB_REPOSITORY" --state all --limit 100 \
            --json number,title,body,commits,createdAt,updatedAt,closedAt,mergedAt,statusCheckRollup \
            > /tmp/agent-prs.json 2>/dev/null; then
            python3 scripts/agent_handoff_metrics.py \
              --prs /tmp/agent-prs.json \
              --window-days 30 \
              --output /tmp/handoff-metrics.json >/dev/null || true
          fi

          tmp="$(mktemp)"
          jq --slurpfile scores /tmp/worker-scores.json \
             --slurpfile handoff /tmp/handoff-metrics.json \
            'map(. + {
              score: (($scores[0][.worker].score) // 50),
              score_samples: (($scores[0][.worker].samples) // 0),
              handoff_loss_proxy_pct: (($handoff[0][.worker].handoff_loss_proxy_pct) // null),
              rework_rate_pct: (($handoff[0][.worker].rework_rate_pct) // null),
              contract_valid_rate_pct: (($handoff[0][.worker].contract_valid_rate_pct) // null),
              ci_success_rate_pct: (($handoff[0][.worker].ci_success_rate_pct) // null),
              ci_failure_rate_pct: (($handoff[0][.worker].ci_failure_rate_pct) // null),
              ci_pending_samples: (($handoff[0][.worker].ci_pending_samples) // 0),
              telemetry_window_days: (($handoff[0][.worker].window_days) // 30),
              telemetry_samples: (($handoff[0][.worker].samples) // 0)
            })' /tmp/workers.json > "$tmp"
          mv "$tmp" /tmp/workers.json
          jq -r '.[] | "worker-score \(.worker)=\(.score) provider=\(.provider) backend=\(.backend // .provider) samples=\(.score_samples) handoff=\(.handoff_loss_proxy_pct // "n/a") rework=\(.rework_rate_pct // "n/a") ci_ok=\(.ci_success_rate_pct // "n/a") ci_fail=\(.ci_failure_rate_pct // "n/a") window=\(.telemetry_window_days)d telemetry=\(.telemetry_samples)"' /tmp/workers.json

          has_qwen="$(jq -r 'any(.[]; .provider == "qwen" and (if has("healthy") then .healthy else true end) and ((.occupied // false) | not))' /tmp/workers.json)"
          has_gemini="$(jq -r 'any(.[]; .provider == "gemini" and (if has("healthy") then .healthy else true end) and ((.occupied // false) | not))' /tmp/workers.json)"

          # #1902: no añadir más workers cuando Actions ya está saturado. Si la
          # consulta falla, se conserva REQUESTED_MAX (fail-open).
          effective_max="$REQUESTED_MAX"
          queued_runs=0
          active_runs=0
          if queued_json="$(gh run list --repo "$GITHUB_REPOSITORY" --status queued --limit 100 --json databaseId 2>/dev/null)" &&
             active_json="$(gh run list --repo "$GITHUB_REPOSITORY" --status in_progress --limit 100 --json databaseId 2>/dev/null)"; then
            queued_runs="$(jq 'length' <<<"$queued_json")"
            active_runs="$(jq 'length' <<<"$active_json")"
            pressure="$(python3 scripts/agent_pool_backpressure.py \
              --requested "$REQUESTED_MAX" \
              --queued "$queued_runs" \
              --in-progress "$active_runs" \
              --budget "$ACTIONS_BUDGET")"
            effective_max="$(jq -r '.capacity' <<<"$pressure")"
          fi
          echo "Backpressure Actions: requested=$REQUESTED_MAX effective=$effective_max queued=$queued_runs active=$active_runs budget=$ACTIONS_BUDGET"

          route_limit=$((effective_max * 2))
          (( route_limit > 12 )) && route_limit=12
          mapfile -t candidates < <(
            jq -r --argjson limit "$route_limit" \
              'sort_by(.createdAt, .number)[:$limit][].number' /tmp/issues.json
          )

          for issue in "${candidates[@]}"; do
            # Una lectura REST resuelve el handoff L2 antes de gastar un worker.
            # Si GitHub o el parser fallan, se conserva fail-open y el worker
            # mantiene su guard defensivo.
            planned='[]'
            planned_bytes=0
            comments='[]'
            context_ok=false
            plan_ok=false
            if gh api "repos/$GITHUB_REPOSITORY/issues/$issue" > "/tmp/pool-issue-$issue.json" &&
               gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$issue/comments?per_page=100" \
                 --jq '.[]' | jq -s '.' > "/tmp/pool-comments-$issue.json"; then
              context_ok=true
              jq -s '.[0] + {comments: .[1]}' \
                "/tmp/pool-issue-$issue.json" "/tmp/pool-comments-$issue.json" \
                > "/tmp/pool-context-$issue.json"
              comments="$(jq -c '[.comments[-30:][]? | {body:(.body // "")}]' "/tmp/pool-context-$issue.json")"

              plan_status=0
              python3 scripts/agent_delegated_plan.py \
                --issue "/tmp/pool-context-$issue.json" \
                --output "/tmp/pool-plan-$issue.json" >/dev/null || plan_status=$?
              if (( plan_status == 0 )); then
                plan_ok=true
                found="$(jq -r '.found // false' "/tmp/pool-plan-$issue.json")"
                if [[ "$found" == true ]]; then
                  planned="$(jq -c '.plan.files // []' "/tmp/pool-plan-$issue.json")"
                  if [[ "$(jq 'length' <<<"$planned")" -eq 0 ]]; then
                    for label in agent:auto agent:pool agent:qwen agent:gemini agent:decompose; do
                      gh issue edit "$issue" --repo "$GITHUB_REPOSITORY" --remove-label "$label" \
                        >/dev/null 2>&1 || true
                    done
                    gh issue edit "$issue" --repo "$GITHUB_REPOSITORY" \
                      --add-label agent:needs-human >/dev/null 2>&1 || true
                    gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body \
                      "Agent pool: el AGENT_PLAN delegado no contiene rutas; se detiene antes de asignar worker para evitar un bucle sin corte ejecutable." \
                      >/dev/null || true
                    tmp="$(mktemp)"
                    jq --argjson issue "$issue" 'map(select(.number != $issue))' \
                      /tmp/issues.json > "$tmp"
                    mv "$tmp" /tmp/issues.json
                    continue
                  fi

                  # Presupuesto aproximado del executor: el checkout ya contiene
                  # los ficheros que el TaskPacket permitirá leer/editar. Un
                  # fichero nuevo pesa 0 aquí; el cuerpo del issue se suma en el
                  # selector Python.
                  while IFS= read -r path; do
                    if [[ -f "$path" ]]; then
                      bytes="$(wc -c < "$path")"
                      planned_bytes=$((planned_bytes + bytes))
                    fi
                  done < <(jq -r '.[]' <<<"$planned")
                else
                  already_decompose="$(
                    jq --argjson issue "$issue" \
                      '[.[] | select(.number == $issue) | .labels[].name] | index("agent:decompose") != null' \
                      /tmp/issues.json
                  )"
                  if [[ "$already_decompose" != true ]]; then
                    # Conservamos agent:qwen/agent:gemini para que el decomposer
                    # pueda mantener la preferencia explícita antes de limpiar cola.
                    gh issue edit "$issue" --repo "$GITHUB_REPOSITORY" \
                      --add-label agent:decompose >/dev/null
                    gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body \
                      "Agent pool: no hay AGENT_PLAN delegado; se deriva a nivel 2 antes de asignar un worker executor." \
                      >/dev/null || true
                    # Los eventos generados con GITHUB_TOKEN no encadenan workflows.
                    gh workflow run agent-decompose.yml --repo "$GITHUB_REPOSITORY" \
                      --ref main -f issue="$issue"
                  fi
                  tmp="$(mktemp)"
                  jq --argjson issue "$issue" 'map(select(.number != $issue))' \
                    /tmp/issues.json > "$tmp"
                  mv "$tmp" /tmp/issues.json
                  continue
                fi
              else
                echo "::warning::No se pudo validar AGENT_PLAN de #$issue; fail-open al guard del worker."
              fi
            fi

            tmp="$(mktemp)"
            jq --argjson issue "$issue" --argjson comments "$comments" --argjson planned "$planned" \
              --argjson planned_bytes "$planned_bytes" \
              'map(if .number == $issue
                   then . + {comments:$comments,plannedFiles:$planned,plannedBytes:$planned_bytes}
                   else . end)' \
              /tmp/issues.json > "$tmp"
            mv "$tmp" /tmp/issues.json

            state="/tmp/kev-$issue.json"
            jq --argjson issue "$issue" \
              '.[] | select(.number == $issue) |
               {title:.title,body:(.body//""),labels:[.labels[].name]}' \
              /tmp/issues.json > "$state"

            args=(--state-file "$state" --requested-provider auto)
            [[ "$has_qwen" == true ]] && args+=(--has-qwen)
            [[ "$has_gemini" == true ]] && args+=(--has-gemini)
            while IFS= read -r label; do
              args+=(--label "$label")
            done < <(jq -r '.labels[]' "$state")

            result="$(python3 scripts/kev_router.py "${args[@]}" 2>/dev/null || true)"
            preferred="$(jq -r '.provider // empty' <<<"$result" 2>/dev/null || true)"
            [[ "$preferred" == qwen || "$preferred" == gemini ]] || continue

            tmp="$(mktemp)"
            jq --argjson issue "$issue" --arg preferred "$preferred" \
              'map(if .number == $issue
                   then . + {preferredProvider:$preferred}
                   else . end)' \
              /tmp/issues.json > "$tmp"
            mv "$tmp" /tmp/issues.json
          done

          python3 scripts/agent_pool.py \
            --issues /tmp/issues.json \
            --workers /tmp/workers.json \
            --max-parallel "$effective_max" \
            --output /tmp/matrix.json >/dev/null

          matrix="$(cat /tmp/matrix.json)"
          count="$(jq '.include|length' /tmp/matrix.json)"
          jq -r '.include[] | "route issue=#\(.issue) provider=\(.provider) backend=\(.backend // .provider) worker=\(.worker)"' /tmp/matrix.json
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "requested_max=$REQUESTED_MAX" >> "$GITHUB_OUTPUT"
          configured="$(jq 'length' /tmp/workers.json)"
          healthy="$(jq '[.[] | select(if has("healthy") then .healthy else true end)] | length' /tmp/workers.json)"
          echo "Seleccionados $count workers de $healthy saludables ($configured configurados)."

  run:
    needs: prepare
    if: needs.prepare.outputs.count != '0'
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/agent-worker.yml
    with:
      issue: ${{ matrix.issue }}
      provider: ${{ matrix.provider }}
      worker: ${{ matrix.worker }}
      fallback_keys: ${{ needs.prepare.outputs.fallback_keys }}
      refill_max_parallel: ${{ needs.prepare.outputs.requested_max || '6' }}
    secrets: inherit


  drain:
    needs: [prepare, run]
    if: ${{ always() && needs.prepare.result == 'success' && needs.prepare.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Drenar cola si queda trabajo elegible
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_MAX: ${{ needs.prepare.outputs.requested_max || '6' }}
        run: |
          set -euo pipefail
          for label in auto pool qwen gemini; do
            gh issue list --repo "$GITHUB_REPOSITORY" --state open \
              --label "agent:$label" --limit 100 \
              --json number,labels > "/tmp/pending-$label.json"
          done
          jq -s '
            add
            | unique_by(.number)
            | map(select(
                ([.labels[].name] | index("agent:working")) == null and
                ([.labels[].name] | index("agent:pr-open")) == null and
                ([.labels[].name] | index("agent:needs-human")) == null
              ))
          ' /tmp/pending-auto.json /tmp/pending-pool.json \
            /tmp/pending-qwen.json /tmp/pending-gemini.json > /tmp/pending.json

          pending="$(jq 'length' /tmp/pending.json)"
          if (( pending > 0 )); then
            echo "Quedan $pending issues elegibles; programando siguiente tanda."
            gh workflow run agent-pool.yml --repo "$GITHUB_REPOSITORY" --ref main \
              -f max_parallel="$REQUESTED_MAX"
          else
            echo "Cola drenada: no quedan issues elegibles."
          fi
