name: Alpha playtest

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/alpha-playtest.yml'
      - 'scripts/playtest.sh'
      - 'scripts/playtest.ps1'
      - 'scripts/playtest.cmd'
      - 'godot/**'
      - 'gbc/minijuegos/caza_pixeles_98/**'
      - 'scripts/preparar_emulador_gb.sh'
      - 'scripts/auditar_frontera_qa.py'
      - 'dist/exportar-godot-alpha.sh'
      - '.godot-version'
  push:
    branches: [ main ]
    tags:
      - 'v*'
    paths:
      - '.github/workflows/alpha-playtest.yml'
      - 'godot/**'
      - 'gbc/minijuegos/caza_pixeles_98/**'
      - 'scripts/preparar_emulador_gb.sh'
      - 'scripts/auditar_frontera_qa.py'
      - 'scripts/playtest.sh'
      - 'scripts/playtest.ps1'
      - 'scripts/playtest.cmd'
      - 'dist/exportar-godot-alpha.sh'
      - '.godot-version'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gbc-boot-rom:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validar launcher de playtest
        shell: bash
        run: |
          bash -n scripts/playtest.sh
          bash scripts/playtest.sh --help >/dev/null
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar RGBDS fijado
        shell: bash
        env:
          RGBDS_VERSION: v1.0.3
          RGBDS_SHA256: 280a52061a0c516999bee75ac357628d6d50784309e0486cef25f7460e6f330b
        run: |
          set -euo pipefail
          url="https://github.com/gbdev/rgbds/releases/download/${RGBDS_VERSION}/rgbds-linux-x86_64.tar.xz"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/rgbds.tar.xz" "$url"
          echo "${RGBDS_SHA256}  $RUNNER_TEMP/rgbds.tar.xz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/rgbds"
          tar -xJf "$RUNNER_TEMP/rgbds.tar.xz" -C "$RUNNER_TEMP/rgbds"
          (cd "$RUNNER_TEMP/rgbds" && sudo ./install.sh)
      - name: Compilar boot ROM CGB libre de SameBoy
        shell: bash
        run: bash scripts/preparar_emulador_gb.sh boot-rom
      - name: Adjuntar boot ROM CGB
        uses: actions/upload-artifact@v4
        with:
          name: siga98-gbc-boot-rom-${{ github.sha }}
          path: godot/native/siga98_gb/.deps/bootroms/cgb_boot_fast.bin
          if-no-files-found: error
          retention-days: 1

  native-gb-windows:
    needs: gbc-boot-rom
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validar launchers Windows
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/playtest.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/playtest.ps1 -Help | Out-Null
          cmd.exe /c "scripts\playtest.cmd --help"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recuperar boot ROM CGB
        uses: actions/download-artifact@v4
        with:
          name: siga98-gbc-boot-rom-${{ github.sha }}
          path: godot/native/siga98_gb/.deps/bootroms
      - name: Compilar núcleo GB para Windows
        shell: bash
        run: bash scripts/preparar_emulador_gb.sh windows-release
      - name: Adjuntar DLL del núcleo GB
        uses: actions/upload-artifact@v4
        with:
          name: siga98-gb-windows-${{ github.sha }}
          path: godot/addons/siga98_gb/bin/windows/*.dll
          if-no-files-found: error
          retention-days: 1

  export-alpha:
    needs: native-gb-windows
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Recuperar núcleo GB de Windows
        uses: actions/download-artifact@v4
        with:
          name: siga98-gb-windows-${{ github.sha }}
          path: godot/addons/siga98_gb/bin/windows

      - name: Instalar RGBDS fijado
        shell: bash
        env:
          RGBDS_VERSION: v1.0.3
          RGBDS_SHA256: 280a52061a0c516999bee75ac357628d6d50784309e0486cef25f7460e6f330b
        run: |
          set -euo pipefail
          url="https://github.com/gbdev/rgbds/releases/download/${RGBDS_VERSION}/rgbds-linux-x86_64.tar.xz"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/rgbds.tar.xz" "$url"
          echo "${RGBDS_SHA256}  $RUNNER_TEMP/rgbds.tar.xz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/rgbds"
          tar -xJf "$RUNNER_TEMP/rgbds.tar.xz" -C "$RUNNER_TEMP/rgbds"
          (cd "$RUNNER_TEMP/rgbds" && sudo ./install.sh)

      - name: Compilar núcleo GB Linux y ROM propia
        shell: bash
        run: |
          bash scripts/preparar_emulador_gb.sh linux-all
          bash scripts/preparar_emulador_gb.sh rom

      - name: Instalar Godot y Export Templates declarados por el proyecto
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat .godot-version)"
          archivo="Godot_v${version}_linux.x86_64.zip"
          plantillas="Godot_v${version}_export_templates.tpz"
          base="https://github.com/godotengine/godot-builds/releases/download/${version}"

          curl --fail --location --retry 3 "$base/$archivo" -o "$RUNNER_TEMP/$archivo"
          curl --fail --location --retry 3 "$base/$plantillas" -o "$RUNNER_TEMP/$plantillas"
          curl --fail --location --retry 3 "$base/SHA512-SUMS.txt" -o "$RUNNER_TEMP/SHA512-SUMS.txt"

          cd "$RUNNER_TEMP"
          grep -F " $archivo" SHA512-SUMS.txt | sha512sum --check --strict
          grep -F " $plantillas" SHA512-SUMS.txt | sha512sum --check --strict

          unzip -q "$archivo"
          mkdir -p godot-bin
          mv "Godot_v${version}_linux.x86_64" godot-bin/godot4
          chmod +x godot-bin/godot4
          echo "$RUNNER_TEMP/godot-bin" >> "$GITHUB_PATH"

          template_dir="$HOME/.local/share/godot/export_templates/${version/-/.}"
          mkdir -p "$template_dir"
          unzip -q "$plantillas" -d "$RUNNER_TEMP/export-templates"
          cp -a "$RUNNER_TEMP/export-templates/templates/." "$template_dir/"

      - name: Importar proyecto antes del smoke
        run: godot4 --headless --editor --path godot --quit

      - name: Smoke de Caza Píxeles 98 antes de exportar
        run: godot4 --headless --path godot --script res://pruebas/emulador_gb_smoke.gd

      - name: Auditar contraste QA/release de recursos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/frontera-qa"
          godot4 --headless --path godot --export-pack "Linux x86_64 QA" "$RUNNER_TEMP/frontera-qa/qa.pck"
          godot4 --headless --path godot --export-pack "Linux x86_64" "$RUNNER_TEMP/frontera-qa/publico.pck"
          python3 scripts/auditar_frontera_qa.py qa "$RUNNER_TEMP/frontera-qa/qa.pck"
          python3 scripts/auditar_frontera_qa.py publico "$RUNNER_TEMP/frontera-qa/publico.pck"

      - name: Exportar alpha Linux y Windows
        env:
          GODOT_BIN: godot4
          SIGA98_QA_TOOLS: ${{ startsWith(github.ref, 'refs/tags/v') && '0' || '1' }}
        run: bash dist/exportar-godot-alpha.sh

      - name: Auditar los ejecutables que se van a adjuntar
        shell: bash
        env:
          SIGA98_ARTEFACTO_PUBLICO: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
        run: |
          set -euo pipefail
          modo=qa
          if [ "$SIGA98_ARTEFACTO_PUBLICO" = "1" ]; then
            modo=publico
          fi
          python3 scripts/auditar_frontera_qa.py "$modo"             dist/salida/godot-linux/SIGA-98.x86_64             dist/salida/godot-windows/SIGA-98.exe

      - name: Adjuntar alpha Linux
        uses: actions/upload-artifact@v4
        with:
          name: SIGA-98-godot-alpha-linux
          path: dist/salida/SIGA-98-godot-alpha-linux.zip
          if-no-files-found: error

      - name: Adjuntar alpha Windows
        uses: actions/upload-artifact@v4
        with:
          name: SIGA-98-godot-alpha-windows
          path: dist/salida/SIGA-98-godot-alpha-windows.zip
          if-no-files-found: error

      - name: Adjuntar checksums
        uses: actions/upload-artifact@v4
        with:
          name: SIGA-98-godot-alpha-checksums
          path: dist/salida/SIGA-98-godot-alpha-SHA256SUMS.txt
          if-no-files-found: error

  publicar-playtest-continuo:
    # En main mantenemos un canal QA descargable con URLs estables. No mueve
    # releases versionadas ni publica en itch.io.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: export-alpha
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Recoger los artefactos exportados
        uses: actions/download-artifact@v4
        with:
          pattern: SIGA-98-godot-alpha-*
          merge-multiple: true
          path: salida

      - name: Preparar nombres, checksums y metadatos del canal
        shell: bash
        run: |
          set -euo pipefail

          mv salida/SIGA-98-godot-alpha-linux.zip salida/SIGA-98-playtest-linux.zip
          mv salida/SIGA-98-godot-alpha-windows.zip salida/SIGA-98-playtest-windows.zip

          cp scripts/playtest.sh salida/Actualizar-SIGA98.sh
          cp scripts/playtest.ps1 salida/Actualizar-SIGA98.ps1
          cp scripts/playtest.cmd salida/Actualizar-SIGA98.cmd

          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          destino = Path("salida/SIGA-98-Actualizador-Windows.zip")
          with zipfile.ZipFile(destino, "w", zipfile.ZIP_DEFLATED) as zf:
              zf.write("scripts/playtest.cmd", "Actualizar-SIGA98.cmd")
              zf.write("scripts/playtest.ps1", "Actualizar-SIGA98.ps1")
          PY

          (
            cd salida
            sha256sum \
              SIGA-98-playtest-linux.zip \
              SIGA-98-playtest-windows.zip \
              SIGA-98-Actualizador-Windows.zip \
              Actualizar-SIGA98.sh \
              Actualizar-SIGA98.ps1 \
              Actualizar-SIGA98.cmd \
              > SIGA-98-playtest-SHA256SUMS.txt
          )

          python3 - <<'PY'
          from datetime import datetime, timezone
          import json
          import os
          from pathlib import Path

          sha = os.environ["GITHUB_SHA"]
          run_id = int(os.environ["GITHUB_RUN_ID"])
          datos = {
              "channel": "playtest-latest",
              "sha": sha,
              "short_sha": sha[:12],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "ref": os.environ["GITHUB_REF"],
              "run_id": run_id,
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "run_url": (
                  f"https://github.com/{os.environ['GITHUB_REPOSITORY']}"
                  f"/actions/runs/{run_id}"
              ),
              "built_at": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "assets": {
                  "linux": "SIGA-98-playtest-linux.zip",
                  "windows": "SIGA-98-playtest-windows.zip",
                  "windows_updater": "SIGA-98-Actualizador-Windows.zip",
                  "windows_cmd": "Actualizar-SIGA98.cmd",
                  "windows_powershell": "Actualizar-SIGA98.ps1",
                  "linux_updater": "Actualizar-SIGA98.sh",
                  "checksums": "SIGA-98-playtest-SHA256SUMS.txt",
              },
          }
          Path("salida/SIGA-98-playtest-build.json").write_text(
              json.dumps(datos, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          cat > "$RUNNER_TEMP/playtest-notes.md" <<EOF
          Canal continuo de QA para playtesting humano sobre main.

          Build actual: $GITHUB_SHA
          Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Para testers Windows sin Git:
          1. descarga SIGA-98-Actualizador-Windows.zip;
          2. extrae sus dos archivos;
          3. haz doble clic en Actualizar-SIGA98.cmd.

          Para Linux sin clonar el repo:
          descarga Actualizar-SIGA98.sh y ejecuta:
          bash Actualizar-SIGA98.sh

          El tag playtest-latest es un ancla estable del canal, no el identificador
          del código contenido en cada actualización. La fuente de verdad de la
          build es SIGA-98-playtest-build.json y BUILD-INFO.txt dentro de cada ZIP.

          Este canal no sustituye las releases versionadas v* ni publica en itch.io.
          EOF

      - name: Crear o actualizar la prerelease rodante
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          canal="playtest-latest"
          corto="${GITHUB_SHA:0:12}"

          if gh release view "$canal" >/dev/null 2>&1; then
            gh release edit "$canal" \
              --title "Playtest continuo · $corto" \
              --notes-file "$RUNNER_TEMP/playtest-notes.md" \
              --prerelease
          else
            gh release create "$canal" \
              --target "$GITHUB_SHA" \
              --title "Playtest continuo · $corto" \
              --notes-file "$RUNNER_TEMP/playtest-notes.md" \
              --prerelease
          fi

          gh release upload "$canal" \
            salida/SIGA-98-playtest-linux.zip \
            salida/SIGA-98-playtest-windows.zip \
            salida/SIGA-98-Actualizador-Windows.zip \
            salida/Actualizar-SIGA98.sh \
            salida/Actualizar-SIGA98.ps1 \
            salida/Actualizar-SIGA98.cmd \
            salida/SIGA-98-playtest-SHA256SUMS.txt \
            salida/SIGA-98-playtest-build.json \
            --clobber

  publicar-release:
    # Solo al empujar una etiqueta vX.Y.Z: el resto de disparadores siguen
    # dejando los ZIP como artefactos del run y no publican nada. Esto cierra
    # la mitad que le faltaba a #112 — exportar ya funcionaba; publicar, no.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: export-alpha
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Recoger los artefactos exportados
        uses: actions/download-artifact@v4
        with:
          pattern: SIGA-98-godot-alpha-*
          merge-multiple: true
          path: salida

      - name: Comprobar los checksums antes de publicar
        shell: bash
        run: |
          set -euo pipefail
          cd salida
          ls -l
          sha256sum --check --strict SIGA-98-godot-alpha-SHA256SUMS.txt

      - name: Publicar la release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            salida/SIGA-98-godot-alpha-linux.zip
            salida/SIGA-98-godot-alpha-windows.zip
            salida/SIGA-98-godot-alpha-SHA256SUMS.txt
          fail_on_unmatched_files: true
          draft: true
          generate_release_notes: true
