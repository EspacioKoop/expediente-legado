name: Evidencia Juicio #779

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/evidencia-juicio-779.yml'
      - 'godot/guion/juicio_simbolico.gd'
      - 'godot/guion/juicio_simbolico_3d.gd'
      - 'godot/guion/juicio_combate_3d.gd'
      - 'godot/pruebas/capturar_juicio_779.gd'

permissions:
  contents: write

concurrency:
  group: evidencia-juicio-779-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  capturas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          lfs: true
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Migrar aviso al catálogo de traducción
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          script = Path('godot/guion/juicio_combate_3d.gd')
          source = script.read_text(encoding='utf-8')
          old = '_etiqueta_ataque.text = "ATAQUE INMINENTE"'
          new = '_etiqueta_ataque.text = tr("VENTANILLA_ATAQUE_INMINENTE")'
          if old in source:
              source = source.replace(old, new, 1)
              script.write_text(source, encoding='utf-8')
          elif new not in source:
              raise SystemExit('No se encontró la asignación esperada del aviso')

          catalogo = Path('godot/datos/textos.csv')
          texto = catalogo.read_text(encoding='utf-8')
          fila = 'VENTANILLA_ATAQUE_INMINENTE,ATAQUE INMINENTE\n'
          if 'VENTANILLA_ATAQUE_INMINENTE,' not in texto:
              ancla = 'VENTANILLA_ATENDIDA,RECLAMACIÓN ATENDIDA. Racha: %d.\n'
              if ancla not in texto:
                  raise SystemExit('No se encontró el ancla de Ventanilla en textos.csv')
              texto = texto.replace(ancla, fila + ancla, 1)
              catalogo.write_text(texto, encoding='utf-8')
          PY

      - name: Instalar RGBDS fijado
        shell: bash
        env:
          RGBDS_VERSION: v1.0.3
          RGBDS_SHA256: 280a52061a0c516999bee75ac357628d6d50784309e0486cef25f7460e6f330b
        run: |
          set -euo pipefail
          url="https://github.com/gbdev/rgbds/releases/download/${RGBDS_VERSION}/rgbds-linux-x86_64.tar.xz"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/rgbds.tar.xz" "$url"
          echo "${RGBDS_SHA256}  $RUNNER_TEMP/rgbds.tar.xz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/rgbds"
          tar -xJf "$RUNNER_TEMP/rgbds.tar.xz" -C "$RUNNER_TEMP/rgbds"
          (cd "$RUNNER_TEMP/rgbds" && sudo ./install.sh)

      - name: Compilar GDExtension requerida por el proyecto
        run: bash scripts/preparar_emulador_gb.sh linux-debug

      - name: Instalar el motor declarado por el proyecto
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat .godot-version)"
          archivo="Godot_v${version}_linux.x86_64.zip"
          base="https://github.com/godotengine/godot-builds/releases/download/${version}"
          curl --fail --location --retry 3 "$base/$archivo" -o "$RUNNER_TEMP/$archivo"
          curl --fail --location --retry 3 "$base/SHA512-SUMS.txt" -o "$RUNNER_TEMP/SHA512-SUMS.txt"
          cd "$RUNNER_TEMP"
          grep -F " $archivo" SHA512-SUMS.txt | sha512sum --check --strict
          unzip -q "$archivo"
          mkdir -p godot-bin
          mv "Godot_v${version}_linux.x86_64" godot-bin/godot4
          chmod +x godot-bin/godot4
          echo "$RUNNER_TEMP/godot-bin" >> "$GITHUB_PATH"

      - name: Importar proyecto y registrar clases globales
        shell: bash
        run: godot4 --headless --language es --path godot --editor --import --quit

      - name: Generar capturas del Juicio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/juicio-779"
          xvfb-run -a godot4 --language es --path godot --script res://pruebas/capturar_juicio_779.gd -- "$RUNNER_TEMP/juicio-779"
          for estado in luna-minotauro justicia-duat fuerza-aquiles telegraph-ataque; do
            test -s "$RUNNER_TEMP/juicio-779/$estado.png"
          done

      - name: Publicar PNG originales como artifact
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-juicio-779
          path: ${{ runner.temp }}/juicio-779/*.png
          retention-days: 90

      - name: Incorporar migración de texto si cambia
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- godot/guion/juicio_combate_3d.gd godot/datos/textos.csv)" ]]; then
            echo 'El aviso ya usa el catálogo.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add godot/guion/juicio_combate_3d.gd godot/datos/textos.csv
          git commit -m 'fix: localiza el aviso de ataque de #779'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
