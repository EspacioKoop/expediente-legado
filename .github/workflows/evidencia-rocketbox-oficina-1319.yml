name: Evidencia Rocketbox oficina 1319

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/evidencia-rocketbox-oficina-1319.yml'
      - 'godot/guion/companero_idle_3d.gd'
      - 'godot/guion/animaciones_rocketbox.gd'
      - 'godot/guion/animaciones_ual.gd'
      - 'godot/assets/modelos/rocketbox/**'
      - 'godot/pruebas/capturar_rocketbox_oficina_1319.gd'
      - 'scripts/test_evidencia_rocketbox_oficina_1319.py'
      - 'docs/evidencias/rocketbox-oficina-1319/**'
      - '.godot-version'
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/evidencia-rocketbox-oficina-1319.yml'
      - 'godot/guion/companero_idle_3d.gd'
      - 'godot/guion/animaciones_rocketbox.gd'
      - 'godot/guion/animaciones_ual.gd'
      - 'godot/assets/modelos/rocketbox/**'
      - 'godot/pruebas/capturar_rocketbox_oficina_1319.gd'
      - 'scripts/test_evidencia_rocketbox_oficina_1319.py'
      - 'docs/evidencias/rocketbox-oficina-1319/**'
      - '.godot-version'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Instalar Godot declarado por el proyecto
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat .godot-version)"
          archivo="Godot_v${version}_linux.x86_64.zip"
          base="https://github.com/godotengine/godot-builds/releases/download/${version}"
          curl --fail --location --retry 3 "$base/$archivo" -o "$RUNNER_TEMP/$archivo"
          curl --fail --location --retry 3 "$base/SHA512-SUMS.txt" -o "$RUNNER_TEMP/SHA512-SUMS.txt"
          cd "$RUNNER_TEMP"
          grep -F " $archivo" SHA512-SUMS.txt | sha512sum --check --strict
          unzip -q "$archivo"
          mkdir -p godot-bin
          mv "Godot_v${version}_linux.x86_64" godot-bin/godot4
          chmod +x godot-bin/godot4
          echo "$RUNNER_TEMP/godot-bin" >> "$GITHUB_PATH"

      - name: Contrato del gate
        run: python -m unittest scripts.test_evidencia_rocketbox_oficina_1319

      - name: Importar proyecto
        run: godot4 --headless --editor --path godot --quit

      - name: Preparar preview Vulkan software
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libvulkan1 mesa-vulkan-drivers vulkan-tools
          lvp="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' | head -n 1)"
          test -n "$lvp"
          echo "VK_DRIVER_FILES=$lvp" >> "$GITHUB_ENV"
          VK_DRIVER_FILES="$lvp" xvfb-run -a vulkaninfo --summary

      - name: Generar matriz Rocketbox de oficina
        shell: bash
        run: |
          set -euo pipefail
          salida="$GITHUB_WORKSPACE/dist/evidencia-rocketbox-oficina-1319"
          rm -rf "$salida"
          mkdir -p "$salida"
          xvfb-run -a godot4 --rendering-method forward_plus --path godot             --script res://pruebas/capturar_rocketbox_oficina_1319.gd -- "$salida"

          for estado in pie sentado telefono conversacion; do
            test -s "$salida/$estado.png"
          done
          test -s "$salida/manifest.json"
          test -s "$salida/README.md"

          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("dist/evidencia-rocketbox-oficina-1319/manifest.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          assert data["issue"] == 1319
          assert data["gpu_real"] is False
          assert len(data["casos"]) == 4
          assert {c["estado"] for c in data["casos"]} == {"pie", "sentado", "telefono", "conversacion"}
          assert all(c["clip"].startswith("rocketbox/") for c in data["casos"])
          PY

      - name: Adjuntar preview de #1319
        uses: actions/upload-artifact@v4
        with:
          name: SIGA-98-rocketbox-oficina-1319-${{ github.sha }}
          path: dist/evidencia-rocketbox-oficina-1319
          if-no-files-found: error
          retention-days: 14
