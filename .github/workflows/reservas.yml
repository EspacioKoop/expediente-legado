name: Reservas

on:
  pull_request_target:
    types: [closed]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

# Serializa para no publicar RELEASE duplicados. Ojo: GitHub guarda solo UNA
# ejecución pendiente por grupo y cancela las demás aunque cancel-in-progress
# sea false, así que en una ráfaga de merges se pierden las del medio. Por eso
# --pr también recupera cualquier reserva de PR ya cerrada (#1512).
concurrency:
  group: reservas-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  gestionar:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # pull_request_target es deliberado y no ejecuta código del head de la PR.
      # Incluso workflow_dispatch hace checkout fijo de main antes de usar issues:write.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: main

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Regresión del gestor de reservas
        run: |
          python -m unittest discover -s scripts -p 'test_gestionar_reservas*.py'
          python scripts/test_check_reservas_capacity.py

      - name: Liberar reserva de PR cerrada
        if: github.event_name == 'pull_request_target'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python scripts/gestionar_reservas_rollover.py --pr "$PR_NUMBER"

      - name: Barrer leases y migrar reservas legacy
        if: github.event_name != 'pull_request_target'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/gestionar_reservas_rollover.py
          --sweep
          --legacy-cutoff 2026-09-15T04:06:30Z

      - name: Vigilar capacidad del registro activo
        if: github.event_name != 'pull_request_target'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_reservas_capacity.py
