name: Secretos

# Gate de credenciales (#1796). El repositorio es público y varias ramas llegan
# de agentes autónomos: un token empujado queda expuesto aunque luego se borre,
# así que se escanean los commits nuevos de cada PR y de cada push a main, y el
# historial completo una vez por semana por si cambian las reglas de gitleaks.

on:
  pull_request:
  push:
    branches: [ main ]
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secretos-${{ github.event.pull_request.number || github.ref }}
  # En main cada push trae su propio rango: cancelar uno dejaría commits sin
  # escanear. En un PR el rango nuevo ya contiene los commits del anterior.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Autoprueba del gate
        run: bash scripts/escanear_secretos.sh --autoprueba

      - name: Escanear commits
        env:
          EVENTO: ${{ github.event_name }}
          BASE_PR: ${{ github.event.pull_request.base.sha }}
          HEAD_PR: ${{ github.event.pull_request.head.sha }}
          ANTES: ${{ github.event.before }}
          DESPUES: ${{ github.sha }}
        run: |
          case "$EVENTO" in
            pull_request)
              bash scripts/escanear_secretos.sh "$BASE_PR..$HEAD_PR"
              ;;
            push)
              # Un push que crea la rama trae `before` a ceros: no hay rango.
              if [[ "$ANTES" =~ ^0+$ ]]; then
                bash scripts/escanear_secretos.sh --todo
              else
                bash scripts/escanear_secretos.sh "$ANTES..$DESPUES"
              fi
              ;;
            *)
              bash scripts/escanear_secretos.sh --todo
              ;;
          esac
