name: Evidencia inicio 830

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/evidencia-inicio-830.yml'
      - '.github/actions/upload-artifact/**'
      - '.godot-version'
      - 'godot/escenas/inicio.tscn'
      - 'godot/guion/inicio_app.gd'
      - 'godot/guion/inicio_diorama_3d.gd'
      - 'godot/guion/ventana_exterior_3d.gd'
      - 'godot/arte/crt_menu_inicio.gdshader'
      - 'godot/pruebas/capturar_inicio_830.gd'
      - 'scripts/test_evidencia_inicio_830.py'
      - 'docs/evidencias/inicio-830/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evidencia:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      GALLIUM_DRIVER: llvmpipe
      XDG_DATA_HOME: ${{ github.workspace }}/.tmp-evidencia-830/data
      XDG_CONFIG_HOME: ${{ github.workspace }}/.tmp-evidencia-830/config
      XDG_CACHE_HOME: ${{ github.workspace }}/.tmp-evidencia-830/cache
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Instalar Godot declarado por el proyecto
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat .godot-version)"
          archivo="Godot_v${version}_linux.x86_64.zip"
          base="https://github.com/godotengine/godot-builds/releases/download/${version}"
          curl --fail --location --retry 3 "$base/$archivo" -o "$RUNNER_TEMP/$archivo"
          curl --fail --location --retry 3 "$base/SHA512-SUMS.txt" -o "$RUNNER_TEMP/SHA512-SUMS.txt"
          cd "$RUNNER_TEMP"
          grep -F " $archivo" SHA512-SUMS.txt | sha512sum --check --strict
          unzip -q "$archivo"
          mkdir -p godot-bin
          mv "Godot_v${version}_linux.x86_64" godot-bin/godot4
          chmod +x godot-bin/godot4
          echo "$RUNNER_TEMP/godot-bin" >> "$GITHUB_PATH"

      - name: Importar proyecto
        run: godot4 --headless --editor --path godot --quit

      - name: Validar contrato de evidencia
        run: python3 -m unittest -v scripts/test_evidencia_inicio_830.py

      - name: Renderizar menú normal y reducido
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidencia-inicio-830 "$XDG_DATA_HOME" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME"
          xvfb-run -a godot4 --path godot --rendering-method gl_compatibility \
            --script res://pruebas/capturar_inicio_830.gd -- \
            "$GITHUB_WORKSPACE/evidencia-inicio-830"
          test -s evidencia-inicio-830/inicio-normal.png
          test -s evidencia-inicio-830/inicio-reduccion-movimiento.png
          test -s evidencia-inicio-830/manifest.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("evidencia-inicio-830/manifest.json").read_text(encoding="utf-8"))
          if manifest["issue"] != 830 or manifest["veredicto_automatico"] is not False:
              raise SystemExit("manifiesto inválido para #830")
          if manifest["resolucion"] != [1920, 1080]:
              raise SystemExit("la evidencia no usa 1920x1080")
          archivos = {captura["archivo"] for captura in manifest["capturas"]}
          esperados = {"inicio-normal.png", "inicio-reduccion-movimiento.png"}
          if archivos != esperados:
              raise SystemExit(f"capturas inesperadas: {sorted(archivos)}")
          print("2/2 estados del menú listos para revisión humana")
          PY

      - name: Adjuntar evidencia visual de #830
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: evidencia-inicio-830-${{ github.sha }}
          path: evidencia-inicio-830/
          if-no-files-found: error
          retention-days: 14
