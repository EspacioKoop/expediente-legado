name: Agents CI

on:
  push:
    branches: [ main ]
    paths:
      - 'agents/**'
      - '.github/workflows/agents-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'agents/**'
      - '.github/workflows/agents-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agents-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  agents-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detectar scripts en agents/
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          has_python="false"
          has_shell="false"

          if [[ -d "agents" ]]; then
            if find agents -type f -name "*.py" | grep -q .; then
              has_python="true"
            fi
            if find agents -type f -name "*.sh" | grep -q .; then
              has_shell="true"
            fi
          fi

          echo "has_python=$has_python" >> "$GITHUB_OUTPUT"
          echo "has_shell=$has_shell" >> "$GITHUB_OUTPUT"
          echo "Detección en agents/: python=$has_python, shell=$has_shell"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.detect.outputs.has_python == 'true'
        with:
          python-version: '3.11'

      - name: Instalar herramientas Python
        if: steps.detect.outputs.has_python == 'true'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install ruff flake8 pytest

      - name: Linter Python (ruff)
        if: steps.detect.outputs.has_python == 'true'
        shell: bash
        run: ruff check agents/

      - name: Linter Python (flake8)
        if: steps.detect.outputs.has_python == 'true'
        shell: bash
        run: flake8 agents/

      - name: Pruebas Python (pytest)
        if: steps.detect.outputs.has_python == 'true'
        shell: bash
        run: pytest agents/

      - name: Linter Shell (shellcheck)
        if: steps.detect.outputs.has_shell == 'true'
        shell: bash
        run: shellcheck $(find agents -type f -name "*.sh")
