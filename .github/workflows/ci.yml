name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - id: scope
        name: Resolver alcance de CI
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == pull_request ]]; then
            # El merge ref puede haberse refrescado contra un main más nuevo que
            # el payload original del PR. El merge-base actual aísla el diff del
            # PR y evita ejecutar Godot por merges ajenos.
            git fetch origin main --no-tags
            base="$(git merge-base HEAD origin/main)"
          elif [[ "$EVENT_NAME" == push && -n "${EVENT_BEFORE:-}" && ! "$EVENT_BEFORE" =~ ^0+$ ]]; then
            base="$EVENT_BEFORE"
          else
            git fetch origin main --no-tags
            base="$(git merge-base HEAD origin/main)"
          fi
          echo "Base CI: $base"
          python scripts/ci_scope.py --base "$base" --head HEAD --github-output "$GITHUB_OUTPUT"

      - name: Preflight GDScript fail-fast
        if: steps.scope.outputs.mode == 'full'
        shell: bash
        env:
          SIGA98_GDSCRIPT_FAST: '1'
        run: bash scripts/check_gdscript.sh

      - name: Preflight infra rápido
        if: steps.scope.outputs.mode == 'fast'
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s scripts -p 'test_agent_*.py'
          python scripts/test_ci_scope.py
          python scripts/test_deno_production_freshness.py
          python scripts/test_parte_incidencias.py
          python scripts/test_workflows_yaml.py
          if [[ -f scripts/test_deno_deploy_workflow.py ]]; then
            python scripts/test_deno_deploy_workflow.py
          fi

      - name: Materializar LFS para CI completo
        if: steps.scope.outputs.mode == 'full'
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull

      - name: Instalar RGBDS fijado
        if: steps.scope.outputs.mode == 'full'
        shell: bash
        env:
          RGBDS_VERSION: v1.0.3
          RGBDS_SHA256: 280a52061a0c516999bee75ac357628d6d50784309e0486cef25f7460e6f330b
        run: |
          set -euo pipefail
          url="https://github.com/gbdev/rgbds/releases/download/${RGBDS_VERSION}/rgbds-linux-x86_64.tar.xz"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/rgbds.tar.xz" "$url"
          echo "${RGBDS_SHA256}  $RUNNER_TEMP/rgbds.tar.xz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/rgbds"
          tar -xJf "$RUNNER_TEMP/rgbds.tar.xz" -C "$RUNNER_TEMP/rgbds"
          (cd "$RUNNER_TEMP/rgbds" && sudo ./install.sh)
          rgbasm --version

      - name: Compilar núcleo GB y ROM propia
        if: steps.scope.outputs.mode == 'full'
        shell: bash
        run: |
          bash scripts/preparar_emulador_gb.sh linux-debug
          bash scripts/preparar_emulador_gb.sh rom

      - name: Instalar el motor declarado por el proyecto
        if: steps.scope.outputs.mode == 'full'
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat .godot-version)"
          archivo="Godot_v${version}_linux.x86_64.zip"
          base="https://github.com/godotengine/godot-builds/releases/download/${version}"
          curl --fail --location --retry 3 "$base/$archivo" -o "$RUNNER_TEMP/$archivo"
          curl --fail --location --retry 3 "$base/SHA512-SUMS.txt" -o "$RUNNER_TEMP/SHA512-SUMS.txt"
          cd "$RUNNER_TEMP"
          grep -F " $archivo" SHA512-SUMS.txt | sha512sum --check --strict
          unzip -q "$archivo"
          mkdir -p godot-bin
          mv "Godot_v${version}_linux.x86_64" godot-bin/godot4
          chmod +x godot-bin/godot4
          echo "$RUNNER_TEMP/godot-bin" >> "$GITHUB_PATH"

      - name: Preflight GDScript canónico
        if: steps.scope.outputs.mode == 'full'
        shell: bash
        # El script formatea, lintea y ejecuta la suite de scripts/. Aquí la
        # GDExtension ya está compilada, así que su ausencia sería un entorno
        # roto y no un salto legítimo: se exige.
        env:
          SIGA98_EXIGIR_EXTENSION: '1'
        run: bash scripts/check_gdscript.sh

      - name: Importar, ejecutar la suite y arrancar el juego
        if: steps.scope.outputs.mode == 'full'
        run: python scripts/verificar_godot.py

      - name: Arrancar Caza Píxeles 98 en el núcleo nativo
        if: steps.scope.outputs.mode == 'full'
        run: godot4 --headless --path godot --script res://pruebas/emulador_gb_smoke.gd

      - name: Arrancar una ROM GB clásica en el núcleo nativo
        if: steps.scope.outputs.mode == 'full'
        shell: bash
        run: |
          make -C gbc/fixtures/dmg_only_smoke clean all
          godot4 --headless --path godot --script res://pruebas/emulador_dmg_smoke.gd \
            -- "$GITHUB_WORKSPACE/gbc/fixtures/dmg_only_smoke/build/dmg_only_smoke.gb"

      - name: Arrancar la ROM CGB-only en el núcleo nativo
        if: steps.scope.outputs.mode == 'full'
        shell: bash
        run: |
          make -C gbc/fixtures/cgb_only_smoke clean all
          godot4 --headless --path godot --script res://pruebas/emulador_gbc_smoke.gd \
            -- "$GITHUB_WORKSPACE/gbc/fixtures/cgb_only_smoke/build/cgb_only_smoke.gbc"

      - name: Verificar paletas GB sin recolorear CGB
        if: steps.scope.outputs.mode == 'full'
        shell: bash
        run: |
          godot4 --headless --path godot --script res://pruebas/emulador_paletas_gb_smoke.gd \
            -- "$GITHUB_WORKSPACE/gbc/fixtures/dmg_only_smoke/build/dmg_only_smoke.gb" \
               "$GITHUB_WORKSPACE/gbc/fixtures/cgb_only_smoke/build/cgb_only_smoke.gbc"

      - name: Persistir y aislar SRAM por ROM al cerrar la portátil
        if: steps.scope.outputs.mode == 'full'
        shell: bash
        run: |
          make -C gbc/fixtures/sram_persist_smoke clean all
          godot4 --headless --path godot --script res://pruebas/emulador_sram_smoke.gd \
            -- "$GITHUB_WORKSPACE/gbc/fixtures/sram_persist_smoke/build/sram_a.gbc" \
               "$GITHUB_WORKSPACE/gbc/fixtures/sram_persist_smoke/build/sram_b.gbc"

      - name: Pantalla legible de las ROMs propias en el núcleo nativo
        if: steps.scope.outputs.mode == 'full'
        shell: bash
        # Mismo núcleo que la Portátil Color 98 (#805): arranca cada ROM, pulsa
        # Start y falla si el fondo visible está lleno de tiles sueltos.
        run: |
          shopt -s nullglob
          roms=("$GITHUB_WORKSPACE"/godot/roms/*.gbc)
          if (( ${#roms[@]} == 0 )); then
            echo "No hay ROMs propias compiladas en godot/roms" >&2
            exit 1
          fi
          godot4 --headless --path godot --script res://pruebas/roms_pantalla_smoke.gd -- "${roms[@]}"
