name: Cata ambientes 119

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/cata-ambientes-119.yml'
      - 'referencia/audio/ambientes_originales/**'
      - 'scripts/generar_ambientes_originales.py'
      - 'scripts/preparar_cata_ambientes.py'
      - 'scripts/test_ambientes_originales.py'
      - 'scripts/test_cata_ambientes_originales.py'
      - 'docs/audio/cata-ambientes-119.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cata:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar FFmpeg
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version > "$RUNNER_TEMP/ffmpeg-version.txt"
          head -n 1 "$RUNNER_TEMP/ffmpeg-version.txt"
          command -v ffprobe

      - name: Validar fuentes y herramienta de cata
        run: |
          python3 scripts/test_ambientes_originales.py
          python3 -m unittest -v scripts/test_cata_ambientes_originales.py

      - name: Generar paquete de escucha
        run: |
          set -euo pipefail
          python3 scripts/preparar_cata_ambientes.py \
            --destino cata-ambientes-119 \
            --repeticiones 8
          test -s cata-ambientes-119/manifest.json
          test -s cata-ambientes-119/cata.m3u
          test -s cata-ambientes-119/REVISION.md
          test "$(find cata-ambientes-119 -maxdepth 1 -name '*.ogg' | wc -l)" -eq 4
          for audio in cata-ambientes-119/*.ogg; do
            ffprobe -v error -show_entries format=duration \
              -of default=noprint_wrappers=1:nokey=1 "$audio"
          done

      - name: Adjuntar cata para revisión humana
        uses: actions/upload-artifact@v4
        with:
          name: cata-ambientes-119-${{ github.sha }}
          path: cata-ambientes-119/
          if-no-files-found: error
          retention-days: 14
