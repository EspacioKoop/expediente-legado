name: Agent review · Euriclea

# Revisora independiente de los drafts del pool (#1802). Barre las PRs
# `agent/*` y revisa cada SHA una vez con la cadena principal. Si nadie
# responde, deja `revision:pendiente` para el respaldo local (el mismo script en
# el PC, lanzado por el cron de Hermes) o para el nivel 2. Sin candidatas no
# conecta Tailscale ni llama a ningún modelo: vigilar sale gratis.

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR concreta que revisar (aunque ya tenga revisión)'
        required: false
        default: ''

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: agent-review
  cancel-in-progress: false

jobs:
  euriclea:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ inputs.pr }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: cand
        name: Buscar drafts del pool sin revisar
        run: |
          set -euo pipefail
          if [[ -n "$PR" ]]; then
            echo "hay=true" >> "$GITHUB_OUTPUT"
          else
            python3 scripts/agent_euriclea.py candidatas --nivel principal --github-output "$GITHUB_OUTPUT"
          fi

      - name: Revisar
        if: steps.cand.outputs.hay == 'true'
        env:
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          QWEN_BASE_URL: ${{ vars.QWEN_BASE_URL }}
          QWEN_MODEL: ${{ vars.QWEN_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          set -euo pipefail
          if [[ -n "$PR" ]]; then
            python3 scripts/agent_euriclea.py barrer --nivel principal --pr "$PR"
          else
            python3 scripts/agent_euriclea.py barrer --nivel principal --max 3
          fi
