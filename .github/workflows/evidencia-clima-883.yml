name: Evidencia clima #883

on:
  push:
    branches: [ feat/883-clima-v2 ]
    paths:
      - '.github/workflows/evidencia-clima-883.yml'

permissions:
  contents: write

jobs:
  capturas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/883-clima-v2
          lfs: true
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pulir acumulaciones y legibilidad de precipitación
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('godot/guion/dia_clima_visual_app.gd')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'material.albedo_color = Color(0.78, 0.84, 0.92, 0.24)': 'material.albedo_color = Color(0.78, 0.84, 0.92, 0.34)',
              'material.albedo_color = Color(0.88, 0.92, 0.98, 0.62)': 'material.albedo_color = Color(0.86, 0.90, 0.96, 0.28)',
              'material.albedo_color = Color(0.025, 0.055, 0.09, 0.24)': 'material.albedo_color = Color(0.025, 0.055, 0.09, 0.18)',
              'var cantidad := 16 if nieve else 11': 'var cantidad := 24 if nieve else 12',
              '0.75 + float((indice * 17) % 12) / 10.0': '0.42 + float((indice * 17) % 10) / 20.0',
              '0.70 + float((indice * 23) % 16) / 10.0': '0.36 + float((indice * 23) % 12) / 20.0',
              'disco.top_radius = 0.50': 'disco.top_radius = 0.36',
              'disco.bottom_radius = 0.50': 'disco.bottom_radius = 0.36',
              'disco.radial_segments = 8': 'disco.radial_segments = 12',
          }
          for before, after in replacements.items():
              if before not in text:
                  raise SystemExit(f'No se encontró contrato a pulir: {before}')
              text = text.replace(before, after, 1)
          marker = '\tif material != null:\n\t\tmaterial.albedo_color = ('
          replacement = '\tif material != null:\n\t\tmaterial.shading_mode = BaseMaterial3D.SHADING_MODE_UNSHADED\n\t\tmaterial.billboard_mode = BaseMaterial3D.BILLBOARD_ENABLED\n\t\tmaterial.cull_mode = BaseMaterial3D.CULL_DISABLED\n\t\tmaterial.albedo_color = ('
          if marker not in text:
              raise SystemExit('No se encontró material de precipitación')
          text = text.replace(marker, replacement, 1)
          path.write_text(text, encoding='utf-8')

          tests = Path('scripts/test_clima_visual_797.py')
          test_text = tests.read_text(encoding='utf-8')
          test_text = test_text.replace(
              'self.assertIn("var cantidad := 16 if nieve else 11", self.controlador)',
              'self.assertIn("var cantidad := 24 if nieve else 12", self.controlador)',
          )
          test_text = test_text.replace(
              'self.assertIn("disco.radial_segments = 8", self.controlador)',
              'self.assertIn("disco.radial_segments = 12", self.controlador)',
          )
          needle = '        self.assertIn("var viento := 0.35 if _reduccion_movimiento else 1.0", self.controlador)\n'
          insert = needle + '        self.assertIn("material.billboard_mode = BaseMaterial3D.BILLBOARD_ENABLED", self.controlador)\n        self.assertIn("material.shading_mode = BaseMaterial3D.SHADING_MODE_UNSHADED", self.controlador)\n'
          if needle not in test_text:
              raise SystemExit('No se encontró punto de inserción de pruebas billboard')
          test_text = test_text.replace(needle, insert, 1)
          tests.write_text(test_text, encoding='utf-8')
          PY
          python -m pip install --disable-pip-version-check 'gdtoolkit==4.3.4'
          gdformat godot/guion/dia_clima_visual_app.gd
          gdformat --check godot/guion/dia_clima_visual_app.gd
          gdlint godot/guion/dia_clima_visual_app.gd
          python -m unittest scripts.test_clima_visual_797

      - name: Instalar RGBDS fijado
        shell: bash
        env:
          RGBDS_VERSION: v1.0.3
          RGBDS_SHA256: 280a52061a0c516999bee75ac357628d6d50784309e0486cef25f7460e6f330b
        run: |
          set -euo pipefail
          url="https://github.com/gbdev/rgbds/releases/download/${RGBDS_VERSION}/rgbds-linux-x86_64.tar.xz"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/rgbds.tar.xz" "$url"
          echo "${RGBDS_SHA256}  $RUNNER_TEMP/rgbds.tar.xz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/rgbds"
          tar -xJf "$RUNNER_TEMP/rgbds.tar.xz" -C "$RUNNER_TEMP/rgbds"
          (cd "$RUNNER_TEMP/rgbds" && sudo ./install.sh)

      - name: Compilar GDExtension requerida por el proyecto
        run: bash scripts/preparar_emulador_gb.sh linux-debug

      - name: Instalar el motor declarado por el proyecto
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat .godot-version)"
          archivo="Godot_v${version}_linux.x86_64.zip"
          base="https://github.com/godotengine/godot-builds/releases/download/${version}"
          curl --fail --location --retry 3 "$base/$archivo" -o "$RUNNER_TEMP/$archivo"
          curl --fail --location --retry 3 "$base/SHA512-SUMS.txt" -o "$RUNNER_TEMP/SHA512-SUMS.txt"
          cd "$RUNNER_TEMP"
          grep -F " $archivo" SHA512-SUMS.txt | sha512sum --check --strict
          unzip -q "$archivo"
          mkdir -p godot-bin
          mv "Godot_v${version}_linux.x86_64" godot-bin/godot4
          chmod +x godot-bin/godot4
          echo "$RUNNER_TEMP/godot-bin" >> "$GITHUB_PATH"

      - name: Importar proyecto y registrar clases globales
        shell: bash
        run: godot4 --headless --path godot --editor --import --quit

      - name: Generar cinco capturas comparables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/climas-883"
          xvfb-run -a godot4 --path godot --script res://pruebas/capturar_climas_797.gd -- "$RUNNER_TEMP/climas-883"
          for estado in despejado nublado lluvia niebla nieve; do
            test -s "$RUNNER_TEMP/climas-883/$estado.png"
          done

      - name: Publicar PNG originales como artifact
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-clima-883-pulida
          path: ${{ runner.temp }}/climas-883/*.png
          retention-days: 90

      - name: Incorporar código y capturas pulidas al PR
        shell: bash
        run: |
          set -euo pipefail
          destino='docs/evidencias/clima-883'
          mkdir -p "$destino"
          cp "$RUNNER_TEMP"/climas-883/*.png "$destino"/
          cat > "$destino/README.md" <<'EOF'
          # Evidencia visual #883 — clima v2

          Capturas generadas por GitHub Actions desde el mismo punto, entrada y orientación mediante `godot/pruebas/capturar_climas_797.gd`.

          | Despejado | Nublado |
          | --- | --- |
          | ![Despejado](despejado.png) | ![Nublado](nublado.png) |

          | Lluvia | Niebla | Nieve |
          | --- | --- | --- |
          | ![Lluvia](lluvia.png) | ![Niebla](niebla.png) | ![Nieve](nieve.png) |

          La revisión visual humana se incorpora después de inspeccionar los PNG originales del artifact `evidencia-clima-883-pulida`.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add godot/guion/dia_clima_visual_app.gd scripts/test_clima_visual_797.py "$destino"
          git commit -m 'fix(clima): suavizar acumulaciones y precipitación (#883)'
          git push origin HEAD:feat/883-clima-v2
