name: GBC fixtures

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/gbc-fixtures.yml"
      - "scripts/test_gbc_fixture_workflow.py"
      - "scripts/inspect_gb_rom.py"
      - "scripts/test_inspect_gb_rom.py"
      - "docs/gbc-fixtures.md"
      - "gbc/fixtures/cgb_only_smoke/**"
      - "gbc/minijuegos/caza_pixeles_98/**"
      - "gbc/minijuegos/paper_planes_98/**"
      - "gbc/minijuegos/croc_riders_98/**"
      - "gbc/minijuegos/aquiles_98/**"
      - "gbc/minijuegos/ryu_flow_98/**"
      - "gbc/minijuegos/jali_98/**"
      - "gbc/minijuegos/vitral_98/**"
      - "gbc/minijuegos/hydra_loop_98/**"
      - "gbc/minijuegos/hydra_loop/assets/**"
      - "gbc/minijuegos/webkeeper_98/**"
      - "gbc/minijuegos/comun/**"
      - "scripts/gbc_imagen_a_tiles.py"

permissions:
  contents: read

env:
  RGBDS_VERSION: v1.0.3
  RGBDS_SHA256: 280a52061a0c516999bee75ac357628d6d50784309e0486cef25f7460e6f330b
  FIXTURES_REPO: https://github.com/tbsp/simple-gb-asm-examples.git
  FIXTURES_COMMIT: 54270e0673ac16452447ff65cca26a1ef42eefec
  CGB_ACID2_REPO: https://github.com/mattcurrie/cgb-acid2.git
  CGB_ACID2_COMMIT: fa5b7f86d6fb599f79e55169494d981a7af75a31
  CGB_ACID2_MGBLIB_COMMIT: 5d829bf2ffa1447dcfd63c5dab2c44488632617e
  CGB_ACID2_RGBDS_REPO: https://github.com/gbdev/rgbds.git
  CGB_ACID2_RGBDS_COMMIT: 0759c98d913e3d4d21207a8886a319c85add2041
  CGB_ACID2_SHA256: 197fb0bcec544f0400527fc707e0a94f55435974986e6986b424ace5de81720e
  UCITY_REPO: https://github.com/AntonioND/ucity.git
  UCITY_TAG: v1.3
  UCITY_COMMIT: d1880a2a112d7c26f16c0fc06a15b6c32fdc9137
  UCITY_URL: https://github.com/AntonioND/ucity/releases/download/v1.3/ucity.gbc
  UCITY_SHA256: 9422ee2ca7b7ea1d46b58b2a429fff3f354dfd3e732dee1e7ae6220f148ce6e0

jobs:
  build-fixtures:
    name: Build GBC fixtures and SIGA-98 ROMs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SIGA-98
        uses: actions/checkout@v4

      - name: Validate workflow contract
        run: python -m unittest scripts.test_gbc_fixture_workflow scripts.test_inspect_gb_rom

      - name: Install pinned RGBDS
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/gbdev/rgbds/releases/download/${RGBDS_VERSION}/rgbds-linux-x86_64.tar.xz"
          curl --fail --location --retry 3 --output rgbds.tar.xz "$url"
          echo "${RGBDS_SHA256}  rgbds.tar.xz" | sha256sum --check --strict
          mkdir rgbds
          tar -xJf rgbds.tar.xz -C rgbds
          (
            cd rgbds
            sudo ./install.sh
          )
          rgbasm --version

      - name: Fetch pinned CC0 fixture sources
        shell: bash
        run: |
          set -euo pipefail
          git init fixture-src
          git -C fixture-src remote add origin "$FIXTURES_REPO"
          git -C fixture-src fetch --depth 1 origin "$FIXTURES_COMMIT"
          git -C fixture-src checkout --detach FETCH_HEAD
          test "$(git -C fixture-src rev-parse HEAD)" = "$FIXTURES_COMMIT"

      - name: Build joypad and vblank
        shell: bash
        run: |
          set -euo pipefail
          for fixture in joypad vblank; do
            (
              cd "fixture-src/src/${fixture}"
              ../build.sh "${fixture}.asm"
            )
          done
          mkdir -p gbc-fixtures
          cp fixture-src/src/joypad/joypad.gb gbc-fixtures/
          cp fixture-src/src/vblank/vblank.gb gbc-fixtures/

      - name: Fetch pinned MIT cgb-acid2 sources
        shell: bash
        run: |
          set -euo pipefail
          git init cgb-acid2-src
          git -C cgb-acid2-src remote add origin "$CGB_ACID2_REPO"
          git -C cgb-acid2-src fetch --depth 1 origin "$CGB_ACID2_COMMIT"
          git -C cgb-acid2-src checkout --detach FETCH_HEAD
          test "$(git -C cgb-acid2-src rev-parse HEAD)" = "$CGB_ACID2_COMMIT"
          git -C cgb-acid2-src submodule update --init --depth 1 mgblib
          test "$(git -C cgb-acid2-src/mgblib rev-parse HEAD)" = "$CGB_ACID2_MGBLIB_COMMIT"

      - name: Build pinned legacy RGBDS for cgb-acid2
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y byacc flex pkg-config libpng-dev
          git init rgbds-legacy-src
          git -C rgbds-legacy-src remote add origin "$CGB_ACID2_RGBDS_REPO"
          git -C rgbds-legacy-src fetch --depth 1 origin "$CGB_ACID2_RGBDS_COMMIT"
          git -C rgbds-legacy-src checkout --detach FETCH_HEAD
          test "$(git -C rgbds-legacy-src rev-parse HEAD)" = "$CGB_ACID2_RGBDS_COMMIT"
          make -C rgbds-legacy-src CFLAGS="-g -fcommon"
          for tool in rgbasm rgblink rgbfix rgbgfx; do
            test -x "rgbds-legacy-src/$tool"
          done

      - name: Build cgb-acid2 with historical RGBDS
        shell: bash
        run: |
          set -euo pipefail
          PATH="$GITHUB_WORKSPACE/rgbds-legacy-src:$PATH" make -C cgb-acid2-src all
          cp cgb-acid2-src/build/cgb-acid2.gbc gbc-fixtures/

      - name: Fetch and verify external uCity v1.3 fixture
        shell: bash
        run: |
          set -euo pipefail
          tag_sha="$(git ls-remote "$UCITY_REPO" "refs/tags/${UCITY_TAG}" | cut -f1)"
          test "$tag_sha" = "$UCITY_COMMIT"
          mkdir -p external-fixtures
          curl --fail --location --retry 3 --output external-fixtures/ucity.gbc "$UCITY_URL"
          echo "${UCITY_SHA256}  external-fixtures/ucity.gbc" | sha256sum --check --strict
          test "$(stat -c %s external-fixtures/ucity.gbc)" -eq 131072
          test "$(od -An -tx1 -j 323 -N 1 external-fixtures/ucity.gbc | tr -d ' \n')" = "c0"
          test "$(od -An -tx1 -j 327 -N 1 external-fixtures/ucity.gbc | tr -d ' \n')" = "1b"
          test "$(od -An -tx1 -j 328 -N 1 external-fixtures/ucity.gbc | tr -d ' \n')" = "02"
          test "$(od -An -tx1 -j 329 -N 1 external-fixtures/ucity.gbc | tr -d ' \n')" = "04"
          python scripts/inspect_gb_rom.py external-fixtures/ucity.gbc --expect-sha256 "$UCITY_SHA256" --compact | tee external-fixtures/ucity.metadata.json

      - name: Build CGB-only smoke fixture
        shell: bash
        run: |
          set -euo pipefail
          make -C gbc/fixtures/cgb_only_smoke clean all
          cp gbc/fixtures/cgb_only_smoke/build/cgb_only_smoke.gbc gbc-fixtures/

      - name: Build Caza Pixeles 98
        shell: bash
        run: |
          set -euo pipefail
          make -C gbc/minijuegos/caza_pixeles_98
          cp gbc/minijuegos/caza_pixeles_98/build/caza_pixeles_98.gbc gbc-fixtures/

      - name: Build Paper Planes 98
        shell: bash
        run: |
          set -euo pipefail
          make -C gbc/minijuegos/paper_planes_98
          cp gbc/minijuegos/paper_planes_98/build/paper_planes_98.gbc gbc-fixtures/

      - name: Build Croc Riders 98
        shell: bash
        run: |
          set -euo pipefail
          make -C gbc/minijuegos/croc_riders_98
          cp gbc/minijuegos/croc_riders_98/build/croc_riders_98.gbc gbc-fixtures/

      - name: Build MYRMIDON 98
        shell: bash
        run: |
          set -euo pipefail
          make -C gbc/minijuegos/aquiles_98 test
          cp gbc/minijuegos/aquiles_98/build/aquiles_98.gbc gbc-fixtures/

      - name: Prepare PyBoy for prototype play-tests
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/pyboy
          /tmp/pyboy/bin/python -m pip install --quiet pyboy==2.6.1

      - name: Build and play-test RYU_FLOW
        shell: bash
        run: |
          set -euo pipefail
          make -C gbc/minijuegos/ryu_flow_98 clean test PYTHON=/tmp/pyboy/bin/python
          cp gbc/minijuegos/ryu_flow_98/build/ryu_flow_98.gbc gbc-fixtures/

      - name: Build and play-test JALI 98
        shell: bash
        run: |
          set -euo pipefail
          make -C gbc/minijuegos/jali_98 clean test PYTHON=/tmp/pyboy/bin/python
          cp gbc/minijuegos/jali_98/build/jali_98.gbc gbc-fixtures/

      - name: Build and play-test VITRAL 98
        shell: bash
        run: |
          set -euo pipefail
          make -C gbc/minijuegos/vitral_98 clean test PYTHON=/tmp/pyboy/bin/python
          cp gbc/minijuegos/vitral_98/build/vitral_98.gbc gbc-fixtures/

      - name: Build and play-test HYDRA LOOP prototype
        shell: bash
        run: |
          set -euo pipefail
          make -C gbc/minijuegos/hydra_loop_98 clean test PYTHON=/tmp/pyboy/bin/python
          cp gbc/minijuegos/hydra_loop_98/build/hydra_loop_98.gbc gbc-fixtures/

      - name: Build and play-test WEBKEEPER 98 prototype
        shell: bash
        run: |
          set -euo pipefail
          make -C gbc/minijuegos/webkeeper_98 clean test PYTHON=/tmp/pyboy/bin/python
          cp gbc/minijuegos/webkeeper_98/build/webkeeper_98.gbc gbc-fixtures/

      - name: Hash and inspect ROM headers
        shell: bash
        run: |
          set -euo pipefail
          (
            cd gbc-fixtures
            sha256sum joypad.gb vblank.gb cgb-acid2.gbc cgb_only_smoke.gbc caza_pixeles_98.gbc paper_planes_98.gbc croc_riders_98.gbc aquiles_98.gbc ryu_flow_98.gbc jali_98.gbc vitral_98.gbc hydra_loop_98.gbc webkeeper_98.gbc | tee SHA256SUMS
            echo "${CGB_ACID2_SHA256}  cgb-acid2.gbc" | sha256sum --check --strict
          )
          : > gbc-fixtures/rom-metadata.jsonl
          for rom in gbc-fixtures/*.gb gbc-fixtures/*.gbc; do
            test -s "$rom"
            size=$(stat -c %s "$rom")
            test "$size" -ge 32768
            printf '%s: %s bytes\n' "$rom" "$size"
            python scripts/inspect_gb_rom.py "$rom" --compact >> gbc-fixtures/rom-metadata.jsonl
          done
          test "$(od -An -tx1 -j 323 -N 1 gbc-fixtures/cgb-acid2.gbc | tr -d ' \n')" = "c0"
          for rom in gbc-fixtures/caza_pixeles_98.gbc gbc-fixtures/paper_planes_98.gbc gbc-fixtures/croc_riders_98.gbc gbc-fixtures/aquiles_98.gbc gbc-fixtures/ryu_flow_98.gbc gbc-fixtures/jali_98.gbc gbc-fixtures/vitral_98.gbc gbc-fixtures/hydra_loop_98.gbc gbc-fixtures/webkeeper_98.gbc; do
            test "$(od -An -tx1 -j 323 -N 1 "$rom" | tr -d ' \n')" = "80"
            # Cartucho estándar (#808): MBC5+RAM+BATTERY con 8 KiB de RAM.
            test "$(od -An -tx1 -j 327 -N 1 "$rom" | tr -d ' \n')" = "1b"
            test "$(od -An -tx1 -j 329 -N 1 "$rom" | tr -d ' \n')" = "02"
          done
          test "$(od -An -tx1 -j 323 -N 1 gbc-fixtures/cgb_only_smoke.gbc | tr -d ' \n')" = "c0"

      - name: Upload ephemeral GBC ROMs
        uses: actions/upload-artifact@v4
        with:
          name: gbc-roms-${{ github.sha }}
          path: |
            gbc-fixtures/joypad.gb
            gbc-fixtures/vblank.gb
            gbc-fixtures/cgb-acid2.gbc
            gbc-fixtures/cgb_only_smoke.gbc
            gbc-fixtures/caza_pixeles_98.gbc
            gbc-fixtures/paper_planes_98.gbc
            gbc-fixtures/croc_riders_98.gbc
            gbc-fixtures/aquiles_98.gbc
            gbc-fixtures/ryu_flow_98.gbc
            gbc-fixtures/jali_98.gbc
            gbc-fixtures/vitral_98.gbc
            gbc-fixtures/hydra_loop_98.gbc
            gbc-fixtures/webkeeper_98.gbc
            gbc-fixtures/SHA256SUMS
            gbc-fixtures/rom-metadata.jsonl
          if-no-files-found: error
          retention-days: 7
