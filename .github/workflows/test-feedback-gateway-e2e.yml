name: Gateway F9 E2E test

on:
  push:
    branches:
      - fix/1462-vercel-root
    paths:
      - .github/workflows/test-feedback-gateway-e2e.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: POST report to production gateway
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            -X POST 'https://expediente-legado.vercel.app/api/report' \
            -H 'Content-Type: application/json' \
            --data-binary '{"source":"siga98-f9","category":"otro","title":"Prueba automática gateway F9 E2E","body":"Prueba end-to-end desde GitHub Actions para verificar Vercel -> GitHub. Este issue debe cerrarse tras validar el flujo."}')"
          echo "$response"
          python - "$response" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          assert data.get("ok") is True, data
          assert isinstance(data.get("issue_number"), int), data
          assert str(data.get("issue_url","")).startswith("https://github.com/EspacioKoop/expediente-legado/issues/"), data
          print("Gateway E2E OK:", data["issue_number"], data["issue_url"])
          PY
