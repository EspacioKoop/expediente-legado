name: Evidencia comercios 676

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/evidencia-comercios-676.yml'
      - '.godot-version'
      - 'godot/arte/bit98/**'
      - 'godot/arte/comercio_barrio/**'
      - 'godot/datos/textos.csv'
      - 'godot/guion/bit98_dressing.gd'
      - 'godot/guion/calle_locales_comerciales_3d.gd'
      - 'godot/guion/comercio_barrio*.gd'
      - 'godot/guion/dia_calle_app.gd'
      - 'godot/guion/espacio_3d.gd'
      - 'godot/guion/modelos.gd'
      - 'godot/escenas/dia.tscn'
      - 'godot/pruebas/capturar_comercios_676.gd'
      - 'scripts/test_evidencia_comercios_676.py'
      - 'docs/evidencias/comercios-676/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evidencia:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      GALLIUM_DRIVER: llvmpipe
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Godot declarado por el proyecto
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat .godot-version)"
          archivo="Godot_v${version}_linux.x86_64.zip"
          base="https://github.com/godotengine/godot-builds/releases/download/${version}"
          curl --fail --location --retry 3 "$base/$archivo" -o "$RUNNER_TEMP/$archivo"
          curl --fail --location --retry 3 "$base/SHA512-SUMS.txt" -o "$RUNNER_TEMP/SHA512-SUMS.txt"
          cd "$RUNNER_TEMP"
          grep -F " $archivo" SHA512-SUMS.txt | sha512sum --check --strict
          unzip -q "$archivo"
          mkdir -p godot-bin
          mv "Godot_v${version}_linux.x86_64" godot-bin/godot4
          chmod +x godot-bin/godot4
          echo "$RUNNER_TEMP/godot-bin" >> "$GITHUB_PATH"

      - name: Importar proyecto
        run: godot4 --headless --editor --path godot --quit

      - name: Validar contrato de evidencia
        run: python3 -m unittest -v scripts/test_evidencia_comercios_676.py

      - name: Renderizar gate visual de comercios sin HUD
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidencia-comercios-676
          xvfb-run -a godot4 --path godot --rendering-method gl_compatibility \
            --script res://pruebas/capturar_comercios_676.gd -- \
            "$GITHUB_WORKSPACE/evidencia-comercios-676"
          for captura in bit98_exterior bit98_interior quiosco_avenida el_trastero; do
            test -s "evidencia-comercios-676/${captura}.png"
          done
          test -s evidencia-comercios-676/manifest.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("evidencia-comercios-676/manifest.json").read_text())
          if manifest["issue"] != 676 or manifest["fase"] != "trayecto":
              raise SystemExit("manifiesto fuera del gate #676")
          if manifest["locale"] != "es" or manifest["hud"] is not False:
              raise SystemExit("la evidencia debe usar locale es y HUD oculto")
          if manifest["camara"] != "jugable" or manifest["veredicto_automatico"] is not False:
              raise SystemExit("la evidencia debe usar cámara jugable sin autoaprobar")
          casos = {caso["id"]: caso for caso in manifest["casos"]}
          esperados = {"bit98_exterior", "bit98_interior", "quiosco_avenida", "el_trastero"}
          if set(casos) != esperados:
              raise SystemExit("faltan encuadres del gate #676")
          if casos["bit98_interior"]["espacio"] != "interior":
              raise SystemExit("Bit 98 interior no fue capturado como interior real")
          hashes = [caso["sha256"] for caso in manifest["casos"]]
          if len(hashes) != 4 or len(set(hashes)) != 4:
              raise SystemExit("las cuatro capturas deben existir y ser distintas")
          if any(not caso["criterio"].strip() for caso in manifest["casos"]):
              raise SystemExit("cada captura debe declarar un criterio humano")
          print("4/4 encuadres de #676 capturados y manifiesto coherente")
          PY

      - name: Adjuntar evidencia visual de #676
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-comercios-676-${{ github.sha }}
          path: evidencia-comercios-676/
          if-no-files-found: error
          retention-days: 14
