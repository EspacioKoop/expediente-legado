name: Deno feedback gateway

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'infra/feedback-deno/**'
      - 'dist/exportar-godot-alpha.sh'
      - '.github/workflows/alpha-playtest.yml'
      - 'scripts/test_parte_incidencias.py'
      - '.github/workflows/feedback-deno.yml'
  push:
    branches: [ main ]
    paths:
      - 'infra/feedback-deno/**'
      - 'dist/exportar-godot-alpha.sh'
      - '.github/workflows/alpha-playtest.yml'
      - 'scripts/test_parte_incidencias.py'
      - '.github/workflows/feedback-deno.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.7
      - name: Formato
        working-directory: infra/feedback-deno
        run: deno fmt --check main.ts agent_pool_state.ts agent_memory.ts agent_memory_test.ts agent_mcp.ts agent_mcp_test.ts deno.json
      - name: Tipos
        working-directory: infra/feedback-deno
        run: deno check main.ts agent_memory_test.ts agent_mcp_test.ts
      - name: Pruebas
        working-directory: infra/feedback-deno
        run: deno task test
