name: Agent CI repair

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: agent-ci-repair-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'agent/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: main

      - name: Registrar PR_READY
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$BRANCH" =~ ^agent/(qwen|gemini)-([0-9]+)-([0-9]+)$ ]]; then exit 0; fi
          provider="${BASH_REMATCH[1]}"
          issue="${BASH_REMATCH[2]}"
          owner="${GITHUB_REPOSITORY%%/*}"
          pr_json="$(gh api -X GET "repos/$GITHUB_REPOSITORY/pulls" -f state=open -f head="$owner:$BRANCH")"
          pr="$(jq -r '.[0].number // empty' <<<"$pr_json")"
          head_repo="$(jq -r '.[0].head.repo.full_name // empty' <<<"$pr_json")"
          head_sha="$(jq -r '.[0].head.sha // empty' <<<"$pr_json")"
          [[ -z "$pr" || "$head_repo" != "$GITHUB_REPOSITORY" || "$head_sha" != "$SHA" ]] && exit 0
          marker="PR_READY issue=#$issue pr=#$pr sha=$SHA"
          python3 scripts/gestionar_reservas_rollover.py --comments-output /tmp/reservas-ready.json
          if ! jq -r '.[].body' /tmp/reservas-ready.json | grep -Fq "$marker"; then
            gh issue comment "$(python3 scripts/gestionar_reservas_rollover.py --active)" --repo "$GITHUB_REPOSITORY" --body "$marker pruebas=CI-canónico-verde limites=PR-draft;sin-validación-humana provider=$provider"
          fi
          gh issue edit "$issue" --repo "$GITHUB_REPOSITORY" --add-label agent:pr-open --remove-label agent:needs-human >/dev/null 2>&1 || true
          gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "Agent autopilot: CI verde en $SHA; PR #$pr queda draft para revisión humana." || true

  repair:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'agent/')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
      pull-requests: read
      actions: write
      id-token: write
    env:
      HAS_QWEN: ${{ secrets.QWEN_API_KEY != '' }}
      HAS_QWEN_ANY: ${{ secrets.QWEN_API_KEY != '' || secrets.QWEN_FALLBACK_1_API_KEY != '' || secrets.QWEN_FALLBACK_2_API_KEY != '' || secrets.QWEN_FALLBACK_3_API_KEY != '' || secrets.QWEN_FALLBACK_4_API_KEY != '' || secrets.QWEN_FALLBACK_5_API_KEY != '' || secrets.QWEN_FALLBACK_6_API_KEY != '' || secrets.QWEN_FALLBACK_7_API_KEY != '' || secrets.QWEN_FALLBACK_8_API_KEY != '' || secrets.QWEN_FALLBACK_9_API_KEY != '' || secrets.QWEN_FALLBACK_10_API_KEY != '' || secrets.QWEN_FALLBACK_11_API_KEY != '' || secrets.QWEN_FALLBACK_12_API_KEY != '' }}
      HAS_GEMINI: ${{ secrets.GEMINI_API_KEY != '' }}
      GEMINI_CLI_TRUST_WORKSPACE: 'true'
    steps:
      - id: meta
        name: Resolver rama y proveedor
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$BRANCH" =~ ^agent/(qwen|gemini)-([0-9]+)-([0-9]+)$ ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          provider="${BASH_REMATCH[1]}"
          issue="${BASH_REMATCH[2]}"
          owner="${GITHUB_REPOSITORY%%/*}"
          pr_json="$(gh api -X GET "repos/$GITHUB_REPOSITORY/pulls" -f state=open -f head="$owner:$BRANCH")"
          head_repo="$(jq -r '.[0].head.repo.full_name // empty' <<<"$pr_json")"
          head_sha="$(jq -r '.[0].head.sha // empty' <<<"$pr_json")"
          if [[ "$head_repo" != "$GITHUB_REPOSITORY" || "$head_sha" != "$RUN_SHA" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [[ "$provider" == qwen && "$HAS_QWEN_ANY" != true ]] || [[ "$provider" == gemini && "$HAS_GEMINI" != true ]]; then
            gh issue edit "$issue" --repo "$GITHUB_REPOSITORY" --add-label agent:needs-human >/dev/null 2>&1 || true
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "CI falló pero falta la API key de $provider para reparación automática." || true
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "provider=$provider" >> "$GITHUB_OUTPUT"
          echo "issue=$issue" >> "$GITHUB_OUTPUT"

      - name: Checkout de la rama
        if: steps.meta.outputs.run == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          persist-credentials: false

      - id: limit
        name: Limitar reparaciones
        if: steps.meta.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.meta.outputs.issue }}
        run: |
          n="$(git log --format=%s origin/main..HEAD | grep -c '^agent-ci-repair:' || true)"
          if (( n >= 2 )); then
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label agent:needs-human >/dev/null 2>&1 || true
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "Agent autopilot: CI sigue fallando tras 2 reparaciones automáticas; requiere revisión humana." || true
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "attempt=$((n+1))" >> "$GITHUB_OUTPUT"
          fi

      - id: claim
        name: Recuperar CLAIM activo
        if: steps.limit.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          # La rama reparada puede ser anterior al rollover. Recuperar siempre la
          # capa de reservas desde main antes de consultar #182 + registro activo.
          mkdir -p /tmp/capa182 /tmp/.github
          git fetch --quiet --depth 1 origin main
          for modulo in reservas_registro.py gestionar_reservas.py gestionar_reservas_rollover.py; do
            git show "FETCH_HEAD:scripts/$modulo" > "/tmp/capa182/$modulo"
          done
          git show "FETCH_HEAD:.github/reservas-registro.json" > /tmp/.github/reservas-registro.json
          python3 /tmp/capa182/gestionar_reservas_rollover.py --comments-output /tmp/reservas.json
          python3 /tmp/capa182/reservas_registro.py rutas \
            --comments /tmp/reservas.json --branch "$BRANCH" > /tmp/reserva.json
          if [[ "$(jq -r '.found' /tmp/reserva.json)" != true ]]; then
            echo "sin CLAIM activo" >&2
            exit 1
          fi
          jq -c '{files: .files}' /tmp/reserva.json > .agent-plan.json

      - name: Cargar Normas Platino, wiki y memoria
        if: steps.limit.outputs.run == 'true'
        env:
          ISSUE: ${{ steps.meta.outputs.issue }}
          PROVIDER: ${{ steps.meta.outputs.provider }}
          MEMORY_URL: ${{ vars.SIGA98_FEEDBACK_FALLBACK_URL }}
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/EspacioKoop/normas_platino.git .agent-platino
          git -C .agent-platino rev-parse HEAD > .agent-platino-sha
          rm -rf .agent-platino/.git

          if git clone --depth 1 https://github.com/EspacioKoop/expediente-legado.wiki.git .agent-wiki; then
            rm -rf .agent-wiki/.git
          else
            mkdir -p .agent-wiki
            printf '%s\n' '# Wiki no disponible en esta ejecución' > .agent-wiki/README.md
          fi

          printf '%s\n' '{"ok":true,"memories":[]}' > .agent-memory.json
          [[ -z "${MEMORY_URL:-}" ]] && exit 0
          base="${MEMORY_URL%/}"
          base="${base%/api/report}"
          paths="$(jq -c '.files' .agent-plan.json)"
          if oidc_json="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=siga98-agent-memory")" &&
            oidc_token="$(jq -er '.value' <<<"$oidc_json")"; then
            payload="$(jq -nc --argjson issue "$ISSUE" --arg provider "$PROVIDER" --argjson paths "$paths" \
              '{schema:1,issue:$issue,provider:$provider,paths:$paths}')"
            if curl -fsS -X POST "$base/api/agent-memory/search" \
              -H "Authorization: Bearer $oidc_token" \
              -H 'Content-Type: application/json' \
              --data "$payload" -o /tmp/agent-memory.json; then
              mv /tmp/agent-memory.json .agent-memory.json
            fi
          fi

      - name: Capturar logs fallidos
        if: steps.limit.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > .agent-ci-failure.log || \
            gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log > .agent-ci-failure.log
          cat > .agent-task.md <<'EOF'
          Corrige únicamente la causa concreta del CI fallido usando los logs.
          No rebajes, borres ni saltes tests, lint, mínimos o gates.
          Solo puedes modificar las rutas de .agent-plan.json.
          No hagas commit, push, PR ni merge.
          EOF

      - name: Cargar memoria histórica del fallo
        if: steps.limit.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s\n' '{"ok":true,"source":"ci-brain-sqlite","memories":[]}' > .agent-history.json
          if python3 scripts/ci_brain.py restore --sqlite /tmp/ci-brain.sqlite3 >/tmp/ci-brain-restore.json; then
            python3 scripts/ci_brain.py context \
              --sqlite /tmp/ci-brain.sqlite3 \
              --query-file .agent-ci-failure.log \
              --paths-json .agent-plan.json \
              --output .agent-history.json \
              >/dev/null
          fi

      - id: qwen
        name: Configurar Qwen
        if: steps.limit.outputs.run == 'true' && steps.meta.outputs.provider == 'qwen'
        env:
          KEY: ${{ secrets.QWEN_API_KEY }}
        run: |
          if [[ "$KEY" == sk-sp-* ]]; then
            echo "url=https://coding-intl.dashscope.aliyuncs.com/v1" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://dashscope-intl.aliyuncs.com/compatible-mode/v1" >> "$GITHUB_OUTPUT"
          fi
          echo "model=qwen3-coder-plus" >> "$GITHUB_OUTPUT"

      - id: repair_qwen
        name: Reparar con Qwen (primario)
        if: steps.limit.outputs.run == 'true' && steps.meta.outputs.provider == 'qwen' && env.HAS_QWEN == 'true'
        continue-on-error: true
        uses: QwenLM/qwen-code-action@05f81718976f3b7da657422e6e8e4d372b8621d7 # v1
        with:
          openai_api_key: ${{ secrets.QWEN_API_KEY }}
          openai_base_url: ${{ vars.QWEN_BASE_URL || steps.qwen.outputs.url }}
          openai_model: ${{ vars.QWEN_MODEL || steps.qwen.outputs.model }}
          qwen_cli_version: ${{ vars.QWEN_CLI_VERSION || 'latest' }}
          settings: '{"model":{"maxSessionTurns":30},"experimental":{"emitToolUseSummaries":false},"tools":{"core":["read_file","write_file","edit","glob","grep_search","list_directory"]}}'
          prompt: 'Lee AGENTS.md, QWEN.md, .agent-task.md, .agent-plan.json, .agent-ci-failure.log, .agent-memory.json, .agent-history.json y las Normas Platino actuales suministradas en .agent-platino; consulta .agent-wiki solo si aporta contexto. Repo/issue/#181/#182 y Normas Platino prevalecen siempre sobre wiki, memoria temporal y memoria histórica. Corrige solo la causa del CI y solo rutas del CLAIM. No ejecutes shell ni Git. Termina con AGENT_MEMORY_BEGIN seguido de JSON {"summary":"aprendizaje verificable sobre el fallo y su corrección, sin secretos","tags":["ci"]} y AGENT_MEMORY_END.'

      - id: qwen_fallbacks
        name: Resolver fallbacks Qwen dinámicos
        if: steps.limit.outputs.run == 'true' && steps.meta.outputs.provider == 'qwen' && steps.repair_qwen.outcome != 'success'
        env:
          VARS_JSON: ${{ toJSON(vars) }}
          FALLBACK_KEYS: >-
            ${{ secrets.QWEN_FALLBACK_1_API_KEY != '' && '1' || '' }}
            ${{ secrets.QWEN_FALLBACK_2_API_KEY != '' && '2' || '' }}
            ${{ secrets.QWEN_FALLBACK_3_API_KEY != '' && '3' || '' }}
            ${{ secrets.QWEN_FALLBACK_4_API_KEY != '' && '4' || '' }}
            ${{ secrets.QWEN_FALLBACK_5_API_KEY != '' && '5' || '' }}
            ${{ secrets.QWEN_FALLBACK_6_API_KEY != '' && '6' || '' }}
            ${{ secrets.QWEN_FALLBACK_7_API_KEY != '' && '7' || '' }}
            ${{ secrets.QWEN_FALLBACK_8_API_KEY != '' && '8' || '' }}
            ${{ secrets.QWEN_FALLBACK_9_API_KEY != '' && '9' || '' }}
            ${{ secrets.QWEN_FALLBACK_10_API_KEY != '' && '10' || '' }}
            ${{ secrets.QWEN_FALLBACK_11_API_KEY != '' && '11' || '' }}
            ${{ secrets.QWEN_FALLBACK_12_API_KEY != '' && '12' || '' }}
          BASE_KEYS: >-
            ${{ secrets.QWEN_API_KEY != '' && 'qwen' || '' }}
            ${{ secrets.GEMINI_API_KEY != '' && 'gemini' || '' }}
          DEFAULT_MODEL: ${{ vars.QWEN_MODEL || steps.qwen.outputs.model }}
        run: |
          set -euo pipefail
          mapfile -t workers < <(python3 scripts/agent_slots.py listar | jq -r '.[].worker')
          for idx in 1 2 3 4; do
            worker="${workers[$((idx - 1))]:-}"
            [[ -n "$worker" ]] || continue
            data="$(python3 scripts/agent_slots.py resolver --worker "$worker" --modelo-por-defecto "$DEFAULT_MODEL")"
            {
              echo "worker_$idx=$worker"
              echo "url_$idx=$(jq -r '.url' <<<"$data")"
              echo "model_$idx=$(jq -r '.model' <<<"$data")"
              echo "secret_$idx=$(jq -r '.secret' <<<"$data")"
            } >> "$GITHUB_OUTPUT"
          done

      - id: repair_qwen_fallback_1
        name: Reparar con Qwen (fallback dinámico 1)
        if: steps.limit.outputs.run == 'true' && steps.meta.outputs.provider == 'qwen' && steps.qwen_fallbacks.outputs.worker_1 != ''
        continue-on-error: true
        uses: QwenLM/qwen-code-action@05f81718976f3b7da657422e6e8e4d372b8621d7 # v1
        with:
          openai_api_key: ${{ secrets[steps.qwen_fallbacks.outputs.secret_1] }}
          openai_base_url: ${{ steps.qwen_fallbacks.outputs.url_1 }}
          openai_model: ${{ steps.qwen_fallbacks.outputs.model_1 }}
          qwen_cli_version: ${{ vars.QWEN_CLI_VERSION || 'latest' }}
          settings: '{"model":{"maxSessionTurns":30},"experimental":{"emitToolUseSummaries":false},"tools":{"core":["read_file","write_file","edit","glob","grep_search","list_directory"]}}'
          prompt: 'Lee AGENTS.md, QWEN.md, .agent-task.md, .agent-plan.json, .agent-ci-failure.log, .agent-memory.json, .agent-history.json y las Normas Platino actuales suministradas en .agent-platino; consulta .agent-wiki solo si aporta contexto. Repo/issue/#181/#182 y Normas Platino prevalecen siempre sobre wiki, memoria temporal y memoria histórica. Corrige solo la causa del CI y solo rutas del CLAIM. No ejecutes shell ni Git. Termina con AGENT_MEMORY_BEGIN seguido de JSON {"summary":"aprendizaje verificable sobre el fallo y su corrección, sin secretos","tags":["ci"]} y AGENT_MEMORY_END.'

      - id: repair_qwen_fallback_2
        name: Reparar con Qwen (fallback dinámico 2)
        if: steps.limit.outputs.run == 'true' && steps.meta.outputs.provider == 'qwen' && steps.qwen_fallbacks.outputs.worker_2 != '' && steps.repair_qwen_fallback_1.outcome != 'success'
        continue-on-error: true
        uses: QwenLM/qwen-code-action@05f81718976f3b7da657422e6e8e4d372b8621d7 # v1
        with:
          openai_api_key: ${{ secrets[steps.qwen_fallbacks.outputs.secret_2] }}
          openai_base_url: ${{ steps.qwen_fallbacks.outputs.url_2 }}
          openai_model: ${{ steps.qwen_fallbacks.outputs.model_2 }}
          qwen_cli_version: ${{ vars.QWEN_CLI_VERSION || 'latest' }}
          settings: '{"model":{"maxSessionTurns":30},"experimental":{"emitToolUseSummaries":false},"tools":{"core":["read_file","write_file","edit","glob","grep_search","list_directory"]}}'
          prompt: 'Lee AGENTS.md, QWEN.md, .agent-task.md, .agent-plan.json, .agent-ci-failure.log, .agent-memory.json, .agent-history.json y las Normas Platino actuales suministradas en .agent-platino; consulta .agent-wiki solo si aporta contexto. Repo/issue/#181/#182 y Normas Platino prevalecen siempre sobre wiki, memoria temporal y memoria histórica. Corrige solo la causa del CI y solo rutas del CLAIM. No ejecutes shell ni Git. Termina con AGENT_MEMORY_BEGIN seguido de JSON {"summary":"aprendizaje verificable sobre el fallo y su corrección, sin secretos","tags":["ci"]} y AGENT_MEMORY_END.'

      - id: repair_qwen_fallback_3
        name: Reparar con Qwen (fallback dinámico 3)
        if: steps.limit.outputs.run == 'true' && steps.meta.outputs.provider == 'qwen' && steps.qwen_fallbacks.outputs.worker_3 != '' && steps.repair_qwen_fallback_1.outcome != 'success' && steps.repair_qwen_fallback_2.outcome != 'success'
        continue-on-error: true
        uses: QwenLM/qwen-code-action@05f81718976f3b7da657422e6e8e4d372b8621d7 # v1
        with:
          openai_api_key: ${{ secrets[steps.qwen_fallbacks.outputs.secret_3] }}
          openai_base_url: ${{ steps.qwen_fallbacks.outputs.url_3 }}
          openai_model: ${{ steps.qwen_fallbacks.outputs.model_3 }}
          qwen_cli_version: ${{ vars.QWEN_CLI_VERSION || 'latest' }}
          settings: '{"model":{"maxSessionTurns":30},"experimental":{"emitToolUseSummaries":false},"tools":{"core":["read_file","write_file","edit","glob","grep_search","list_directory"]}}'
          prompt: 'Lee AGENTS.md, QWEN.md, .agent-task.md, .agent-plan.json, .agent-ci-failure.log, .agent-memory.json, .agent-history.json y las Normas Platino actuales suministradas en .agent-platino; consulta .agent-wiki solo si aporta contexto. Repo/issue/#181/#182 y Normas Platino prevalecen siempre sobre wiki, memoria temporal y memoria histórica. Corrige solo la causa del CI y solo rutas del CLAIM. No ejecutes shell ni Git. Termina con AGENT_MEMORY_BEGIN seguido de JSON {"summary":"aprendizaje verificable sobre el fallo y su corrección, sin secretos","tags":["ci"]} y AGENT_MEMORY_END.'

      - id: repair_qwen_fallback_4
        name: Reparar con Qwen (fallback dinámico 4)
        if: steps.limit.outputs.run == 'true' && steps.meta.outputs.provider == 'qwen' && steps.qwen_fallbacks.outputs.worker_4 != '' && steps.repair_qwen_fallback_1.outcome != 'success' && steps.repair_qwen_fallback_2.outcome != 'success' && steps.repair_qwen_fallback_3.outcome != 'success'
        continue-on-error: true
        uses: QwenLM/qwen-code-action@05f81718976f3b7da657422e6e8e4d372b8621d7 # v1
        with:
          openai_api_key: ${{ secrets[steps.qwen_fallbacks.outputs.secret_4] }}
          openai_base_url: ${{ steps.qwen_fallbacks.outputs.url_4 }}
          openai_model: ${{ steps.qwen_fallbacks.outputs.model_4 }}
          qwen_cli_version: ${{ vars.QWEN_CLI_VERSION || 'latest' }}
          settings: '{"model":{"maxSessionTurns":30},"experimental":{"emitToolUseSummaries":false},"tools":{"core":["read_file","write_file","edit","glob","grep_search","list_directory"]}}'
          prompt: 'Lee AGENTS.md, QWEN.md, .agent-task.md, .agent-plan.json, .agent-ci-failure.log, .agent-memory.json, .agent-history.json y las Normas Platino actuales suministradas en .agent-platino; consulta .agent-wiki solo si aporta contexto. Repo/issue/#181/#182 y Normas Platino prevalecen siempre sobre wiki, memoria temporal y memoria histórica. Corrige solo la causa del CI y solo rutas del CLAIM. No ejecutes shell ni Git. Termina con AGENT_MEMORY_BEGIN seguido de JSON {"summary":"aprendizaje verificable sobre el fallo y su corrección, sin secretos","tags":["ci"]} y AGENT_MEMORY_END.'

      - id: repair_gemini
        name: Reparar con Gemini
        if: steps.limit.outputs.run == 'true' && steps.meta.outputs.provider == 'gemini'
        uses: google-github-actions/run-gemini-cli@f77273f4c914e4bf38440cf36a0369cb64a37489 # v0.1.22
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: ${{ vars.GEMINI_MODEL }}
          gemini_cli_version: ${{ vars.GEMINI_CLI_VERSION || 'latest' }}
          settings: '{"model":{"maxSessionTurns":30},"tools":{"core":["read_file","write_file","replace","glob","grep_search","list_directory"]}}'
          prompt: 'Lee AGENTS.md, GEMINI.md, .agent-task.md, .agent-plan.json, .agent-ci-failure.log, .agent-memory.json, .agent-history.json y las Normas Platino actuales suministradas en .agent-platino; consulta .agent-wiki solo si aporta contexto. Repo/issue/#181/#182 y Normas Platino prevalecen siempre sobre wiki, memoria temporal y memoria histórica. Corrige solo la causa del CI y solo rutas del CLAIM. No ejecutes shell ni Git. Termina con AGENT_MEMORY_BEGIN seguido de JSON {"summary":"aprendizaje verificable sobre el fallo y su corrección, sin secretos","tags":["ci"]} y AGENT_MEMORY_END.'

      - name: Validar reparación
        if: steps.limit.outputs.run == 'true'
        run: |
          set -euo pipefail
          cp .agent-plan.json /tmp/plan.json
          rm -f .agent-task.md .agent-plan.json .agent-ci-failure.log .agent-memory.json .agent-history.json .agent-platino-sha gha-creds-*.json
          rm -rf .agent-platino .agent-wiki .gemini .qwen gemini-artifacts qwen-artifacts
          git add -A
          git diff --cached --quiet && { echo "el agente no produjo cambios"; exit 2; }
          python3 - <<'PY'
          import json,subprocess
          allowed=set(json.load(open("/tmp/plan.json"))["files"])
          changed=subprocess.check_output(["git","diff","--cached","--name-only"],text=True).splitlines()
          bad=[x for x in changed if x not in allowed]
          if bad: raise SystemExit("fuera de CLAIM: "+",".join(bad))
          stat=subprocess.check_output(["git","diff","--cached","--numstat"],text=True).splitlines()
          total=0
          for line in stat:
              a,d,_=line.split("\t",2)
              if a.isdigit(): total+=int(a)
              if d.isdigit(): total+=int(d)
          if total>8000: raise SystemExit("reparación demasiado grande")
          PY
          mapfile -t files < <(git diff --cached --name-only)
          gd=false; py=false; backend=false
          for f in "${files[@]}"; do
            [[ "$f" == *.gd ]] && gd=true
            [[ "$f" == scripts/*.py ]] && py=true
            [[ "$f" == backend/* ]] && backend=true
          done
          if [[ "$gd" == true ]]; then bash scripts/check_gdscript.sh
          elif [[ "$py" == true ]]; then python3 -m unittest discover -s scripts -p 'test_*.py'; fi
          if [[ "$backend" == true ]]; then (cd backend && mvn test && npm ci && npm test); fi

      - name: Guardar memoria de reparación
        if: steps.limit.outputs.run == 'true'
        continue-on-error: true
        env:
          ISSUE: ${{ steps.meta.outputs.issue }}
          PROVIDER: ${{ steps.meta.outputs.provider }}
          MEMORY_URL: ${{ vars.SIGA98_FEEDBACK_FALLBACK_URL }}
          SUMMARY: ${{ steps.repair_qwen.outputs.summary || steps.repair_qwen_fallback_1.outputs.summary || steps.repair_qwen_fallback_2.outputs.summary || steps.repair_qwen_fallback_3.outputs.summary || steps.repair_qwen_fallback_4.outputs.summary || steps.repair_gemini.outputs.summary }}
        run: |
          set -euo pipefail
          [[ -z "${MEMORY_URL:-}" ]] && exit 0
          printf '%s' "$SUMMARY" > /tmp/agent-summary.txt
          python3 - <<'PY'
          import json,re
          raw=open("/tmp/agent-summary.txt",encoding="utf-8").read()
          match=re.search(r"AGENT_MEMORY_BEGIN\s*(\{.*?\})\s*AGENT_MEMORY_END",raw,re.S)
          if not match:
              raise SystemExit(0)
          data=json.loads(match.group(1))
          summary=str(data.get("summary","")).strip()
          tags=data.get("tags",[])
          if len(summary)<20 or not isinstance(tags,list):
              raise SystemExit(0)
          open("/tmp/agent-memory-note.json","w",encoding="utf-8").write(
              json.dumps({"summary":summary,"tags":tags},ensure_ascii=False)
          )
          PY
          [[ -s /tmp/agent-memory-note.json ]] || exit 0
          base="${MEMORY_URL%/}"
          base="${base%/api/report}"
          paths="$(jq -c '.files' /tmp/plan.json)"
          payload="$(jq -c --argjson issue "$ISSUE" --arg provider "$PROVIDER" --argjson paths "$paths" \
            '. + {schema:1,issue:$issue,provider:$provider,paths:$paths}' /tmp/agent-memory-note.json)"
          oidc_json="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=siga98-agent-memory")"
          oidc_token="$(jq -er '.value' <<<"$oidc_json")"
          curl -fsS -X POST "$base/api/agent-memory/remember" \
            -H "Authorization: Bearer $oidc_token" \
            -H 'Content-Type: application/json' \
            --data "$payload" >/dev/null

      - name: Publicar reparación y relanzar CI
        if: steps.limit.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.meta.outputs.issue }}
          PROVIDER: ${{ steps.meta.outputs.provider }}
          ATTEMPT: ${{ steps.limit.outputs.attempt }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          git config user.name "agent-autopilot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "agent-ci-repair: intento $ATTEMPT para #$ISSUE ($PROVIDER)"
          gh auth setup-git
          git push origin HEAD:"$BRANCH"
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "Agent autopilot: reparación CI $ATTEMPT/2 publicada; relanzando CI."
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"

      - name: Marcar fallo de reparación
        if: failure() && steps.meta.outputs.issue != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.meta.outputs.issue }}
        run: |
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label agent:needs-human >/dev/null 2>&1 || true
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "Agent autopilot: la reparación automática no pudo completarse. Revisa $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true
