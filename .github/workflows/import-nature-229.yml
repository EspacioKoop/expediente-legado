name: Importar naturaleza #229

on:
  push:
    branches:
      - feature/229-naturaleza-periferia

permissions:
  contents: write

jobs:
  importar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/229-naturaleza-periferia

      - name: Descargar selección exacta del espejo fijado
        shell: bash
        run: |
          set -euo pipefail
          destino='godot/assets/cc0/quaternius_ultimate_nature'
          commit='ae16b37476c031075e4e767a848771b92ea5c4e0'
          base="https://raw.githubusercontent.com/Emaro/rovers-journey/${commit}/assets/models/Ultimate%20Nature%20Pack%20by%20Quaternius/OBJ"
          mkdir -p "$destino"
          for nombre in Bush_1 Bush_2 Rock_1 Rock_5; do
            curl --fail --location --retry 3 --silent --show-error \
              "$base/${nombre}.obj" -o "$destino/${nombre}.obj"
            curl --fail --location --retry 3 --silent --show-error \
              "$base/${nombre}.mtl" -o "$destino/${nombre}.mtl"
          done

      - name: Registrar procedencia y SHA-256
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          raiz = Path('godot/assets')
          procedencia = raiz / 'procedencia.json'
          datos = json.loads(procedencia.read_text(encoding='utf-8'))
          carpeta = Path('cc0/quaternius_ultimate_nature')
          fuente = 'https://quaternius.com/packs/ultimatenature.html'
          existentes = {ficha['ruta'] for ficha in datos['assets']}

          for nombre in ('Bush_1', 'Bush_2', 'Rock_1', 'Rock_5'):
              for extension in ('obj', 'mtl'):
                  ruta = carpeta / f'{nombre}.{extension}'
                  ruta_texto = ruta.as_posix()
                  contenido = (raiz / ruta).read_bytes()
                  ficha = {
                      'ruta': ruta_texto,
                      'titulo': f'{nombre} ({extension.upper()}) · Ultimate Nature Pack',
                      'autor': 'Quaternius',
                      'licencia': 'CC0-1.0',
                      'fuente': fuente,
                      'sha256': hashlib.sha256(contenido).hexdigest(),
                  }
                  if ruta_texto in existentes:
                      for indice, actual in enumerate(datos['assets']):
                          if actual['ruta'] == ruta_texto:
                              datos['assets'][indice] = ficha
                              break
                  else:
                      datos['assets'].append(ficha)
                      existentes.add(ruta_texto)

          procedencia.write_text(
              json.dumps(datos, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Commit de los originales y su trazabilidad
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add godot/assets/cc0/quaternius_ultimate_nature godot/assets/procedencia.json
          git diff --cached --check
          git commit -m 'assets(229): incorporar arbustos y rocas Quaternius CC0'
          git push origin HEAD:feature/229-naturaleza-periferia
