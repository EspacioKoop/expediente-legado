name: Evidencia Simurgh 658

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/evidencia-simurgh-658.yml'
      - '.godot-version'
      - 'godot/guion/sueno_simurgh.gd'
      - 'godot/guion/dia_simurgh_app.gd'
      - 'godot/pruebas/capturar_simurgh_658.gd'
      - 'scripts/test_evidencia_simurgh_658.py'
      - 'docs/evidencias/simurgh-658/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evidencia:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      GALLIUM_DRIVER: llvmpipe
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Instalar Godot declarado por el proyecto
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat .godot-version)"
          archivo="Godot_v${version}_linux.x86_64.zip"
          base="https://github.com/godotengine/godot-builds/releases/download/${version}"
          curl --fail --location --retry 3 "$base/$archivo" -o "$RUNNER_TEMP/$archivo"
          curl --fail --location --retry 3 "$base/SHA512-SUMS.txt" -o "$RUNNER_TEMP/SHA512-SUMS.txt"
          cd "$RUNNER_TEMP"
          grep -F " $archivo" SHA512-SUMS.txt | sha512sum --check --strict
          unzip -q "$archivo"
          mkdir -p godot-bin
          mv "Godot_v${version}_linux.x86_64" godot-bin/godot4
          chmod +x godot-bin/godot4
          echo "$RUNNER_TEMP/godot-bin" >> "$GITHUB_PATH"

      - name: Importar proyecto
        run: godot4 --headless --editor --path godot --quit

      - name: Validar contrato de evidencia
        run: python3 -m unittest -v scripts/test_evidencia_simurgh_658.py

      - name: Renderizar equivalencias sin HUD
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidencia-simurgh-658
          xvfb-run -a godot4 --path godot --rendering-method gl_compatibility \
            --script res://pruebas/capturar_simurgh_658.gd -- \
            "$GITHUB_WORKSPACE/evidencia-simurgh-658"
          for ancla in pluma archivos lampara; do
            test -s "evidencia-simurgh-658/${ancla}_escritorio.png"
            test -s "evidencia-simurgh-658/${ancla}_monumental.png"
          done
          test -s evidencia-simurgh-658/manifest.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          m = json.loads(Path("evidencia-simurgh-658/manifest.json").read_text())
          if m["issue"] != 658 or m["hud"] is not False:
              raise SystemExit("manifiesto incorrecto")
          if m["veredicto_automatico"] is not False or m["requiere_revision_humana"] is not True:
              raise SystemExit("el gate no puede autoaprobar legibilidad")
          casos = m["casos"]
          if len(casos) != 6:
              raise SystemExit("se esperaban seis capturas")
          por_ancla = {}
          for caso in casos:
              if caso["en_frustum"] is not True:
                  raise SystemExit(f"{caso['id']} fuera de frustum")
              por_ancla.setdefault(caso["ancla"], []).append(caso)
          if set(por_ancla) != {"pluma_puente", "archivos_montanas", "lampara_nido"}:
              raise SystemExit("faltan equivalencias")
          for ancla, pares in por_ancla.items():
              if {p["capa"] for p in pares} != {"escritorio", "monumental"}:
                  raise SystemExit(f"{ancla}: faltan capas")
              if len({p["sha256"] for p in pares}) != 2:
                  raise SystemExit(f"{ancla}: las dos escalas deben producir imágenes distintas")
          print("3/3 equivalencias cubiertas; comprensión pendiente de revisión humana")
          PY

      - name: Adjuntar evidencia visual
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidencia-simurgh-658-${{ github.sha }}
          path: evidencia-simurgh-658/
          if-no-files-found: error
          retention-days: 14
