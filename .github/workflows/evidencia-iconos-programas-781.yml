name: Evidencia iconos programas 781

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/evidencia-iconos-programas-781.yml'
      - '.github/actions/upload-artifact/**'
      - '.godot-version'
      - 'godot/arte/os98/iconos_programas_32.svg'
      - 'godot/arte/os98/iconos_programas_16.svg'
      - 'godot/guion/escritorio_siga.gd'
      - 'godot/guion/escritorio_siga_visual.gd'
      - 'godot/pruebas/capturar_iconos_programas_781.gd'
      - 'scripts/test_evidencia_iconos_programas_781.py'
      - 'docs/evidencias/iconos-programas-781/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evidencia:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      GALLIUM_DRIVER: llvmpipe
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Instalar Godot declarado por el proyecto
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat .godot-version)"
          archivo="Godot_v${version}_linux.x86_64.zip"
          base="https://github.com/godotengine/godot-builds/releases/download/${version}"
          curl --fail --location --retry 3 "$base/$archivo" -o "$RUNNER_TEMP/$archivo"
          curl --fail --location --retry 3 "$base/SHA512-SUMS.txt" -o "$RUNNER_TEMP/SHA512-SUMS.txt"
          cd "$RUNNER_TEMP"
          grep -F " $archivo" SHA512-SUMS.txt | sha512sum --check --strict
          unzip -q "$archivo"
          mkdir -p godot-bin
          mv "Godot_v${version}_linux.x86_64" godot-bin/godot4
          chmod +x godot-bin/godot4
          echo "$RUNNER_TEMP/godot-bin" >> "$GITHUB_PATH"

      - name: Importar proyecto
        run: godot4 --headless --editor --path godot --quit

      - name: Validar contrato de evidencia
        run: python3 -m unittest -v scripts/test_evidencia_iconos_programas_781.py

      - name: Renderizar iconos del escritorio y menú
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidencia-iconos-programas-781
          xvfb-run -a godot4 --path godot --rendering-method gl_compatibility \
            --script res://pruebas/capturar_iconos_programas_781.gd -- \
            "$GITHUB_WORKSPACE/evidencia-iconos-programas-781"
          test -s evidencia-iconos-programas-781/iconos-programas-32.png
          test -s evidencia-iconos-programas-781/iconos-programas-16.png
          test -s evidencia-iconos-programas-781/manifest.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path("evidencia-iconos-programas-781/manifest.json").read_text(encoding="utf-8")
          )
          esperados = {
              "explorador",
              "web98",
              "software",
              "correo",
              "bloc-notas",
              "calculadora",
              "catalogo-anomalias",
          }
          if manifest["issue"] != 781 or manifest["veredicto_automatico"] is not False:
              raise SystemExit("manifiesto inválido para #781")
          if manifest["resolucion"] != [1920, 1080]:
              raise SystemExit("la evidencia no usa el viewport canónico 1920x1080")
          ids = {programa["id"] for programa in manifest["programas"]}
          if ids != esperados:
              raise SystemExit(f"identidades inesperadas: {sorted(ids)}")
          archivos = {captura["archivo"] for captura in manifest["capturas"]}
          if archivos != {"iconos-programas-32.png", "iconos-programas-16.png"}:
              raise SystemExit(f"capturas inesperadas: {sorted(archivos)}")
          print("7/7 identidades y 2/2 superficies listas para revisión humana")
          PY

      - name: Adjuntar evidencia visual de #781
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: evidencia-iconos-programas-781-${{ github.sha }}
          path: evidencia-iconos-programas-781/
          if-no-files-found: error
          retention-days: 14
