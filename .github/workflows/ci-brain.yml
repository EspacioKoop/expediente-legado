name: CI brain

on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-brain
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Recoger ventana reciente de Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci_brain.py collect \
            --sqlite dist/.cache/ci-brain.sqlite3 \
            --hours 12 \
            --limit 40

      - name: Generar resumen
        run: |
          python3 scripts/ci_brain.py summary \
            --sqlite dist/.cache/ci-brain.sqlite3 \
            --output dist/.cache/ci-brain-summary.json \
            | tee /tmp/ci-brain-summary.json

          {
            echo '## CI brain'
            echo
            echo '```json'
            cat /tmp/ci-brain-summary.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sincronizar memoria SQLite con Turso (opcional)
        env:
          TURSO_DATABASE_URL: ${{ vars.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$TURSO_DATABASE_URL" && -z "$TURSO_AUTH_TOKEN" ]]; then
            echo "Turso no configurado; se conserva únicamente el snapshot SQLite."
            exit 0
          fi
          if [[ -z "$TURSO_DATABASE_URL" || -z "$TURSO_AUTH_TOKEN" ]]; then
            echo "ERROR: configura TURSO_DATABASE_URL y TURSO_AUTH_TOKEN conjuntamente." >&2
            exit 2
          fi
          python3 scripts/ci_brain.py sync-turso \
            --sqlite dist/.cache/ci-brain.sqlite3

      - name: Adjuntar snapshot compacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-brain-${{ github.run_id }}
          path: |
            dist/.cache/ci-brain.sqlite3
            dist/.cache/ci-brain-summary.json
          if-no-files-found: warn
          retention-days: 14
