name: CI brain

on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-brain
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Recuperar snapshot anterior (si existe)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/.cache
          previous="$(gh run list \
            --workflow ci-brain.yml \
            --branch main \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')"
          if [[ -z "$previous" ]]; then
            echo "Primer snapshot: no existe una ejecución anterior."
            exit 0
          fi

          destino="$RUNNER_TEMP/ci-brain-prev"
          mkdir -p "$destino"
          if ! gh run download "$previous" \
            --name "ci-brain-$previous" \
            --dir "$destino"; then
            echo "El run anterior no conserva artifact; se inicia un snapshot nuevo."
            exit 0
          fi

          anterior="$(find "$destino" -name ci-brain.sqlite3 -print -quit)"
          if [[ -n "$anterior" ]]; then
            cp "$anterior" dist/.cache/ci-brain.sqlite3
            echo "Snapshot $previous recuperado."
          fi

      - name: Recoger ventana y fingerprints recientes de Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci_brain.py collect \
            --sqlite dist/.cache/ci-brain.sqlite3 \
            --hours 12 \
            --limit 40

      - name: Generar resumen
        run: |
          python3 scripts/ci_brain.py summary \
            --sqlite dist/.cache/ci-brain.sqlite3 \
            --output dist/.cache/ci-brain-summary.json \
            | tee /tmp/ci-brain-summary.json

          {
            echo '## CI brain'
            echo
            echo '```json'
            cat /tmp/ci-brain-summary.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sincronizar memoria SQLite con Turso (opcional)
        env:
          TURSO_DATABASE_URL: ${{ vars.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$TURSO_DATABASE_URL" && -z "$TURSO_AUTH_TOKEN" ]]; then
            echo "Turso no configurado; se conserva únicamente el snapshot SQLite."
            exit 0
          fi
          if [[ -z "$TURSO_DATABASE_URL" || -z "$TURSO_AUTH_TOKEN" ]]; then
            echo "ERROR: configura TURSO_DATABASE_URL y TURSO_AUTH_TOKEN conjuntamente." >&2
            exit 2
          fi
          python3 scripts/ci_brain.py sync-turso \
            --sqlite dist/.cache/ci-brain.sqlite3

      - name: Adjuntar snapshot compacto
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-brain-${{ github.run_id }}
          path: |
            dist/.cache/ci-brain.sqlite3
            dist/.cache/ci-brain-summary.json
          if-no-files-found: warn
          retention-days: 14
