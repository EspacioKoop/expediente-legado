name: OmniRoute private smoke

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMNIROUTE_BASE_URL: ${{ vars.OMNIROUTE_BASE_URL }}
      OMNIROUTE_MODEL: ${{ vars.OMNIROUTE_MODEL }}
      HAS_TS_OAUTH: ${{ secrets.TS_OAUTH_CLIENT_ID != '' && secrets.TS_OAUTH_SECRET != '' }}
      HAS_TS_OIDC: ${{ secrets.TS_OAUTH_CLIENT_ID != '' && secrets.TS_AUDIENCE != '' }}
    steps:
      - name: Validar configuración
        env:
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          set -euo pipefail
          test -n "$OMNIROUTE_BASE_URL"
          test -n "$OMNIROUTE_MODEL"
          test -n "$OMNIROUTE_API_KEY"
          test -n "$TS_OAUTH_CLIENT_ID"
          if [[ -z "$TS_OAUTH_SECRET" && -z "$TS_AUDIENCE" ]]; then
            echo "Falta TS_OAUTH_SECRET (OAuth) o TS_AUDIENCE (OIDC)" >&2
            exit 2
          fi

      - name: Mostrar claims OIDC seguros
        if: env.HAS_TS_OAUTH != 'true' && env.HAS_TS_OIDC == 'true'
        env:
          TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
        run: |
          set -euo pipefail
          encoded_audience="$(python3 - <<'PY'
          import os, urllib.parse
          print(urllib.parse.quote(os.environ["TS_AUDIENCE"], safe=""))
          PY
          )"
          oidc_json="$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${encoded_audience}")"
          token="$(jq -er '.value' <<<"$oidc_json")"
          TOKEN="$token" python3 - <<'PY'
          import base64, json, os

          payload = os.environ["TOKEN"].split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          safe = {
              key: claims.get(key)
              for key in (
                  "iss",
                  "sub",
                  "repository",
                  "repository_id",
                  "repository_owner",
                  "repository_owner_id",
                  "workflow",
                  "workflow_ref",
                  "ref",
                  "ref_type",
                  "event_name",
                  "runner_environment",
              )
          }
          print(json.dumps(safe, indent=2, sort_keys=True))
          PY
          unset token oidc_json

      - name: Entrar en la tailnet (OAuth)
        if: env.HAS_TS_OAUTH == 'true'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-autopilot

      - name: Entrar en la tailnet (OIDC fallback)
        if: env.HAS_TS_OAUTH != 'true' && env.HAS_TS_OIDC == 'true'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:github-autopilot

      - name: Comprobar catálogo privado
        env:
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
        run: |
          set -euo pipefail
          base="${OMNIROUTE_BASE_URL%/}"
          curl --fail --silent --show-error --retry 2 --retry-all-errors --max-time 20 \
            -H "Authorization: Bearer $OMNIROUTE_API_KEY" \
            "$base/models" > /tmp/omniroute-models.json
          jq -e '.data | type == "array" and length > 0' /tmp/omniroute-models.json >/dev/null
          echo "OmniRoute models: $(jq '.data | length' /tmp/omniroute-models.json)"

      - name: Probar routing de coding
        env:
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
        run: |
          set -euo pipefail
          base="${OMNIROUTE_BASE_URL%/}"
          jq -nc --arg model "$OMNIROUTE_MODEL" '{
            model:$model,
            messages:[{role:"user",content:"Respond exactly with OMNIROUTE_OK"}],
            max_tokens:32,
            temperature:0
          }' > /tmp/request.json

          curl --fail --silent --show-error --retry 2 --retry-all-errors --max-time 60 \
            -H "Authorization: Bearer $OMNIROUTE_API_KEY" \
            -H "Content-Type: application/json" \
            --data @/tmp/request.json \
            "$base/chat/completions" > /tmp/response.json

          content="$(jq -r '.choices[0].message.content // empty' /tmp/response.json)"
          selected_model="$(jq -r '.model // "unknown"' /tmp/response.json)"
          echo "Modelo seleccionado por OmniRoute: $selected_model"
          test "$content" = "OMNIROUTE_OK"
          echo "OMNIROUTE_SMOKE_OK"
