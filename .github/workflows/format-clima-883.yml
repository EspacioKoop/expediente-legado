name: Formato clima #883

on:
  push:
    branches: [ feat/883-clima-v2 ]
    paths:
      - '.github/workflows/format-clima-883.yml'

permissions:
  contents: write

jobs:
  formato:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/883-clima-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Aplicar contrato canónico
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'gdtoolkit==4.3.4'
          python - <<'PY'
          from pathlib import Path
          path = Path('godot/guion/dia_clima_visual_app.gd')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'var actual := material.get_shader_parameter(parametro)',
              'var actual = material.get_shader_parameter(parametro)',
          )
          path.write_text(text, encoding='utf-8')
          PY
          gdformat godot/guion/dia_clima_visual_app.gd
          gdformat --check godot/guion/dia_clima_visual_app.gd
          gdlint godot/guion/dia_clima_visual_app.gd
      - name: Incorporar formato a la rama
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- godot/guion/dia_clima_visual_app.gd; then
            echo 'Sin cambios de formato'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add godot/guion/dia_clima_visual_app.gd
          git commit -m 'style(gdscript): aplicar formato canónico al clima v2 (#883)'
          git push origin HEAD:feat/883-clima-v2
