name: Evidencia sueño 284

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/evidencia-sueno-284.yml'
      - '.godot-version'
      - 'godot/guion/sueno*.gd'
      - 'godot/escenas/suenos/props_284/**'
      - 'godot/pruebas/capturar_sueno_284.gd'
      - 'scripts/test_evidencia_sueno_284.py'
      - 'docs/evidencias/sueno-284/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evidencia:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      GALLIUM_DRIVER: llvmpipe
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Instalar Godot declarado por el proyecto
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat .godot-version)"
          archivo="Godot_v${version}_linux.x86_64.zip"
          base="https://github.com/godotengine/godot-builds/releases/download/${version}"
          curl --fail --location --retry 3 "$base/$archivo" -o "$RUNNER_TEMP/$archivo"
          curl --fail --location --retry 3 "$base/SHA512-SUMS.txt" -o "$RUNNER_TEMP/SHA512-SUMS.txt"
          cd "$RUNNER_TEMP"
          grep -F " $archivo" SHA512-SUMS.txt | sha512sum --check --strict
          unzip -q "$archivo"
          mkdir -p godot-bin
          mv "Godot_v${version}_linux.x86_64" godot-bin/godot4
          chmod +x godot-bin/godot4
          echo "$RUNNER_TEMP/godot-bin" >> "$GITHUB_PATH"

      - name: Importar proyecto
        run: godot4 --headless --editor --path godot --quit

      - name: Validar contrato de evidencia
        run: python3 -m unittest -v scripts/test_evidencia_sueno_284.py

      - name: Renderizar las cuatro identidades sin HUD
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidencia-sueno-284
          xvfb-run -a godot4 --path godot --rendering-method gl_compatibility \
            --script res://pruebas/capturar_sueno_284.gd -- \
            "$GITHUB_WORKSPACE/evidencia-sueno-284"
          test -s evidencia-sueno-284/castillo.png
          test -s evidencia-sueno-284/montana.png
          test -s evidencia-sueno-284/desierto.png
          test -s evidencia-sueno-284/escuela_general.png
          test -s evidencia-sueno-284/escuela_contenido.png
          test -s evidencia-sueno-284/manifest.json

      - name: Adjuntar evidencia comparativa
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-sueno-284-${{ github.sha }}
          path: evidencia-sueno-284/
          if-no-files-found: error
          retention-days: 14
