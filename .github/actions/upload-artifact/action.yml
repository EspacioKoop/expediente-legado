name: Upload artifact pinned
description: Punto único para subir artifacts con actions/upload-artifact fijado por SHA.

inputs:
  name:
    description: Nombre del artifact.
    required: true
  path:
    description: Ruta, glob o lista multilínea de rutas a publicar.
    required: true
  if-no-files-found:
    description: Comportamiento si no se encuentra ningún fichero.
    required: false
    default: warn
  retention-days:
    description: Días de retención; 0 conserva la política por defecto del repositorio.
    required: false
    default: "0"

runs:
  using: composite
  steps:
    - name: Upload artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
