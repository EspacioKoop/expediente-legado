<svg xmlns="http://www.w3.org/2000/svg" width="640" height="128" viewBox="0 0 640 128" shape-rendering="crispEdges">
  <!-- Cinco muestras 128x128: panel, papel, rejilla, borde de ventana y barra de título. -->
  <defs>
    <pattern id="ruido-panel" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#a9bac4"/><rect x="1" y="1" width="1" height="1" fill="#bcc8cf"/><rect x="5" y="3" width="1" height="1" fill="#8fa2ad"/><rect x="3" y="6" width="1" height="1" fill="#b7c5cc"/></pattern>
    <pattern id="papel" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#e7e3da"/><rect x="2" y="3" width="1" height="1" fill="#d7d1c6"/><rect x="7" y="6" width="1" height="1" fill="#f2efe8"/></pattern>
    <pattern id="rejilla" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#bfc4c2"/><path d="M0 0h8M0 0v8" stroke="#7f8988" stroke-width="1"/></pattern>
  </defs>
  <g id="textura-fondo-panel"><rect width="128" height="128" fill="url(#ruido-panel)"/></g>
  <g id="textura-papel" transform="translate(128 0)"><rect width="128" height="128" fill="url(#papel)"/></g>
  <g id="textura-rejilla" transform="translate(256 0)"><rect width="128" height="128" fill="url(#rejilla)"/></g>
  <g id="textura-borde-ventana" transform="translate(384 0)"><rect x="8" y="8" width="112" height="112" fill="#bdbdb8"/><path d="M8 120V8h112" fill="none" stroke="#f8f8f4" stroke-width="6"/><path d="M120 8v112H8" fill="none" stroke="#555752" stroke-width="6"/><path d="M14 114V14h100" fill="none" stroke="#d9d9d4" stroke-width="2"/><path d="M114 14v100H14" fill="none" stroke="#7c7d78" stroke-width="2"/></g>
  <g id="textura-barra-titulo" transform="translate(512 0)"><rect width="128" height="128" fill="#173a5c"/><rect y="0" width="128" height="6" fill="#345f80"/><rect y="6" width="128" height="3" fill="#6d8fa8"/><path d="M0 18h128M0 22h128M0 26h128" stroke="#244c6d" stroke-width="1" opacity=".65"/></g>
</svg>
