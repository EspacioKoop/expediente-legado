<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <title>Pegatinas y carteles comerciales genéricos, 1998</title>
  <desc>Hoja vectorial original sin marcas reales. Fondo transparente. Cada cartel está en un grupo con id.</desc>

  <g id="abierto" transform="translate(55 55)">
